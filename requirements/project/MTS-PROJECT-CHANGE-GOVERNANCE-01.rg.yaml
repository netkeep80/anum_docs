format: repo-guard/requirement-v1
id: MTS-PROJECT-CHANGE-GOVERNANCE-01
normative: "The repository must retain its declared license and contribution/change discipline, run branch hygiene, and preserve the legacy 3.2.4 RepoGuard blocking workflow only as an explicitly temporary platform control until separately authorized v6.0.1 replacement. Current historical-image integrity is checked independently; this Requirement is not a central path whitelist or permission to weaken platform merge protection."
lifecycle:
  accepted: false
  current: false
relations:
  - predicates: [requires]
    target:
      kind: artifact
      path: LICENSE
  - predicates: [requires]
    target:
      kind: artifact
      path: docs/CONTRIBUTING.md
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: .github/workflows/branch-hygiene.yml
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: .github/workflows/repo-guard.yml
  - predicates: [verified_by]
    target:
      kind: artifact
      path: ts/test/historical-images-protection.test.ts
