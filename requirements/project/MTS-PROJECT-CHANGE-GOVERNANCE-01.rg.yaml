format: repo-guard/requirement-v1
id: MTS-PROJECT-CHANGE-GOVERNANCE-01
normative: "The repository must retain its declared license and contribution/change discipline, run branch hygiene, and enforce the blocking RepoGuard gate through exact immutable pull-request BASE/HEAD snapshots pinned to accepted RepoGuard v6.0.1. The legacy repo-policy.json remains a temporary compatibility/governance input pending separate bounded retirement; this Requirement is not a central path whitelist or permission to weaken platform merge protection."
