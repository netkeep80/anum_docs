anet:
  heading_ru: "R01. Асеть связей (ANet): математическая принадлежность и семантические роли"
  universe_ru: "Пусть F:Foundation — внешняя односортная математическая интерпретация с носителем F.Link. Для исследования семантической асети выбираем предикат принадлежности M:F.Link→Prop и пишем x∈A тогда и только тогда, когда M(x). Эта запись означает внешнюю логическую проекцию асети, а не введение в МТС второй онтологической сущности Set, отдельного вида Link или дополнительной конструктивной операции над Link. В общей постановке не предполагаются ни конечность A, ни разрешимость M(x)."
  equality_ru: "Для внешних предикатных представлений A,B определим A≈B :⇔ ∀x:F.Link, (x∈A ↔ x∈B). Это экстенсиональная эквивалентность запросов принадлежности, а не подмена собственным логическим равенством = в МТС: исполняемое МТС-сравнение Связей возвращает L/U. Вывод GPR-02 записан поточечно через ↔; превращение эквивалентности предикатов в равенство функций потребовало бы дополнительных принципов внешнего метаязыка, и для данной цели не требуется."
  membership_ru: "Добавление канонической Связи a к семантической асети определяется предикатом Add(A,a)(x) :⇔ (x=a)∨(x∈A), где = внутри формулы есть равенство внешнего проверочного метаязыка на F.Link. Для любого x логически следует Add(Add(A,a),a)(x)↔Add(A,a)(x). Для любых a,b, x следует Add(Add(A,a),b)(x)↔Add(Add(A,b),a)(x). Эти результаты не требуют конечного носителя, глобального алгоритма разрешения равенств, сортировки, хеширования или особой команды удаления дубликатов."
  layers_ru: "Следует строго различать четыре уровня: (1) наличие или канонизация Связи в памяти; (2) вхождение source ANet с его синтаксической ролью и координатой; (3) результат разрешения имён и денотации DAS, включая возможность ошибки; (4) принадлежность канонической Link семантической ANet. Различные исходные вхождения могут обозначать одну Link, однако источник и события доказательства не обязаны исчезать. Обратное неверно: физическое присутствие объекта Link ещё не доказывает его принадлежность выбранной асети."
  provenance_ru: "Два события (a,p₁), (a,p₂) могут сохраняться как два элемента внешней последовательности свидетельств, хотя семантический запрос x∈Add(Add(A,a),a) идемпотентен. Теорема GPR_02_duplicate_provenance_events_are_preserved доказывает длину именно списка из двух событий и наличие события для a, а не неравенство самих p₁ и p₂. Поэтому нельзя делать из неё вывод о двух различных происхождениях, если p₁=p₂, или о физическом числе записей в хранилище."
  context_ru: "Контекстно выбранные роли Theory, Rule, entry, result и отношение currentness не принадлежат Связи вне контекста как внутренний host-тег. Их смысл задаётся принадлежностью и отношениями Link внутри выбранной семантической асети. Одна Link может иметь разные роли при различных контекстах только если соответствующие отношения принадлежности различны; различие файловых имён или дескрипторов не создаёт семантической роли. Внешняя таблица отношений — средство исследования, не независимая онтология."
  decidability_ru: "Включение Link в математическое представление асети не требует, чтобы любое произвольное M(x) можно было вычислить. Конкретная материализованная finite-сессия может предоставить конечные перечисления и разрешимые запросы при заданном memory/interface, но это дополнительный алгоритмический контракт. Из GPR-02 не следует полное перечисление всех возможных ANet, тождество source с semantic ANet или тотальность Γ на произвольных неграундированных структурах."
  limits_ru: "Теоремы GPR-02 доказаны для внешнего предиката принадлежности, списка событий provenance и отдельно сконструированного ExactPackedLink. Они не доказывают глобальной нормализации всех Link, уникальности физической записи, корректности всякой реализации DAS или формального refinement всего production Γ. Проверенные v0.15 источники разделяют семантическую авторитетность и технические формы; устранение этой границы было бы новым недоказанным утверждением."
sequence:
  heading_ru: "R02. ExactSequence и F_R: позиционная кратность, левый обратный и коллизия свёртки"
  definition_ru: "Позиционная ExactSequence — конечная последовательность [x₁,…,xₙ] элементов одного Link-носителя с сохранением длины, порядка и повторений. Во внешней проекции используется отображение encode:List(Link)→Link с выделенным носителем для [] и частичным или условным обратным read на корректных carrier. Список является инструментом метатеории Lean4/Rocq для проверки последовательности, а не новым сортом МТС. Утверждения о равенстве carrier относятся к принятому ExactSequence-профилю, а не ко всем возможным сериализациям."
  construction_ru: "В принятом TypeScript-профиле materializeExactSequence начинает с R и для каждого значения v формирует payload=form(prev,v), затем Cell(prev,v)=ensureStartSelfClosed(payload); новое значение prev — получившаяся Link. При чтении readExactSequence проверяет start(Cell)=Cell, извлекает полюса payload и движется к R, отвергая циклы и некорректные структуры без материализации новых Связей. Здесь ensureStartSelfClosed — операция формирования самозамкнутого начала, а не проекция start(x). Утверждение roundtrip ограничено корректно созданными carrier и предпосылками поддерживаемой реализации."
  examples_ru: "При корректном инъективном кодировании [] означает ноль позиций и кодируется выделенным R; [R] имеет одну позицию, содержащую R; [R,R] — две позиции со значением R. Поэтому encode([])≠encode([R]), encode([R])≠encode([R,R]), а также encode([X])≠encode([X,X]). Перестановка [X,Y] и [Y,X] даёт различные carrier при X≠Y. Идемпотентность ANet membership к этим позиционным сравнениям неприменима."
  proof_ru: "FRM_04_empty_exact_sequence_is_root следует из предпосылки K.emptyRoot; FRM_04_single_root_distinct_from_empty и FRM_04_two_roots_distinct_from_one используют K.injective. Независимая FRM_07_exact_sequence_injective_from_left_inverse выводит инъективность E.encode из условия ∀xs, E.read(E.encode(xs))=xs. Следовательно, FRM-04 не является доказательством произвольного производственного кодека без контракта инъективности, а FRM-07 не доказывает сам по себе существование тотального read для всех Link."
  fold_ru: "F_R — отдельная производная свёртка последовательности, не её позиционный носитель и не её семантическая асеть. В AcceptedV014RepresentationDefinitions явно предусмотрены разные carrier exactEmpty≠exactOneRoot и предпосылки exactFold(exactEmpty)=R, exactFold(exactOneRoot)=R. Из них Lean4/Rocq доказывают exact_sequence_fold_collision: два разных carrier имеют одинаковый образ свёртки. Это условный результат для данного представительного интерфейса, а не запрет на любые инъективные кодирования последовательностей и не утверждение, что любая операция свёртки обязательно коллидирует."
  surface_ru: "Канонические FORMAL-квадратные скобки и JSON-массивы проходят согласованный путь денотации через native source ANet и ExactSequence из уже разрешённых Link. Утверждение об их совпадении относится к одинаковому source и выбранному профилю; нельзя отождествлять байтовые записи, синтаксические вхождения и конечную семантическую Link. Исполнительное значение NO_MATCH относится к правилу Γ и не является элементом позиционной последовательности и не дополняет её грамматику."
  counterexample_ru: "Контрпример смешению двух уровней: вклад a два раза не меняет ответ на запрос семантической принадлежности a, но последовательности [a] и [a,a] различаются. Контрпример неинъективности F_R: [] и [R] имеют различную длину и разные точные carrier, а объявленная в FND-11 свёртка переводит оба в R. Нельзя использовать F_R для восстановления длины, порядка или повторов исходной последовательности без дополнительного отдельного кода."
  limits_ru: "Доказанные в Lean4/Rocq структурные законы, TypeScript B7 с FORMAL-паритетом и проверенный JSON-корпус подтверждают выбранные области применимости, но ещё не составляют единую глобальную теорему о безошибочности каждого production-парсера, сериализатора и хранилища. Вопросы полной kernel-связи с production и алгоритмической разрешимости произвольного Link остаются открытыми; авторская приёмка нового русского текста не проводилась."
