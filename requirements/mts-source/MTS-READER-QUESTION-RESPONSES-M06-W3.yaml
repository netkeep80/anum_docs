cases:
  - id: B-1.1
    owner: F01
    original_question_ru: >-
      Правильно ли я понимаю Foundation как одно-сортную теорию с носителем Link,
      бинарной функцией form : Link×Link→Link, унарными функциями start, finish : Link→Link и
      константой R, удовлетворяющими start(form(a,b))=a, finish(form(a,b))=b и form(R,R)=R? Если
      да, где приведена точная формальная сигнатура и полный список аксиом без
      редакционных пояснений? (стр. 4)
    classification: TOTAL_ONE_SORTED_SIGNATURE
    evidence_symbols: [Foundation, form_start, form_finish, root_self]
    answer_ru: >-
      Да. Внешний математический Foundation задаётся одним типом Link, тотальными
      операциями form : Link→Link→Link и start, finish : Link→Link и константой
      R : Link. Законы именно три: start(form(a,b))=a,
      finish(form(a,b))=b для всех a,b и form(R,R)=R. В Lean4 это поля
      структуры Foundation, в Rocq — поля Record Foundation; запись
      Link×Link→Link эквивалентна каррированной форме для бинарной
      операции. Никаких требований сюръективности form, глобальной
      полюсной экстенсиональности или глобального разрешения равенства
      в этой сигнатуре нет. O/C, инверсия, Grounded и нормализация
      вводятся отдельно и не являются скрытыми полями Foundation.
    limitation_ru: >-
      Это описание именно формальной сигнатуры, а не всей МТС, не
      механизма исполнения Γ и не универсального кодека. Поля в
      Lean4/Rocq выступают как доказательные требования структуры,
      а не как утверждение о физической конечной базе всех Link.
      Рецензент пока не подтвердил полноту соответствующего
      самостоятельного раздела рукописи; научный статус OPEN.
    scientific_status: OPEN
  - id: B-1.2
    owner: F05
    original_question_ru: >-
      Из двух уравнений для start и finish следует инъективность form: form(a,b)=form(c,d) ⇒
      a=c и b=d. Используется ли это как теорема Foundation? Если да, почему этот важный факт
      не сформулирован явно?
    classification: GENERAL_INJECTIVITY_THEOREM
    evidence_symbols: [fnd13_form_injective, form_start, form_finish]
    answer_ru: >-
      Да. Формальная теорема fnd13_form_injective уже доказана парно
      в Lean4 и Rocq. Из form(a,b)=form(c,d) применением start
      следует a=c, применением finish следует b=d. Обратное
      направление следует подстановкой равных аргументов в form.
      Поэтому конструктор образует инъекцию Link×Link→Link для
      любого Foundation без A1, F2F3, Grounded или нормализации.
      Этот факт используется и в доказательстве попарной различимости
      L=form(O,C) и U=form(C,O) при O≠C, но он не означает
      сюръективности form на произвольные ambient Link.
    limitation_ru: >-
      Инъективность есть известное следствие законов двух проекций,
      а не новая самостоятельная математическая аксиома МТС.
      Инъекция не даёт глобального закона
      form(start(x),finish(x))=x и не задаёт полюсную
      экстенсиональность вне соответствующих областей. Авторская
      научная приёмка отдельного ответа не зафиксирована.
    scientific_status: OPEN
  - id: B-1.5
    owner: F01
    original_question_ru: >-
      Какой тип моделей имеется в виду: обычные множества с тотальными функциями,
      коиндуктивные/нефундированные графы, частичные структуры или что-то ещё? Это
      существенно из-за уравнений R=form(R,R), O=form(O,R), C=form(R,C).
    classification: MODEL_UNIVERSE_BOUNDARY
    evidence_symbols: [Foundation, ExplicitFoundation, ModelLink, decode_form]
    answer_ru: >-
      Формальная работа фиксирует Foundation как алгебраическую структуру
      над носителем Link : Type с тотальными функциями. В обычной
      математической интерпретации это допускает носитель-множество
      и соответствующие тотальные отображения. Принятая явная модель
      имеет носитель ModelLink=List Bool, то есть конечные списки
      битов как элементы бесконечного типа, и специальные функции
      form/start/finish, удовлетворяющие трём законам Foundation.
      Поэтому уравнение R=form(R,R) и условные уравнения O=form(O,R),
      C=form(R,C) не требуют буквального циклического объекта в
      памяти: они могут выполняться для элементов обычного типа.
      Теория допускает исследования коиндуктивных и графовых
      реализаций, но ни их всеобщая эквивалентность, ни частичный
      конструктор не входят в данный принятый контракт Foundation.
    limitation_ru: >-
      Не следует отождествлять метатеоретическую интерпретацию
      тотального Foundation с конкретной моделью LinksDB или с
      автоматическим существованием всех коиндуктивных объектов.
      Конечный хранимый фрагмент не является автоматически замкнутой
      тотальной моделью. Условные O/C не следуют из трёх базовых
      законов без отдельного F2F3-свидетельства; вопрос остаётся OPEN.
    scientific_status: OPEN
  - id: B-1.6
    owner: F02
    original_question_ru: >-
      Предъявлена ли явная нетривиальная модель Foundation, содержащая одновременно R,
      собственные O и C, L=form(O,C), U=form(C,O) и все структуры, используемые далее?
      Консистентность отдельных интерфейсов не гарантирует их совместную реализуемость.
    classification: JOINT_EXPLICIT_MODEL_WITH_SCOPE_LIMIT
    evidence_symbols: [ExplicitFoundation, ExplicitOneSided, ExplicitInversionDomain, ExplicitGroundedNormalization, explicit_a1, M06_W2_joint_model_witness, F03_basis_five_pairwise_distinct]
    answer_ru: >-
      Да, для перечисленных математических интерфейсов Foundation,
      F2F3OneSidedExistence, A1RecursiveSeparation,
      F2F3GroundedNormalization и RecursiveInversionDomain.
      В принятой явной модели носитель ModelLink=List Bool,
      R=[]; выбранные O и C заданы единым ExplicitOneSided,
      а L=form(O,C), U=form(C,O) определяются тем же form.
      Одни и те же операции ExplicitFoundation поддерживают
      ExplicitOneSided, ExplicitInversionDomain,
      ExplicitGroundedNormalization и explicit_a1.
      Парная теорема M06_W2_joint_model_witness проверяет
      совместную обитаемость этих интерфейсов; отдельная
      F03_basis_five_pairwise_distinct доказывает десять
      различий между R,O,C,L,U при F2F3OneSidedExistence.
      Это совместность структур на одном носителе, а не
      набор несовместимых моделей.
    limitation_ru: >-
      Вывод относится ровно к названным пяти интерфейсам и
      указанным пяти базисным элементам. Он не доказывает
      одновременную реализуемость каждого когда-либо описанного
      правила Γ, полного JSON/DAS-конвейера, физического
      хранения или всех дальнейших теорем рукописи.
      В Lean4 совместная модель использует внешний propext;
      общая математическая теорема C-03 о бесконечности
      носителя аксиом не требует. Научный вердикт OPEN.
    scientific_status: OPEN
  - id: B-1.9
    owner: F03
    original_question_ru: >-
      Где доказаны необходимые различия между R, O, C, L и U? Какие из них теоремы, а
      какие являются частью выбранной конкретной модели/контракта?
    classification: CONDITIONAL_FIVE_BASIS_DISTINCTNESS
    evidence_symbols: [F2F3OneSidedExistence, f2f3_start_root_pattern, f2f3_finish_root_pattern, f2f3_pair_pattern, f2f3_reverse_pair_pattern, F03_basis_five_pairwise_distinct]
    answer_ru: >-
      При конкретном F:Foundation и отдельно предоставленном
      E:F2F3OneSidedExistence(F) положим O=E.startRoot,
      C=E.finishRoot, L=form(O,C), U=form(C,O). Парная
      теорема F03_basis_five_pairwise_distinct в Lean4/Rocq
      доказывает все десять неравенств для пяти элементов,
      используя полюсные законы, различия свидетелей с R,
      и локальные формы FullSelf, StartOnly, FinishOnly,
      PairLocal. Это универсальная условная теорема для
      всякого F и E, а не числовой эксперимент или только
      свойство одной реализации. В минимальном Foundation
      O и C вообще не заданы, поэтому нельзя требовать
      пяти различий без E.
    limitation_ru: >-
      Условность E принципиальна: доказательство не показывает,
      что у любого Foundation непременно существуют собственные
      O и C, и не гарантирует единственность таких
      односторонних фиксированных точек. Названия O/C —
      контекстная привязка выбранных свидетелей,
      а не глобальные константы одной и той же теории.
      Научное принятие рецензентом не произведено.
    scientific_status: OPEN
  - id: B-1.10
    owner: F01
    original_question_ru: >-
      Используемая логика конструктивна или классична? Текст систематически выделяет
      LocalSelfDecision как дополнительное свидетельство и говорит о конструктивной
      дизъюнкции; это похоже на конструктивный режим, но общий логический метауровень не
      объявлен.
    classification: CONSTRUCTIVE_CORE_EXPLICIT_META_AXIOMS
    evidence_symbols: [Foundation, LocalSelfDecision, local_self_incidence_exhaustive, M06_W2_two_distinct_implies_nat_injection, M06_W2_joint_model_witness]
    answer_ru: >-
      Минимальная аксиоматика Foundation и многие теоремы
      формализованы в конструктивных ядрах Lean4 и Rocq:
      без предположения глобального закона исключённого
      третьего и без аксиомы разрешимости равенства Link.
      Поэтому LocalSelfDecision(F,x) явно требует свидетельств
      P∨¬P отдельно для двух локальных равенств полюсов.
      Принятая явная List Bool модель использует вычислимое
      сравнение списков; однако четыре теоремы модели W2
      в Lean4 зависят от стандартной внешней аксиомы propext,
      что прямо показано результатом #print axioms.
      Конструктивная общая теорема W2 о вложении Nat в
      нетривиальную Foundation не использует аксиом в Lean4,
      а её Rocq-пара закрыта без внешних предпосылок.
    limitation_ru: >-
      Нельзя из этих примеров выводить, будто каждая теорема
      всей МТС свободна от классических принципов или
      будто propext является аксиомой самой МТС.
      Отсутствие конкретных аксиом проверено только в
      названных формальных артефактах, а глобальный
      метатеоретический режим полной рукописи требует
      отдельной декларации и аудита. В частности,
      конструктивная дизъюнкция не получается бесплатно
      из произвольного Foundation.
    scientific_status: OPEN
