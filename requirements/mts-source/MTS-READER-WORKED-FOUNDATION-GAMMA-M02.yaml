scientific:
  heading_ru: "M02. Сквозной пример: один Link-фундамент, одна ANet и реакция AND"
  aim_ru: "Рассмотрим полностью определённый путь на неизменяемом авторски утверждённом корпусе Boolean AND. Проверяем единый носитель Link, формирование R/O/C/L/U, построение точных последовательностей ArgsTT и ImageT, исходные FORMAL/JSON, совпадение native source ANet и четыре отношения допуска Theory, один положительный вход AND(T,T), два отрицательных сценария и границы применимости Γ. Результат сквозного примера является составным: математические равенства Foundation подтверждаются ядрами Lean4/Rocq; конкретный compiler/matcher/replay подтверждён исполняемым TS на выбранном корпусе; атомарное исполнение полного production backend не доказано одним этим тестом."
  foundation_ru: "На уровне принятого Foundation существуют Link R и тотальная операция form с проекциями start/finish. Для выбранной ориентированной нотации ∞ означает R, O=♂∞ задаёт START(R), C=∞♀ задаёт END(R), L=form(O,C), U=form(C,O). Связи L и U используются как выбранные репрезентанты T=L и F=U. В исходнике буквально присутствуют O : ♂∞, C : ∞♀, L : O->C, U : C->O, T : L, F : U. Различение ориентированных случаев и их свойства относятся к принятым основаниям; символьные T и F не добавляют двух первичных типов и не превращают FORMAL в вычислительный opcode."
  operator_ru: "Имя AND определяется через обычные Links: AND_SEED=form(R,L), AND=form(AND_SEED,O). Поэтому строка AND_SEED : R->L и следующая AND : AND_SEED->O являются именованными bindings к Link-конструкциям. Отдельный локальный V0 : {} создаёт пустой пучок ролей. Нельзя отождествлять источник V0:{} с отсутствующим объявлением V0, произвольно считать V0 новым сортом или выдумывать специальный host-класс BooleanInstruction. Все четыре правила имеют одну универсальную форму grounded Rule с пустыми ролями."
  positional_ru: "ArgsTT определён как точная последовательность [T,T] = [L,L], сохраняющая обе равные позиции. ArgsTF=[T,F], ArgsFT=[F,T], ArgsFF=[F,F] являются другими позиционными carriers. ImageT=[T] и ImageF=[F] — одноэлементные точные образы. В принятой TypeScript-реализации materializeExactSequence начинает с R и для каждой позиции строит payload=form(previous,value), затем self-start-closed Cell, а readExactSequence делает обратное чтение по цепи до R. Эта реализация подтверждает конкретный путь позиций, но не разрешает заменить [T,T] множеством {T} и не даёт равенства точных носителей при совпавшей экстенсиональной свёртке."
  rule_ru: "Положительный RuleTT описан буквально RuleTT : V0->((AND->ArgsTT)->ImageT). Через form это role-anchored Rule с antecedent form(AND,ExactSequence([L,L])) и image ExactSequence([L]); таким образом, правило структурно сопоставляет один текущий Link, а не два независимо прочитанных члена current. Остальные RuleFF, RuleFT, RuleTF аналогично выдают [F]. Контекст Theory представлен Link-именем, а четыре выражения Theory->RuleFF, Theory->RuleFT, Theory->RuleTF, Theory->RuleTT — bare-отношениями допуска в semantic ANet. Bindings самих Rule не означают автоматически their currentness."
  source_ru: "FORMAL-оригинал и JSON-оригинал являются двумя представлениями одного выбранного примера: в FORMAL используются T : L и Theory->RuleTT, в JSON — строковый binding ключа T со значением L и bare-свидетельство ключа Theory->RuleTT со значением null. Для массивов JSON использует только ExactSequence; дубликаты ключей отвергаются до обычного JSON.parse. Оба действительных компилятора вызываются в одной Memory с одинаковой native Grammar и source ANet profile. В принятом A1 тесте проверяется точное равенство возвращённых sourceAset по Link handle; после единого resolver/denotation проверяется semantic membership ровно четырёх отношений Theory⟼RuleXX. Совпадение native sourceAset не утверждает исходную побайтовую идентичность FORMAL и JSON."
  run_ru: "Пусть текущая асеть для локальной иллюстрации содержит ровно a=form(AND,ExactSequence([T,T])) и выбрана допустившая четыре Rule Theory. Источник A1 теста создаёт current через memory.ensure(AND,materializeExactSequence([T,T])), проходит по denotation.members, проверяет, что member есть допуск form(Theory,Rule), извлекает Rule poles, делает unifyStructuralRuleTemplate над a, затем instantiateV013StructuralTemplate и readExactSequence. При RuleTT получается ровно один вывод T, как фиксируется в TRUTH_TABLE=4_OF_4. Остальные три antecedent не совпадают с a в этом профиле. Эту локальную вычислительную проверку нельзя некорректно описывать как прямой вызов production Γ — в тесте helper называется reactGeneric и использует совместимый matcher, а не полный атомарный исполнитель."
  transition_ru: "Если отдельно выполнены принятые предпосылки универсальной Γ — полный S1 по снимку Mₜ, каноническое S2, атомарная публикация всех результатов, отсутствие read-your-own-writes — и единственный current Link равен a, то экстенсиональное ожидаемое следующее множество есть Mₜ₊₁={T}. Это условный вывод из положительного полного сопоставления и принятых законов профиля, не эмпирическое свидетельство реального backend для полного перехода. GPR_01_decomposition_iff_single_gamma_step и GPR_01_gamma_successor_unique в Lean4/Rocq доказывают соответствующие свойства абстрактно заданной функции Gamma при фиксированной декомпозиции, но не refinement production A-memory. Происхождение rule-event и физическое число хранимых Link здесь не выводятся из одного экстенсионального набора."
  negatives_ru: "Первая отрицательная проверка: X — Link, не равный выбранным Boolean T/F, а current=form(AND,ExactSequence([T,X])). Ни одно из четырёх оснований antecedent не совпадает, поэтому A1 helper возвращает нуль outputs и помечает сценарий NON_BOOLEAN_OPERANDS=NO_MATCH; при настоящей Γ с теми же полными предпосылками NO_MATCH обязан сохранить current, а не создать Boolean false. Вторая проверка удаляет только bare-допуск Theory->RuleTT, не изменяя definition RuleTT: вход (T,T) становится NO_MATCH, но FF/FT/TF ещё вычисляются. Третья проверка выбирает ForeignTheory и получает отсутствие допуска, даже когда физический RuleTT имеется. Отрицательные сценарии показывают власть semantic membership, а не случайных имён или наличия физической записи."
  replay_ru: "В принятом A2 package/replay gate четыре Boolean пакета AND/NOT/OR/XOR компилируются из уже утверждённых исходников, а для AND сохранённые FORMAL/JSON/recursive артефакты проверяются по digest. A1 реализует 4/4 положительных строки AND и негативные мутации; тест точности source закрепляет SHA-256 трёх файлов. Это два разных свидетельства: A1 — локальное сопоставление структурных правил, A2 — совместимость packaging/replay с историческими адаптерами; ни один не подменяет полное независимое доказательство end-to-end Γ. Все новые комментарии в данном M02 являются только научной редакцией, без нового формального или JSON-артефакта."
  verdict_ru: "Связный положительный маршрут от Link-полей до точного одноэлементного образа [T] воспроизведён на принятом корпусе. Уровни уверенности: Foundation — парные theorem-посылки; точная последовательность и source parity — конкретные TS-векторы; локальный RuleTT match — A1 executable; атомарный successor Γ — условная семантическая модель и всё ещё открытый production refinement. Именно такое разделение делает пример научно проверяемым: видны точные Links, имена исходников, схема допустимых правил, где возникает результат и что ещё необходимо доказать, прежде чем говорить о полностью работающей самоисполняемой МТС."
