    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "AND представлен четырьмя zero-role Rule на строгом носителе T/F без альтернативного role dictionary или отдельного семантического opcode."
    limitation_ru: "Из четырёх положительных клеток таблицы нельзя вывести правило для любого не-T/F операнда."
  - id: V15-AND-02
    source_wave: W2
    source_atom: v15-and-02
    source_authority_state: VERTICAL_GREEN
    type: execution-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Общий matcher и Γ-совместимый путь допускает результат NO_MATCH вне локального домена Boolean AND."
    limitation_ru: "NO_MATCH подтверждается отдельным отрицательным тестом; таблица FF/FT/TF/TT его не выводит."
  - id: V15-AND-03
    source_wave: W2
    source_atom: v15-and-03
    source_authority_state: VERTICAL_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Оптимизация backend допустима лишь как семантически сохраняющее понижение единственной модели AND."
    limitation_ru: "Технический ускоритель не вправе менять строгую область T/F или NO_MATCH."
