    source_atom: v15-gov-02
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Аудит проверяет отсутствие семантической инъекции в host/backend, даже если видимая таблица истинности совпадает."
    limitation_ru: "Равный результат на выбранных входах не гарантирует тождество маршрута получения результата."
  - id: V15-GOV-03
    source_wave: W3
    source_atom: v15-gov-03
