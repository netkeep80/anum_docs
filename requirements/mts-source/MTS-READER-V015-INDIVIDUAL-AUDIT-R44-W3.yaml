    source_wave: W3
    source_atom: v15-formal-proof-01
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Парные Lean4 и Rocq подтверждают объявленный фрагмент FORMAL с конкретными идентификаторами теорем и областями предпосылок."
    limitation_ru: "Нельзя повышать статус доказательства на весь язык FORMAL или на код TypeScript без отдельного refinement."
