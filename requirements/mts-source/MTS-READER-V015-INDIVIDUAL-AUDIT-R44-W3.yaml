historical_mp:
  source: requirements/mts-source/MTS-READER-V14-G10.yaml
  source_atom: v14-l11
  scientific_ru: "Обобщённый Modus Ponens версий v0.13 и v0.14 имеет собственную принятую область и цепочку A14→A16→A17→A72w. Единая Γ версии v0.15 задаёт поздний исполнительный профиль: J0, снимок, S1, S2 и атомарную публикацию. Историческая преемственность не является доказательством логического тождества двух теорем для любого окружения."
  exclusion_ru: "Нельзя изображать Γ предпосылкой более ранних MP-законов, переносить на старые релизы S1/S2 или объявлять backend с Γ доказательством каждой прежней теоремы без отдельного refinement."
proof_scope:
  inventory: proofs/v015-formal-proof-assurance.json
  authoritative_cases: [FRM-01, FRM-02, FRM-03, FRM-04, FRM-05, FRM-06, FRM-07, FRM-08]
  scientific_ru: "Внешняя верификация Lean4 и Rocq фиксирует восемь FRM-целей в выбранных моделях; FRM-04 условна по инъективности ExactSequence, FRM-05 по общности исходной нативной ANet, FRM-06 по round-trip метакомпиляции, FRM-07 по перечисленным production refinement premises. Эти условия нельзя скрывать словом «доказано»."
  exclusion_ru: "Восемь теорем не означают полной машинной верификации production TypeScript или любого возможного FORMAL-входа. Исполняемые regression GREEN имеют другую доказательную силу."
authority_boundary:
  scientific_ru: "Нормативный реестр различает принятые требования к форме источника, исполнению, наблюдаемости, CI, публикации, авторскому решению и регрессионному корпусу. Статус COMPONENT_GREEN, VERTICAL_GREEN, RELEASE_READY либо ACCEPTED фиксирует управляемую готовность требования и не превращает любое его предложение в доказанную математическую теорему."
  exclusion_ru: "Публикация рукописи и новый JSON требуют самостоятельного авторского решения. Уже принятое v0.15 не переутверждается посредством редакционной модели R44-W3."
reviews:
  - id: V15-TERM-01
    source_wave: W1
    source_atom: v15-term-01
    source_authority_state: COMPONENT_GREEN
    type: terminology
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "ANet — нормативное английское название асети; legacy Aset обозначает исторические имена в коде, а не новый вид объекта или альтернативную теорию."
    limitation_ru: "Решить, где вводить русский термин и английский эквивалент; не выводить из правила именования свойства графа."
  - id: V15-AUTH-01
    source_wave: W1
    source_atom: v15-auth-01
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "FORMAL и канонический JSON обязаны сходиться в нативной исходной ANet до общей семантики; разные оболочки ввода не создают двух законов исполнения."
    limitation_ru: "Реализационная сходимость требует прослеживаемой цепочки и тестов, а не философского утверждения о тождестве всех файлов."
  - id: V15-AUTH-02
    source_wave: W1
    source_atom: v15-auth-02
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "FORMAL_MIGRATED и VERTICAL_GREEN являются аттестационными статусами лишь при наличии source artifact, точки входа, дайджеста и полного набора свидетельств."
    limitation_ru: "Статус нельзя превращать в математическую теорему и присваивать по результату одиночного CI."
  - id: V15-ONTO-01
    source_wave: W1
    source_atom: v15-onto-01
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Онтология сохраняет один вид сущностей — Link; технические типы узлов, runtime и кодеков не становятся дополнительными онтологическими сортами."
    limitation_ru: "Это нормативная граница семантической власти, а не доказательство универсальной выразительности любого алгоритма."
  - id: V15-ONTO-02
    source_wave: W1
    source_atom: v15-onto-02
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Предпочтение существующей Link-топологии и ExactSequence перед расширением Grammar задаёт минималистическую дисциплину моделирования."
    limitation_ru: "Фраза не устанавливает теорему полноты обычных Link для всех будущих конструкций."
  - id: V15-ONTO-03
    source_wave: W1
    source_atom: v15-onto-03
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Переименование presentation names, сохраняющее разрешение и структурное членство, не должно менять поведение семантической ANet."
    limitation_ru: "Нельзя утверждать инвариантность при смене контекста или при изменении связности вместе с именем."
  - id: V15-STRUCT-01
    source_wave: W1
    source_atom: v15-struct-01
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "ROOT/START/END/PAIR — структурные аспекты Link, материализуемые через общий источник FORMAL/JSON в 8/9/6/1."
    limitation_ru: "Поддержка аспектов не снимает запрета произвольных циклических форм связывания имён."
  - id: V15-CLOSE-01
    source_wave: W1
    source_atom: v15-close-01
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "VERTICAL_GREEN требует транзитивного замыкания зависимостей именно выбранного исполняемого артефакта и его заявленной области."
    limitation_ru: "Успех частной программы не свидетельствует об отсутствии неназванных внешних зависимостей."
  - id: V15-CLOSE-02
    source_wave: W1
    source_atom: v15-close-02
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Каждая внешняя семантическая либо инструментальная зависимость должна иметь категорию и версию; это предотвращает смену authority под видом имплементации."
    limitation_ru: "Нельзя приписывать зависимости математическое содержание только из-за наличия версии."
  - id: V15-CLOSE-03
    source_wave: W1
    source_atom: v15-close-03
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Нулевая программно-специфическая host-инъекция касается семантических правил; допустимый универсальный host-код продолжает выполнять оркестрацию."
    limitation_ru: "Это не запрет TypeScript или backend-кода как технического механизма."
  - id: V15-FRESH-01
    source_wave: W1
    source_atom: v15-fresh-01
    source_authority_state: COMPONENT_GREEN
    type: execution-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "FORMAL должен восстановить исполняемый пакет в новой Memory только из зафиксированных общих механизмов и источника."
    limitation_ru: "Предыдущие скрытые объекты Memory нельзя использовать как предпосылку воспроизводимости."
  - id: V15-FRESH-02
    source_wave: W1
    source_atom: v15-fresh-02
    source_authority_state: COMPONENT_GREEN
    type: execution-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Самодостаточный канонический JSON должен давать такой же исполняемый пакет в чистой Memory без отдельного FORMAL-файла для исправления."
    limitation_ru: "Текстовый JSON round-trip без сравнения семантического исполнения недостаточен."
  - id: V15-FRESH-03
    source_wave: W2
    source_atom: v15-fresh-03
    source_authority_state: COMPONENT_GREEN
    type: execution-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Шум посторонних аллокаций в двух свежих Memory не должен менять рекурсивное представление или наблюдаемое поведение данного артефакта."
    limitation_ru: "Речь о семантическом результате, не о тождестве адресов, времени работы или случайного порядка выдачи handles."
  - id: V15-NAME-01
    source_wave: W2
    source_atom: v15-name-01
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Имена FORMAL разрешаются контекстно; запись :A есть сокращённая форма R:A, а полюса структурных выражений проходят один резолвер."
    limitation_ru: "Глобальные строки идентификаторов хоста не дают самостоятельного способа создавать смысл Связей."
  - id: V15-JSON-01
    source_wave: W2
    source_atom: v15-json-01
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Поддерживаемый JSON обязан передавать не только структуру, но и семантически значимые membership и исполнительные роли source ANet."
    limitation_ru: "Равенство сериализованных строк без повторного построения носителя не доказывает полноту представления."
  - id: V15-JSON-02
    source_wave: W2
    source_atom: v15-json-02
    source_authority_state: COMPONENT_GREEN
    type: semantic-contract
    audit_state: individually-scoped-editorial-review-pending-author
    assessment_ru: "Текст FORMAL и JSON не могут иметь двух независимых денотационных механизмов: оба сходятся в общей ANet и общем DAS."
    limitation_ru: "Это требование ограничено поддерживаемым профилем; нельзя заявлять поддержку всякой возможной JSON-структуры."
  - id: V15-JSON-03
    source_wave: W2
    source_atom: v15-json-03
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
