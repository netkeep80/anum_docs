    limitation_ru: "В тестовой модели необходимо различать семантические и чисто транспортные изменения."
  - id: V15-VERT-01
    source_wave: W2
    source_atom: v15-vert-01
    source_authority_state: COMPONENT_GREEN
    type: evidence-condition
    audit_state: individually-scoped-editorial-review-pending-author
