heading_ru: "M04. Доказательное положение математических утверждений и границы применимости"
intro_ru: "Следующая матрица не заменяет доказательство теорем и не является простым перечнем зелёных проверок. Она разделяет нормативные решения, теоремы внешних ядер, утверждения при дополнительных предпосылках, конечные исполняемые свидетельства и ещё открытые исследовательские вопросы. Для каждой строки указаны точный источник, содержание, необходимая область интерпретации и специально исключаемое усиление. Математическая достоверность, техническое воспроизведение и авторская санкция сохраняют самостоятельный статус."
legend:
  KERNEL_THEOREM: "Вывод проверен ядрами Lean4 и Rocq в явно заданной внешней модели; математические ограничения области действия остаются в сигнатуре и не переносятся автоматически на production реализацию."
  CONDITIONAL_THEOREM: "Ядра доказывают импликацию при названных предпосылках; применимость посылок к выбранному runtime, codec либо конкретной модели должна устанавливаться отдельным доказательством."
  EXECUTABLE_WITNESS: "Конкретный исполняемый TypeScript тест проверяет строго объявленные входные данные и отрицательные сценарии. Результат подтверждает тестированный фрагмент, но не универсальную математическую теорему."
  ACCEPTED_SEMANTIC_CONTRACT: "Статус означает нормативно принятое автором правило семантики v0.15, а не механическую проверку любого backend на соответствие этому правилу."
  OPEN_RESEARCH: "Сформулированный математический вопрос или инженерный refinement не разрешён приложенными источниками. Никакие проверенные частные примеры не повышают его статус автоматически."
  AUTHOR_DECISION: "Зафиксированное решение Автора относится к конкретному релизу и архивной границе, а не к будущим редакционным предложениям. Для корректной атрибуции необходимы точные issue, comment и merge SHA релизного решения."
  AUTHOR_DECISION_PENDING: "Предложенная научная редакция ещё не прошла самостоятельную авторскую приёмку; ни зелёная сборка, ни успешная проверка источника не заменяют это решение."
