grounded:
  heading_ru: "F04. Конструктивная локальная классификация и конечная заземлённость"
  logic_ru: "Полюсные проекции start, finish определены на каждой Link. Для конкретного x локальные высказывания StartSelf(x): start(x)=x и FinishSelf(x): finish(x)=x задают ровно четыре совместимых сочетания истинности. Их попарная несовместимость доказана для любого x как local_self_incidence_exclusive. Чтобы конструктивно предъявить одно из четырёх дизъюнктивных доказательств, отдельно требуется LocalSelfDecision(x): (StartSelf∨¬StartSelf)∧(FinishSelf∨¬FinishSelf). В классической интерпретации это даётся исключённым третьим; в проверяемой конструктивной сигнатуре решение не скрывается."
  induction_ru: "Grounded(F,x) — наименьший индуктивный предикат с одним конструктором node: для каждого полюса p∈{start,finish}, если p(x)≠x, требуется конечное Grounded-доказательство для p(x). Самоссылка конкретного полюса не создает рекурсивной обязанности. При нетривиальных циклах из нескольких Link, где обязанности возвращаются к уже посещённому узлу, конечного свидетельства может не быть; наличие тотальных проекций не делает такую структуру Grounded."
  distinction_ru: "Distinguishable(F,x,y) строится конечным индуктивным доказательством одного из шести видов: четыре локальных несовпадения самозамкнутости в позициях start/finish либо два шага рекурсивного различения в соответствующем полюсе при несамозамкнутости обеих Связей. Отсутствие конечного Distinguishable-свидетельства само по себе не отождествляет x и y в произвольной Foundation; такое отождествление на Grounded-домене — отдельная предпосылка A1RecursiveSeparation."
  realization_ru: "Сочетания логических форм не означают, что все четыре непременно реализуются одной только сигнатурой Foundation. Реализация R, O, C и L доказана как FND_01_grounded_realizability при E : F2F3OneSidedExistence, а полнота классификации для выбранного x дополнительно требует LocalSelfDecision(x). Результат FND_01_four_structural_cases требует E и A1, чтобы связать полностью замкнутый случай с единственным корнем."
  cycle_ru: "Принятая модель ExplicitFoundation содержит два внешних элемента badStart и badFinish: finish(badStart)=badFinish и start(badFinish)=badStart при их различии. Теорема fallback_cycle_not_grounded показывает, что у них нет конечного Grounded-доказательства. Это точный отрицательный пример и ответ на вопрос о циклической вложенности, но не общий алгоритм распознавания любого цикла в FORMAL."
  limit_ru: "Нельзя смешивать четыре локальных булевых случая с четырьмя примитивными операциями или четырьмя элементами всего носителя. Не доказано, что каждая Link является Grounded; также не доказана тотальная вычислимая классификация arbitrary Link без конкретного решения LocalSelfDecision."
  lean_symbols: [LocalSelfDecision, local_self_incidence_exhaustive, local_self_incidence_exclusive, Grounded, Distinguishable, A1RecursiveSeparation, FND_01_grounded_realizability, FND_01_four_structural_cases]
  rocq_symbols: [LocalSelfDecision, local_self_incidence_exhaustive, local_self_incidence_exclusive, Grounded, Distinguishable, A1RecursiveSeparation, FND_01_grounded_realizability, FND_01_four_structural_cases]
  model_lean_symbols: [badStart_not_grounded, badFinish_not_grounded, fallback_cycle_not_grounded]
  model_rocq_symbols: [model_bad_start_not_grounded, model_bad_finish_not_grounded, fallback_cycle_not_grounded]
identity:
  heading_ru: "F05. A1, FND-02 и FND-13: строгая карта независимых предпосылок"
  a1_ru: "A1RecursiveSeparation(F) утверждает, что для x,y с конечными доказательствами Grounded(x) и Grounded(y) невозможность построить Distinguishable(x,y) влечёт x=y. Это дополнительное условие класса моделей, а не определение равенства и не следствие одной лишь сигнатуры. Доказательство explicit_a1 устанавливает его на одной конкретной ExplicitFoundation, но не на всех возможных Foundation."
  root_ru: "FND_02_unique_root(F,a1,hx) получает x=R из A1 и FullSelf(x): корень R сам полностью замкнут, обе Связи Grounded, а их конечная структурная различимость невозможна. Здесь не требуется предпосылка F2F3GroundedNormalization и не предполагается заранее уникальный корень."
  injection_ru: "fnd13_form_injective(F) выводит из законов проекций без дополнительных A1, Grounded или Normalization: form(a,b)=form(c,d) ⇔ (a=c∧b=d). Однако обратное уравнение form(start(x),finish(x))=x для произвольного x не является законом Foundation. Поэтому инъективность конструктора не тождественна глобальной экстенсиональности по полюсам."
  fnd13_ru: "FND_13_identity_by_poles(F,N,gx,gy): для произвольных x,y с Grounded-свидетельствами gx,gy и N:F2F3GroundedNormalization(F) выполняется x=y ⇔ start(x)=start(y)∧finish(x)=finish(y). В обратном направлении применяются recursiveEquation для нормальных форм и complete для двух Grounded-связей. В списке аргументов этой теоремы отсутствуют A1 и FND-02: приписывать ей их как необходимые доказательные зависимости неверно."
  model_ru: "ExplicitGroundedNormalization на ExplicitFoundation выбирает NormalForm=ModelLink, compose=form, normalForm(x)=x. Уравнение декомпозиции доказывается после grounded_is_canonical: только Grounded элементы этой модели лежат в образе form. Поэтому explicit_fnd13_replay — конкретная инстанциация принятой условной FND-13, не утверждение глобальной нормализации неграундированных значений."
  counterexample_ru: "Вопрос независимости A1 от Foundation и вопрос о глобальной экстенсиональности вне Grounded требуют собственных контрмоделей или строгих следствий. Наличие explicit_a1 не даёт отрицательной модели; равно как отсутствие полной нормализации в аксиомах не доказывает её логической независимости. Эти вопросы помечены RESEARCH_OPEN, а не решены умолчанием."
  open_ru: "Парная лемма о десяти различиях R/O/C/L/U теперь имеет новое kernel evidence на научной ветке; её независимая математическая рецензия и авторская приёмка не завершены. Остались открытыми независимость A1 для общего Foundation, глобальная экстенсиональность вне Grounded и строгая модель ANet/ExactSequence/F_R. Нормативная v0.15 при этом не изменяется."
  lean_symbols: [fnd13_form_injective, FND_13_identity_by_poles, FND_02_unique_root, F2F3GroundedNormalization, explicit_fnd13_replay]
  rocq_symbols: [fnd13_form_injective, FND_13_identity_by_poles, FND_02_unique_root, F2F3GroundedNormalization, explicit_fnd13_replay]
  open_obligations: [A1_INDEPENDENCE, GLOBAL_POLE_EXTENTIONALITY, BASIS_PAIRWISE_INDEPENDENT_REVIEW]
