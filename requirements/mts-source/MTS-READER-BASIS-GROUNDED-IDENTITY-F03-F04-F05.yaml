basis:
  heading_ru: "F03. Основания R, O, C, L, U: конструкция, четыре формы и десять различий"
  status: "CONDITIONAL_DERIVATION_FROM_ACCEPTED_THEOREMS_NOT_NEW_KERNEL_CERTIFICATE"
  notation_ru: "Пусть F : Foundation, E : F2F3OneSidedExistence(F). Определим R=F.R, O=E.startRoot, C=E.finishRoot, L=form(O,C), U=form(C,O). Это пять именованных представителей на одном носителе Link, а не пять конструкторов и не пять элементарных локальных случаев. Выбор названий O и C зависит от принятой ориентации; FND_04 и INV_06 не делают эту ориентацию абсолютной."
  equations_ru: "Непосредственно из E: O=form(O,R), C=form(R,C), O≠R, C≠R. Из законов проекций следуют start(O)=O, finish(O)=R, start(C)=R и finish(C)=C. Из этого O относится к StartOnly, C — к FinishOnly, тогда как L и U относятся к PairLocal; R — к FullSelf. Все эти локальные свойства подтверждаются отдельными леммами f2f3_start_root_pattern, f2f3_finish_root_pattern, f2f3_pair_pattern и f2f3_reverse_pair_pattern."
  proof_ru: "Десять различных пар показываются без A1 и без F2F3GroundedNormalization при условии E. R≠O и R≠C входят в E. R≠L и R≠U: R полностью самозамкнут, L/U ни в одном полюсе не самозамкнуты. O≠C: O удовлетворяет start(O)=O, а C удовлетворяет start(C)=R; равенство O=C влекло бы O=R. O≠L и O≠U: O имеет самозамкнутый start, а L/U не имеют. C≠L и C≠U: C имеет самозамкнутый finish, а L/U не имеют. L≠U: из form(O,C)=form(C,O) по fnd13_form_injective следовало бы O=C, что уже исключено."
  nat_degree_corollary_ru: "При принятых определениях шкал N₀=U, Succ(N)=form(N,L) и D₁=L получается N₁=form(U,L)≠D₁. Если предположить form(U,L)=L=form(O,C), то после применения тотальной проекции start обеих сторон получилось бы U=O. Но U удовлетворяет PairLocal и потому start(U)≠U, тогда как O удовлетворяет StartOnly и start(O)=O; следовательно U≠O. Утверждение требует существования двух односторонних представителей E и указанных определений шкал, но не требует общей инъективности произвольного кодека Anum и не доказывает всей арифметики Nat."
  limit_ru: "Структурная категория PairLocal одна и та же для L и U, но эти Связи различны как элементы Link. Поэтому четыре локальных случая не являются перечислением всех Связей. В научной ветке для #2222 новая единая теорема F03_basis_five_pairwise_distinct проверена ядрами Lean4/Rocq без новых глобальных аксиом в exact CI #38181572363. Этот новый внешний proof-кандидат ещё не принят автором, не включён в frozen baseline v0.15 и ожидает независимой математической рецензии; статус публикации остаётся blocked."
  model_ru: "В явной модели List Bool, уже предъявленной в F02, E=ExplicitOneSided и F=ExplicitFoundation дают конкретных O и C и тем самым L и U. Конструкция модельно-согласована; равенство иных рекурсивных неподвижных точек с этими представителями без A1 не утверждается."
