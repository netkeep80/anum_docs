transition:
  heading_ru: "G01. Одно поколение Γ: NO_MATCH, успешный пустой образ и публикация"
  state_ru: "Пусть Mₜ — семантическая ANet членств текущего поколения, выбранная через структуры Link и контекстную принадлежность. Для объявленной Theory и её допущенных структурных Rule в начале шага фиксируется неизменяемый снимок Mₜ. Состояния результата удобнее описывать внешней проверочной суммой NO_MATCH или MATCHED(Image), где Image есть точная конечная последовательность Link. Это классификация события внешней модели, не второе множество онтологических типов и не отдельный машинный opcode МТС."
  cases_ru: "NO_MATCH означает, что для выбранного текущего члена не найдено ни одного допущенного правила, удовлетворяющего matcher на исходном снимке: тогда этот член сохраняется в successor. MATCHED([]) означает существование допустимого совпадения с точным пустым образом, поэтому локальный вклад равен нулю. MATCHED([b₁,…,bₙ]) при n≥1 создаёт результаты только после завершения S1. NO_MATCH и MATCHED([]) имеют одинаковую пустую совокупность новых образов, но различный флаг matched, и их склеивание ошибочно меняет переход."
  phases_ru: "Принятый контракт Γ требует S1=STRUCTURAL_MATCH_BIND с readOnly=true над одним исходным снимком, S2=CANONICAL_SUBSTITUTION_AND_LINK_CONSTRUCTION после completePlanBeforeSynthesis и атомарную публикацию полного семантического successor. Семантически значимым шагом является только Mₜ→Mₜ₊₁, промежуточный план или staged-Links не являются самостоятельными поколениями. newly admitted Theory, созданная во второй фазе, может действовать только в следующем поколении, если допущена там. Запрет sameGenerationReadOwnWrites предотвращает каскадное выполнение новосозданных правил в том же шаге."
  identity_ru: "Активная identity-реакция может построить тот же итоговый набор членств, что был в Mₜ, однако она отличается от NO_MATCH фактом допустимого срабатывания правила и наличием события/происхождения. Наоборот, если один текущий член одновременно совпал с двумя правилами, включая успешный пустой образ, локальное решение зависит от полного набора совпадений, а не от раннего выхода первого обработанного Rule. Состояния ошибки разбора, отсутствующего admission и нулевого образа не являются синонимами."
  proof_ru: "Парные GPR_01_decomposition_iff_single_gamma_step и GPR_01_gamma_successor_unique доказывают совпадение внешней композиции analyze→synthesize→publish с одной заданной функцией Gamma и единственность её результата для фиксированного входа. Это не доказательство, что произвольные реальные scheduler, storage, concurrent backend или адаптеры удовлетворяют соответствующему контракту. GPR_03_analysis_ignores_staged_candidate и GPR_03_one_generation_stops_at_B дополнительно фиксируют отсутствие собственного чтения результатов S2; область каждой теоремы следует проверять по принятым предпосылкам."
reduction:
  heading_ru: "G02. Несколько правил: объединение вкладов, матчи и детерминизм"
  model_ru: "Для одного входного Link a и конечного набора допущенных правил Rₜ рассмотрим все локальные наблюдения (matchedᵢ, Outputsᵢ), вычисленные над тем же снимком. Определим их редукцию (m₁,O₁)⊕(m₂,O₂)=(m₁∨m₂,O₁∪O₂). Пустая комбинация есть (false,∅). Операция OR сохраняет факт хотя бы одного успешного матча независимо от размера выходов, а объединение по Link identity сводит повторяющиеся итоговые членства, не меняя точные исходные Image-списки и события provenance."
  rules_ru: "Если r₁ для a даёт пустую ExactSequence, а r₂ даёт [b], то итоговая комбинация равна (true,{b}), независимо от порядка рассмотрения. При двух совпадениях, дающих [b,c] и [c,d], семантический successor содержит b,c,d, но в отдельных исходных последовательностях повторённый c не исчезает. Одновременные правила не имеют неявного приоритета, приказа выбора первого или автоматической семантики логического конфликта. Если требуются взаимоисключение или приоритет, они должны быть выражены в допущенной структуре и доказаны отдельно."
  confluence_ru: "Парные GPR_04_merge_associative_observation, GPR_04_merge_commutative_observation и GPR_04_merge_idempotent_observation доказали алгебру именно внешних наблюдений (matched, set outputs). GPR_04_two_dimensional_partition_refinement рассматривает разбиение как по текущим членам, так и по правилам при её явных предпосылках. GPR_04_local_no_match_cannot_publish_global_no_match запрещает shard локально объявить отсутствие реакции до глобального сведения. Следовательно, при одном фиксированном снимке, полном наборе правил и корректной операции публикации разбиение не меняет экстенсиональный результат; это ещё не доказательство детерминизма любого параллельного backend."
  limits_ru: "Порядок позиций ExactSequence не уничтожается законом коммутативности объединения semantic membership. При составлении двух исходных правил их изображения остаются упорядоченными Link-носителями; равенство результирующей асети не утверждает равенство трассировок, количества событий или точных последовательностей. Возможность конфликта между несопоставимыми редукциями, неполное перечисление Theory, гонка с новой admission и неатомарная публикация не покрываются теоремами GPR-04 без дополнительных обязанностей и отказов."
and:
  heading_ru: "G03. Вычислительный пример AND: четыре grounded правила на точных Link-парах"
  construction_ru: "Утверждённый Автором корпус compact-and.formal и compact-and.json задаёт Bool-область двумя выбранными Link-значениями T=L и F=U. Метка AND является разрешаемым именем Link, а пара аргументов кодируется единой positional ExactSequence([left,right]); повторения не устраняются. Правила RuleFF, RuleFT, RuleTF, RuleTT имеют один и тот же структурный вид V0⟼((AND⟼ArgsXY)⟼ImageZ), где V0 обозначает явный пустой пучок ролей. Это четыре zero-role grounded случая универсального Rule; специального host opcode AND нет."
  table_ru: "Полная истинностная таблица принятых четырёх правил: AND(F,F)=F посредством RuleFF; AND(F,T)=F посредством RuleFT; AND(T,F)=F посредством RuleTF; AND(T,T)=T посредством RuleTT. Каждая правая часть является точным одноэлементным образом [F] либо [T]. Имена ArgsFF, ArgsFT, ArgsTF, ArgsTT — ссылки на Link-carrier последовательностей, а не специальные типы или встроенные пары host-значений."
  authority_ru: "В исходной семантической ANet присутствуют ровно четыре допущенных отношения Theory⟼RuleFF, Theory⟼RuleFT, Theory⟼RuleTF, Theory⟼RuleTT. Простые binding имён Rule не подменяют такой допуск. Для current AND(F,X) и AND(T,X) при X вне {T,F} нет допустимого совпадения, результат NO_MATCH; случайный произвольный X не превращается в true/false. При удалении только допуска Theory⟼RuleTT именно вход (T,T) перестаёт обрабатываться; остальные три остаются рабочими. ForeignTheory не наделяет допуском локальную Theory."
  proof_ru: "Принятый executable gate v015-compact-and-role-bundle-a1.test.ts проверяет FORMAL/JSON parity, четыре строки, строгую Boolean-область, отрицательные мутации допуска и семантическую инвариантность при переименовании. Обобщённая теорема GPR_07_grounded_zero_role_refinement в Lean4/Rocq формально сводит zero-role Rule к общему matcher/instantiator при явных посылках emptyRolesMatch и emptySubstitutionIdentity. Нельзя выдавать четыре TypeScript результата за универсальное доказательство корректности всех Boolean программ, доказательство полного production Γ или за отдельную арифметическую теорему о классе всех Link."
