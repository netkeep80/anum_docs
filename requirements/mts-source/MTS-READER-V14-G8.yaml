    ru: "Знаки ∞, ♂, ♀ и ⟼ являются элементами остенсивной записи структурных форм ROOT, START, END и PAIR. По принятому соответствию символов им отвечают 8, 9, 6 и 1. Это четыре обозначения случаев одной структуры Link, а не четыре независимые операции образования Связей."
    domain: "Символический слой записи Link"
    exclusions: ["Не объявлять четыре глифа четырьмя онтологическими командами"]
