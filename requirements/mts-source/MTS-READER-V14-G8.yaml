    accepted_detail_pointer: /ostensiveFormalNotation/implicitPairAssociativity
    ru: "Для принятой остенсивной грамматики v0.14 значение implicitPairAssociativity равно NONE. Это отсутствие неявного правила группирования выражений PAIR; оно не утверждает и не опровергает отдельного алгебраического закона ассоциативности для операции построения Link."
    domain: "Остенсивный синтаксис v0.14"
    exclusions: ["Не смешивать ассоциативность операции и соглашение о скобках"]
