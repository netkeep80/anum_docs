    role: accepted-contract
    source_quote: "recursive structure, representations/codecs, byte-text and symbolic metanotation introduce no second ontology entity"
    accepted_detail_pointer: /representationLayers/recursiveStructure
    ru: "Первый уровень — рекурсивное структурное описание одной онтологии Link. Алфавит 8/9/6/1 различает четыре структурных случая самоинцидентности; его знаки не являются самостоятельными полюсными сущностями или четырьмя командами конструирования Link."
    domain: "Рекурсивная структура над Link"
    exclusions: ["Не смешивать описывающий алфавит с базовой онтологией"]
    requires: [ontology-level]
  - id: codecs-level
    accepted_id: V14-L14
    section: architecture
    role: accepted-contract
    source_quote: "recursive structure, representations/codecs, byte-text and symbolic metanotation introduce no second ontology entity"
    accepted_detail_pointer: /representationLayers/representationsAndCodecs
    ru: "Второй уровень объединяет способы представления и кодеки: рекурсивный Link codec, Anum, ExactSequence и Q. Они выполняют различные функции представления Связей и последовательностей и не становятся отдельными онтологическими объектами только потому, что имеют собственный формат."
