    accepted_detail_pointer: /ostensiveFormalNotation/implicitPairAssociativity
    ru: "Версионная граница обязательна: запрет неявного группирования здесь относится к принятому остенсивному профилю v0.14. Принятая v0.15 отдельно фиксирует общий путь FORMAL и JSON через денотацию DAS; из этого не следует ретроактивное изменение грамматики v0.14 или тождество (A⟼B)⟼C и A⟼(B⟼C)."
