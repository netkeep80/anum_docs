    role: accepted-contract
    source_quote: "through an explicit grammar"
    accepted_detail_pointer: /ostensiveFormalNotation/ambiguousUngroupedFormsRejected
    ru: "В принятом профиле v0.14 неоднозначную запись, в которой не указано необходимое группирование, требуется отклонять. Наличие формы A ⟼ B не предоставляет само по себе права выбирать произвольное дерево разбора более длинной записи и тем самым менять структурное значение."
    domain: "Остенсивная грамматика v0.14"
    exclusions: ["Не скрывать неоднозначность неявным выбором дерева"]
