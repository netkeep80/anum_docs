    accepted_detail_pointer: /representationLayers/symbolicMetanotation
    ru: "Четвёртый уровень содержит символическую метанотацию: имена, Dictionary, Grammar, Theory и FORMAL. Эти конструкции организуют обозначение, описание и чтение модели, но без дополнительных оснований не могут менять онтологию Link или становиться независимыми источниками семантики."
    domain: "Символическая метанотация"
    exclusions: ["Не превращать имена и элементы Grammar в физические сущности"]
    requires: [byte-text-level]
  - id: no-second-ontology
    accepted_id: V14-L14
    section: architecture
    role: scope-boundary
    source_quote: "introduce no second ontology entity"
    accepted_detail_pointer: /representationLayers/symbolicMetanotation
    ru: "Перечисленные уровни — классификация форм описания и представления, а не лестница новых онтологических примитивов. Высказывание о пяти уровнях не является утверждением, что каждый из них может независимо образовывать Связи; образование Link остаётся исходным структурным основанием."
    domain: "Граница между онтологией и представлениями"
    exclusions: ["Не выводить самостоятельную власть над Link из иерархии уровней"]
