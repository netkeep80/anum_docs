    section: formal-notation
    role: accepted-contract
    source_quote: "through an explicit grammar"
    accepted_detail_pointer: /ostensiveFormalNotation/finalSurfaceGrammar
    ru: "Правила интерпретации остенсивных форм определяются явной грамматикой. Грамматика относится к уровню записи и разбору источника: сам факт существования грамматического правила не создаёт ещё один примитив построения Link и не определяет семантику отдельным host-opcode."
    domain: "Грамматика остенсивных форм"
    exclusions: ["Не превращать правила парсера в независимую онтологию"]
    requires: [positional-forms]
  - id: reject-ambiguity
