    section: formal-notation
    role: accepted-contract
    source_quote: "Ostensive ∞/♂/♀/⟼ denote ROOT/START/END/PAIR"
    accepted_detail_pointer: /ostensiveFormalNotation/positionalForms
    ru: "Принятая остенсивная грамматика различает формы ∞, ♂S, S♀ и A ⟼ B. Буквы S, A, B здесь служат обозначениями соответствующих подвыражений, а не новыми онтологическими сущностями. Полярная ориентация START_K или END_K требует отдельно выбранного контекста."
    domain: "Формы остенсивной записи"
    exclusions: ["Не выводить глобальную ориентацию из очертания символа"]
    requires: [glyph-map]
