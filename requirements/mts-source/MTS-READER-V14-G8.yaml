    accepted_detail_pointer: /representationLayers/ontology
    ru: "Нулевой уровень модели МТС — онтология Link. Только он вводит онтологическую сущность Связь. Вышележащие уровни служат способами структурного описания, представления, записи и метаобозначения, поэтому их элементы не становятся новыми видами сущностей МТС."
