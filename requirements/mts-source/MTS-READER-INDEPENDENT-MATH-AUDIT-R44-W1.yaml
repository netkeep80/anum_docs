  v014_ru: "В остенсивном синтаксисе v0.14 значение implicitPairAssociativity=NONE означает отказ от неявного выбора дерева PAIR. Для трёх связей требуется явная структурная группировка; из синтаксического ограничения не выводится ни ассоциативность, ни её отрицание как алгебраический закон Link."
  v015_ru: "В принятом v0.15 соглашение Direct Sequential Association для трёхчленной цепочки без явных скобок задаёт левую группировку: A⟼B⟼C читается как (A⟼B)⟼C. Запись A⟼(B⟼C) имеет явную другую группировку, которая не отменяется соглашением чтения. Нельзя переносить это правило на историческую грамматику v0.14."
  nonidentity_ru: "Никакой общий закон (A⟼B)⟼C = A⟼(B⟼C) из DSA не следует; FRM-03 доказывает лишь выбранный трёхчленный случай семантики чтения."
