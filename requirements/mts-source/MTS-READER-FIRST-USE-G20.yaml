  - id: "editorial:foundation-ontology"
    source_owner: G16
    source_atom: "foundation-ontology"
    accepted_id: V14-L1
    reader_requires: ["g4:foundation"]
    review: pending
    text_ru: "Первичным объектом Метатеории Связей является Связь (Link). Во внешнем математическом описании задаются носитель Связей, одна операция образования form(a,b) и две проекции её реляционно различимых полюсных позиций — start(x) и finish(x). Выполняются уравнения start(form(a,b))=a и finish(form(a,b))=b. Эти проекции относятся к внешнему описанию и не вводят дополнительных онтологических примитивов."
  - id: "editorial:local-self-classification"
    source_owner: G16
    source_atom: "local-self-classification"
    accepted_id: V14-L1
    reader_requires: ["g4:incidence", "editorial:foundation-ontology"]
    review: pending
    text_ru: "Для Связи x рассматривают два утверждения: совпадает ли значение первой полюсной позиции с x и совпадает ли значение второй позиции с x. Метазнаки 11, 10, 01 и 00 обозначают две оценки совпадения: 1 означает совпадение, 0 — несовпадение. Классы попарно несовместимы. При отдельно предъявленном LocalSelfDecision(F,x) классификация конструктивно исчерпывает все случаи; существование представителя каждого случая не следует из одного перечисления."
  - id: "editorial:root-basis-witnesses"
    source_owner: G16
    source_atom: "root-basis-witnesses"
    accepted_id: V14-L1
    reader_requires: ["editorial:local-self-classification", "basis:R", "basis:O", "basis:C", "basis:L", "g4:one-sided-realizability", "g4:root-uniqueness"]
    review: pending
    text_ru: "Базис Связей задаётся уравнениями R=R⟼R, O=O⟼R, C=R⟼C и L=O⟼C. Уравнение корневой самозамкнутости даёт случай 11, но не доказывает единственность корня. Теорема FND_02_unique_root требует A1RecursiveSeparation; существование собственных односторонних представителей и пары выводится отдельно из F2F3OneSidedExistence посредством FND_01_grounded_realizability. Существование и единственность имеют разные доказательные предпосылки."
  - id: "editorial:relative-chiral-orientation"
    source_owner: G16
    source_atom: "relative-chiral-orientation"
    accepted_id: V14-L1
    reader_requires: ["g4:context-roles", "g4:chiral-orbit", "editorial:root-basis-witnesses"]
    review: pending
    text_ru: "Объективная хиральная пара существует до выбора наблюдателя лишь в области внешней теоремы CTX_03_objective_chiral_orbit_before_context, использующей A1RecursiveSeparation, F2F3GroundedNormalization, F2F3OneSidedExistence и RecursiveInversionDomain. После отдельного выбора ContextOrientationMarker для данного body теорема CTX_03_context_selection_induces_local_roles задаёт относительные роли START_K и END_K. Глобальный выбор W и безусловная тотальная функция J из этих теорем не следуют."
  - id: "editorial:representation-boundary"
    source_owner: G16
    source_atom: "representation-boundary"
    accepted_id: V14-L1
    reader_requires: ["editorial:local-self-classification", "g8:recursive-level", "g7:anum-carrier", "g7:recursive-codec"]
    review: pending
    text_ru: "Структурный рекурсивный алфавит 8/9/6/1 обозначает локальные случаи ROOT, START, END и PAIR. Эти символы не являются четырьмя командами образования Связей. Кодек структуры Link отличен от Anum и Q, представляющих последовательности, а также от текстового и байтового слоёв. Обозначения, структуры и способы записи не вводят вторую онтологию."
