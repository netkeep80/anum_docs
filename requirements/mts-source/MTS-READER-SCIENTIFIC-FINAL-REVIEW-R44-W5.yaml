    source_atom: "editorial:foundation-ontology"
    title_ru: "Повтор Foundation и G16"
    original_status: open
    editorial_assessment: duplicate-opening-still-visible
    assessment_ru: "W4 доказательно разводит исходный интерфейс g4:foundation и пояснение G16 и сохраняет обе исходные формулировки. Тем не менее отдельная поясняющая секция может по-прежнему повторять определение form/start/finish сразу после G4."
    outstanding_ru: "Проверить непосредственно первый разворот, и либо визуально маркировать G16 как читательский комментарий, либо перестроить композицию без изменения исходных байтов; не дублировать аксиомы как независимые утверждения."
    author_question_ru: "Достаточна ли существующая маркировка или требуется собственный авторский вариант введения с единственным основным определением?"
  - id: R40-09
