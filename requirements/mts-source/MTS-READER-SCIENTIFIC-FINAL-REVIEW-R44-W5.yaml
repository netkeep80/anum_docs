    title_ru: "Плотность технических идентификаторов"
    original_status: open
    editorial_assessment: technical-prose-remains
    assessment_ru: "R44-W4 добавляет научную аннотацию, десять переходов, предметные разборы и таблицы доказательств. Но 119 исходных меток остаются видимы непосредственно среди абзацев; это делает текст проверяемым, но не полностью пригодным для последовательного академического чтения."
    outstanding_ru: "Проверить итоговый рендер глазами и привести иерархию определение → лемма → доказательство → пример к читательскому виду. Отделить техническую трассировку от основного текста, не потеряв ни одного из 119 точных оригиналов."
    author_question_ru: "Является ли требование читаемости выполненным только после просмотра полной сформированной рукописи, а не по прохождению проверок количества атомов?"
