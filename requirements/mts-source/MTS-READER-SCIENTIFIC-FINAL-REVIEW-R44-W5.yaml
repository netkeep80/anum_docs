    outstanding_ru: "Сверить формулировку с принятым формальным языком и подтвердить Автором отсутствие утверждения универсального алгебраического равенства (A⟼B)⟼C=A⟼(B⟼C)."
    author_question_ru: "Достаточна ли иллюстрация трёх членов как научная граница DAS без постулирования алгебраической ассоциативности?"
