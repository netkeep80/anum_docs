accepted_id: V14-L1
candidate_ru: "В Метатеории Связей первичным онтологическим объектом является Связь (Link). Её образование описывается одной операцией form(a,b), связывающей две реляционно различимые полюсные позиции. При этом две позиции не являются двумя самостоятельными разновидностями Связей. Обозначения start(x) и finish(x) во внешнем математическом языке служат для обращения к этим позициям, а не добавляют новые операции образования в онтологию.\n\nДля заданной Связи x можно рассмотреть два отношения самоинцидентности: совпадает ли с x Связь в первой позиции и совпадает ли с x Связь во второй позиции. Их локальные ответы образуют четыре взаимоисключающих комбинации: 11 (оба совпадения), 10 (только первое), 01 (только второе) и 00 (ни одного). Это классификация отношений для данного x, а не четыре независимые команды, по которым выполняется построение Link. Исчерпываемость конструктивно предъявляемого разбиения требует локальных свидетельств разрешимости проверок; из перечисления четырёх случаев не следует наличие в произвольной модели представителей каждого из них. Вместе с тем в принятом корневом базисе МТС указаны конкретные свидетели: R представляет случай 11 (ROOT), O — случай 10 (START), C — случай 01 (END), L — случай 00 (PAIR). Это утверждение опирается на принятый базис и область его структурной классификации, а не на одну только комбинаторику четырёх ответов.\n\nДо выбора ориентации односторонние формы 10 и 01 рассматриваются как хирально сопряжённые. Для выбранного ориентированного контекста K их относительные роли могут обозначаться START_K и END_K, когда предъявлены требуемые ориентационные свидетельства. Знаки ∞/♂/♀/⟼ и рекурсивные символы 8/9/6/1 относятся к нотации и структурному представлению этих случаев. Они не являются четырьмя онтологическими операциями, командами процессора или алфавитом Anum и Q."
exclusions:
  - "Не выводить глобальную единственность всех самозамкнутых Связей из одного уравнения R=R⟼R"
  - "Не утверждать существование всех четырёх представителей без отдельных свидетелей"
  - "Не считать контекстную роль START_K/END_K глобально абсолютной без ориентационного выбора"
