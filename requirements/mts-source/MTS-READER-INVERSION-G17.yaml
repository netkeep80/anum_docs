# G17 cross-chapter normative dependency diagnostics. Normative != didactic dependency.
schema: mts-reader-inversion-audit/v0.1
status: proposed
semantic_change: false
author_approval: not-recorded
publication: blocked
reader_dag: scientific-review-pending
normative_edges_are_reader_edges: false
observations:
  - prerequisite: V14-L6
    consumer: V14-L7
    review: pending
    risk_ru: "Count работает с числом элементов ExactSequence, но тип результата Nat определён в более поздней главе об арифметике. Без раннего введения Nat значение Count останется нераскрытым."
    proposal_ru: "Предварительно определить Nat и её носитель перед разбором Count, а доказательства операций сложения оставить в арифметической главе."
  - prerequisite: V15-AUTH-01
    consumer: V15-STRUCT-01
    review: pending
    risk_ru: "Прямая v0.15 трансляция структурных форм ссылается на единый исполнительный маршрут, описанный позднее в архитектуре; читатель может ошибочно принять эти уровни за самостоятельные примитивы."
    proposal_ru: "В разделе основ дать краткое различие между структурой Link и исполнением, а подробную семантическую вертикаль изложить отдельно."
  - prerequisite: V15-JSON-02
    consumer: V15-STRUCT-01
    review: pending
    risk_ru: "Принятый структурный путь ссылается на общую FORMAL/JSON денотацию DAS, хотя синтаксис и семантика этого схождения вводятся только позднее; без уточнения возникает скрытая предпосылка."
    proposal_ru: "Отделить исходные структурные случаи v0.14 от v0.15 пути их записи и поставить явную ссылку на последующий раздел DAS."
  - prerequisite: V15-TERM-01
    consumer: V15-NAME-01
    review: pending
    risk_ru: "Норма о контекстных именах использует ANet, но нормативная терминология ANet вынесена в последнюю главу; имя объекта оказывается употреблено до его явного определения."
    proposal_ru: "Ввести ANet одним самостоятельным определением в начальном словаре, сохранив детальный терминологический раздел в конце."
  - prerequisite: V15-AUTH-01
    consumer: V15-NAME-01
    review: pending
    risk_ru: "Единый механизм разрешения контекстных имён предполагает общий FORMAL/JSON→ANet путь, описанный значительно позже; иначе легко спутать резолвер с host-глобальным словарём."
    proposal_ru: "Дать в начале главы FORMAL короткий обзор общего пути разрешения и показать, где архитектурная глава доказывает границу authority."
  - prerequisite: V15-AUTH-01
    consumer: V15-JSON-01
    review: pending
    risk_ru: "Полная JSON-проекция исходной ANet заявлена раньше введения единственной авторитетной исполнительной цепочки, из-за чего JSON может ошибочно восприниматься как независимая онтология."
    proposal_ru: "Добавить вводный мостик об общей исходной ANet и отделить сериализацию от выполнения ещё до подробных JSON-примеров."
  - prerequisite: V15-CLOSE-01
    consumer: V15-JSON-01
    review: pending
    risk_ru: "Требование полноты JSON нормативно опирается на замыкание семантических зависимостей, формализуемое в архитектуре позднее; без него слово «полная» не имеет проверяемой границы."
    proposal_ru: "Перед утверждениями о lossless JSON явно назвать область поддержанного источника и необходимость транзитивной closure-проверки."
  - prerequisite: V15-TERM-01
    consumer: V15-JSON-01
    review: pending
    risk_ru: "JSON-проекция использует нормативный термин ANet до его определения, поэтому читатель не различает термины ANet, Link, source ANet и semantic ANet."
    proposal_ru: "Перенести минимальное определение ANet перед первым употреблением, а различие видов ANet дать в схеме стадий исполнения."
  - prerequisite: V15-VERT-02
    consumer: V15-AND-01
    review: pending
    risk_ru: "Пример Boolean AND ссылается на критерии доказательной готовности, которые находятся в следующей главе assurance; тестовый пример можно ошибочно счесть уже принятым доказательством."
    proposal_ru: "Сначала обозначить пример как иллюстрацию, затем объяснить, почему статус VERTICAL_GREEN требует отдельного полного evidence bundle."
  - prerequisite: V15-AUTHOR-JSON-01
    consumer: V15-AND-04
    review: pending
    risk_ru: "Описание NOT/OR/XOR опирается на авторский gate канонического JSON, но процедура приёмки раскрывается в главе governance после примеров; возникает риск ложного одобрения."
    proposal_ru: "Непосредственно перед логическими примерами установить блокировку AUTHOR_REVIEW_PENDING и отослать детали решения в governance."
  - prerequisite: V15-CLOSE-01
    consumer: V15-CTX-01
    review: pending
    risk_ru: "Контекстные роли исполнения зависят от замкнутости внешних авторитетов, однако понятие транзитивной closure стоит после описания исполнения; связь может выглядеть необязательной."
    proposal_ru: "Вставить короткий раздел о dependency closure перед схемой Theory и Context/currentness, не смешивая с полюсной хиральностью."
  - prerequisite: V15-CLOSE-03
    consumer: V15-GAMMA-01
    review: pending
    risk_ru: "Универсальная Γ не должна содержать программно-специфическую host-семантику, но это архитектурное ограничение излагается после алгоритма реакции; без него исполнительная схема может выглядеть неуниверсальной."
    proposal_ru: "Перед вводом Γ сформулировать нулевой semantic injection budget и различие между универсальной оркестрацией и конкретно-программной семантикой."
  - prerequisite: V15-REG-01
    consumer: V15-FORMAL-PROOF-02
    review: pending
    risk_ru: "Парные математические свидетельства связаны с регрессионным корпусом, который описан позднее; из-за такого порядка возможно неверно отождествить формальное proof с успешным replay."
    proposal_ru: "В доказательном разделе заранее разграничить theorem, executable corpus и обязанность регистрации авторски принятого JSON."
  - prerequisite: V15-TERM-01
    consumer: V15-STAGE-01
    review: pending
    risk_ru: "Перечень стадий обработки использует термины ANet и FORMAL ещё до последней терминологической главы; это создаёт непрозрачность различия исходной и семантической асети."
    proposal_ru: "Разместить минимальный словарь ANet и названия стадий до архитектурной диаграммы, сохранив нормативную терминологическую политику."
  - prerequisite: V15-GOV-02
    consumer: V15-CORPUS-01
    review: pending
    risk_ru: "Прогон утверждённого корпуса ссылается на правила аудита отсутствия backend-semantic injection, которые читаются только в последующей главе governance; неясно, почему правильный результат недостаточен."
    proposal_ru: "Предварить корпус описанием того, что проверяется не только выход, но и происхождение операционного смысла, а детали аудита дать позднее."
  - prerequisite: V15-DOCS-01
    consumer: V15-READY-01
    review: pending
    risk_ru: "Релизная готовность нормативно зависит от детерминированной документации, но раздел о построении документации расположен после readiness gate; полноценность релиза нельзя оценить до понимания этого условия."
    proposal_ru: "Указать в релизных критериях необходимость заранее готовой детерминированной проекции документации или перенести release gates в конец."
  - prerequisite: V15-AUTHOR-JSON-03
    consumer: V15-REG-01
    review: pending
    risk_ru: "Регистрация утверждённых JSON требует привязки согласия к exact digest, но правило авторской ревизии изложено после regression-процедуры; возникает риск неконтролируемого наследования approval."
    proposal_ru: "До определения regression corpus ввести точную привязку авторского одобрения к ревизии, оставив процедуру подписания в governance."
