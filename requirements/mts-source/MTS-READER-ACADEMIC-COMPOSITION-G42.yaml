    title_ru: "Основания: связь, полюса и локальные формы"
    bridge_ru: "Исходная онтология вводит Link и различимые полюсные позиции; описание локальных случаев не утверждает существование представителей каждой формы."
    scope_ru: "До Grounded и тождества по полюсам необходимо установить локальные предпосылки и явные условия существования."
    boundary_ru: "Не выводить глобальную экстенсиональность или существование каждой формы только из локальной исчерпываемости."
