    bridge_ru: "Здесь размещаются независимые регрессионные свидетельства, декодеры, полнота трасс, тестирование слоёв, отрицательные фальсификаторы и provenance."
    scope_ru: "GREEN означает подтверждённый заявленный фрагмент на точном артефакте, не математическое доказательство всего компилятора."
    boundary_ru: "Не считать отменённые/пропущенные CI успешными; не повышать статус проверки за пределы фактических jobs."
