  - id: grounded-inverse-context
    title_ru: "Заземлённость, тождество, инверсия и контекстная ориентация"
    bridge_ru: "Теперь вводятся ограничения Grounded, требуемые для условного тождества, затем инверсия и отдельные абсолютные и относительные утверждения о хиральности."
    scope_ru: "FND-13 применимо после F2F3GroundedNormalization и при двух свидетельствах Grounded."
    boundary_ru: "CTX-03 не требует глобального маркера контекста для объективного результата."
    positions: [12, 29]
