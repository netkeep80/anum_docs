    title_ru: "Представление асети и первые определения кодеков"
    bridge_ru: "После онтологии вводятся знаки, уровни представления, ExactSequence, Q и операционный словарь; G41 показывает раннее определение Q без замены его позднего полного описания."
    scope_ru: "Различать физическую Link-структуру, семантическую ANet, ExactSequence и внешние представления."
    boundary_ru: "Не приравнивать декодированную строку к тождеству связи; исходные пояснения L и U выводятся позднее."
    positions: [30, 42]
  - id: derived-and-context
    title_ru: "Производные шкалы, структурные преобразования и версии Q"
    bridge_ru: "Различаются Nat и Degree, неотождествляемые без отдельного результата; полное определение Q вводится из исходного G7."
    scope_ru: "Сохраняется версионирование кодеков и явная область применимости относительных ориентаций."
    boundary_ru: "Отложенное пояснение L/U не является новой аксиомой; синтаксическое переписывание не доказывает семантическую эквивалентность."
    positions: [43, 55]
  - id: grammar-and-historical-mp
    title_ru: "Нотация, последовательная ассоциация и историческое развитие MP"
    bridge_ru: "Описание графических и символьных форм предшествует переходу от v0.14 к принятой v0.15; ранний обобщённый MP и поздняя исполняющая Γ имеют разные статусы."
    scope_ru: "В остенсивной грамматике v0.14 implicitPairAssociativity=NONE означает отсутствие неявного правила группировки; это не закон алгебры Link. Отдельно v0.15 задаёт Direct Sequential Association для чтения цепочек в собственной области."
    boundary_ru: "Не переписывать исторический текст так, будто Γ v0.15 является доказательной предпосылкой для MP v0.13/v0.14."
    positions: [56, 71]
  - id: v015-ontology
    title_ru: "Семантическая область принятой v0.15"
    bridge_ru: "Новая версия сохраняет единую онтологию Link. Ни роль контекста, ни имя, ни внешний кодек не добавляют второго математического сорта."
    scope_ru: "Объяснять положения о Link, ANet, Theory/Context/Entry/Result отдельно от гарантий инфраструктуры."
    boundary_ru: "Не переносить требования к CI, релизу или бэкенду в математические теоремы."
    dispositions: [terminology, mathematical-scope]
  - id: v015-execution
    title_ru: "FORMAL, JSON, Γ и исполняемые примеры"
    bridge_ru: "Отдельно рассматриваются денотация и роль структурных операторов, перенос из FORMAL/JSON в нативную ANet, S1/S2, AND и другие операции через одну Γ."
    scope_ru: "AND должен демонстрировать FF/FT/TF/TT и NO_MATCH вне T/F; ExactSequence и F_R различаются. Примеры до второго прохода помечены как требующие source-owned evidence."
    boundary_ru: "Любой новый исполняемый JSON требует отдельного явного авторского утверждения; здесь ничего исполняемого не добавлено."
    dispositions: [formal-execution, execution-contract, notation-example, worked-example-needed]
  - id: proof-and-refinement
    title_ru: "Формально проверенный фрагмент и пределы свидетельств"
    bridge_ru: "Парные Lean4/Rocq результаты предъявляются с точными идентификаторами, предпосылками и исключениями, считанными из принятого реестра."
    scope_ru: "FRM-03: трёхчленная DSA не является алгебраической ассоциативностью; FRM-04 условна по ExactSequence injectivity; FRM-07 требует production refinement premises."
    boundary_ru: "Нельзя заявлять ни доказательство TS-реализации Lean/Rocq, ни глобальную инъективность production encoder."
    dispositions: [proof-evidence]
  - id: reproducibility-assurance
