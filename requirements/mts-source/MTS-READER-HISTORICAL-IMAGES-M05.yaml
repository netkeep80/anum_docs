heading_ru: "M05. Архивные иллюстрации и граница научной атрибуции"
intro_ru: "Исторические изображения являются самостоятельными исследовательскими свидетельствами, но сами по себе не заменяют сформулированное доказательство или принятое требование. В данном приложении перечислены все двадцать девять исторических файлов, сохранённых в pics и защищённых авторским реестром, а также отдельный исходный баннер README. Для каждого файла ведётся ссылка на фиксированный Git-коммит; исходный байтовый состав не меняется. Отсутствие научного размещения не позволяет автоматически считать историческую схему актуальной математической моделью МТС v0.15."
caption_ru: "Ссылки далее являются архивными идентификаторами файлов, а не научными подписями. Даже если имя содержит термины МТС, семантическая интерпретация содержания и выбор главы требуют независимого сопоставления с исходными документами и авторского решения. PNG и SVG, имеющие близкие названия, остаются разными сохранёнными оригиналами; нельзя заменять один другим ради более красивой публикации."
boundary_ru: "Проверено сохранение 29 файлов из неизменного реестра и одного README-баннера, но это не означает 29 научно атрибутированных и расположенных иллюстраций. Генератор пока не вставляет исторические изображения внутрь доказательств: отсутствуют подтверждённые источником подписи. Отдельные исходные изображения по-прежнему доступны по точным ссылкам. Научное размещение остаётся OPEN; весь текст монографии остаётся предложением и не утверждён Автором."
