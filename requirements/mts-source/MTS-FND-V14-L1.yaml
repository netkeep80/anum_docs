reader_science:
  schema: mts-reader-science/v0.2
  status: proposed
  proof_check: declarations-only
  publication: blocked
  author_approval: not-recorded
  steps:
    - id: foundation
      role: definition
      ru: |-
        Во внешнем математическом интерфейсе Foundation задан носитель Link, одна операция образования form(a,b), две проекции полюсных позиций start(x) и finish(x) и выделенная Связь R. Приняты уравнения start(form(a,b))=a, finish(form(a,b))=b и form(R,R)=R. Поэтому start(R)=R и finish(R)=R; единственность такой Связи пока не доказана. Проекции являются средствами внешнего описания двух полюсных позиций, а не дополнительными примитивами онтологии МТС.
      proof_symbol: Foundation
      requires: []
      premises: []
      domain: ["Foundation"]
      exclusions: []
    - id: incidence
      role: definition
      ru: |-
        Для Связи x локальные предикаты FullSelf, StartOnly, FinishOnly и PairLocal различают соответственно оба совпадения start(x)=x и finish(x)=x, только первое, только второе и ни одного. Метаобозначения 11/10/01/00 фиксируют эти четыре логически несовместимых случая, а не четыре сорта Связей. LocalSelfDecision(F,x) — предъявленные логические свидетельства выбора между равенством и неравенством для каждой позиции; они дают конструктивную исчерпываемость классификации данного x, но не общий исполнимый алгоритм равенства и не доказательство существования представителей всех случаев.
      proof_symbol: StartOnly
      requires: [foundation]
      premises: []
      domain: ["Link"]
      exclusions: []
    - id: grounded
      role: definition
      ru: |-
        Grounded(F,x) — внешнее индуктивное свидетельство конечного рекурсивного обоснования Связи x. Для полюса, совпадающего с x, новая обязанность не возникает; для каждого несовпадающего полюса предъявляется Grounded для соответствующей Связи. Конечность относится к доказательному объекту, а не запрещает существование иных циклических структур Связей и не устанавливает тотальность какой-либо операции.
      proof_symbol: Grounded
      requires: [foundation, incidence]
      premises: []
      domain: ["Link"]
      exclusions: []
    - id: distinction
      role: definition
      ru: |-
        Distinguishable(F,x,y) — внешний индуктивный предикат конечной рекурсивной различимости двух Связей. Свидетельство предъявляет несовпадение локальных признаков самоинцидентности на одной из двух полюсных позиций либо рекурсивную различимость соответствующих несовпадающих полюсов. Сам предикат задаётся для произвольных x и y; ограничение Grounded появляется в последующей предпосылке A1, а не в определении Distinguishable.
      proof_symbol: Distinguishable
      requires: [grounded]
      premises: []
      domain: ["Link × Link"]
      exclusions: []
    - id: separation-a1
      role: premise
      ru: |-
        A1RecursiveSeparation(F) — отдельная предпосылка внешней математической модели. Она утверждает: для двух Связей x и y, каждая из которых имеет Grounded-свидетельство, отсутствие Distinguishable(F,x,y) влечёт x=y. A1 не выводится из одних равенств для операции form и проекций start/finish.
      proof_symbol: A1RecursiveSeparation
      requires: [distinction]
      premises: []
      domain: ["Grounded"]
      exclusions: []
    - id: root-uniqueness
      role: conditional-theorem
      ru: |-
        При A1RecursiveSeparation(F) теорема FND_02_unique_root утверждает: всякая Связь x с FullSelf(F,x) тождественна выделенной R. Для такого x Grounded следует из FullSelf; следовательно, доказательство единственности использует A1 и не требует постулировать единственность корня или равенство произвольных Связей по полюсам.
      proof_symbol: FND_02_unique_root
      requires: [incidence, separation-a1]
      premises: [A1RecursiveSeparation]
      domain: ["FullSelf"]
      exclusions: ["not from Foundation alone"]
    - id: one-sided-existence
      role: premise
      ru: |-
        F2F3OneSidedExistence(F) — дополнительная предпосылка внешнего интерфейса, предъявляющая u и v с u=form(u,R), v=form(R,v), u≠R и v≠R. Она вводится отдельно от Foundation и от логической классификации 11/10/01/00; существование этих представителей нельзя выводить из одного перечня возможностей.
      proof_symbol: F2F3OneSidedExistence
      requires: [root-uniqueness]
      premises: []
      domain: ["Foundation"]
      exclusions: []
    - id: one-sided-realizability
      role: conditional-theorem
      ru: |-
        Из F2F3OneSidedExistence(F) и законов Foundation теорема FND_01_grounded_realizability выводит FullSelf(F,R) и существование трёх Связей с Grounded-свидетельствами: представителя StartOnly, представителя FinishOnly и представителя PairLocal. Таким образом, логические случаи 10, 01 и 00 получают свидетелей при явно принятой дополнительной предпосылке; это не безусловное существование в любом Foundation.
      proof_symbol: FND_01_grounded_realizability
      requires: [one-sided-existence, grounded]
      premises: [F2F3OneSidedExistence]
      domain: ["constructed witnesses"]
      exclusions: ["not from logical partition alone"]
    - id: grounded-normalization
      role: premise
      ru: |-
        F2F3GroundedNormalization(F) — дополнительный внешний интерфейс нормальных форм для конечного домена Grounded. Он задаёт normalForm, compose и рекурсивное уравнение нормализации. Поле complete утверждает лишь для двух Grounded-связей: равенство их нормальных форм влечёт равенство самих Связей; здесь не предполагается глобальная полнота нормализации для всех Link.
      proof_symbol: F2F3GroundedNormalization
      requires: [grounded, one-sided-realizability]
      premises: []
      domain: ["Grounded"]
      exclusions: []
    - id: identity-by-poles
      role: conditional-theorem
      ru: |-
        При F2F3GroundedNormalization(F) и предъявленных Grounded(F,x), Grounded(F,y) теорема FND_13_identity_by_poles устанавливает эквивалентность x=y и одновременного равенства start(x)=start(y), finish(x)=finish(y). Существенный шаг обратного направления опирается на полноту grounded-нормализации. Теорема не устанавливает экстенсиональность всех возможных циклических Связей.
      proof_symbol: FND_13_identity_by_poles
      requires: [grounded-normalization]
      premises: [F2F3GroundedNormalization]
      domain: ["Grounded(x), Grounded(y)"]
      exclusions: ["no claim for arbitrary ungrounded Links"]
    - id: inversion-domain
      role: premise
      ru: |-
        RecursiveInversionDomain(F,E), где E — ранее предъявленная F2F3OneSidedExistence(F), является отдельной предпосылкой внешнего доказательного интерфейса. Она задаёт рекурсивные односторонние формы startForm(a)=form(startForm(a),a) и endForm(a)=form(a,endForm(a)), совместимость этих форм с R и свидетельства LocalSelfDecision для Grounded-связей. Само существование такого D не следует из одних уравнений Foundation.
      proof_symbol: RecursiveInversionDomain
      requires: [one-sided-existence, grounded]
      premises: []
      domain: ["Foundation, E"]
      exclusions: []
    - id: inversion-relation
      role: definition
      ru: |-
        RecursiveInversion(F,D,x,y) — внешнее индуктивное отношение структурной инверсии Связи x в Связь y при заданном RecursiveInversionDomain D. В Rocq параметр E интерфейса D выписан явно, в Lean он восстанавливается из параметров. Определение отношения ещё не задаёт безусловную глобальную функцию J на всех Связях.
      proof_symbol: RecursiveInversion
      requires: [inversion-domain, incidence]
      premises: []
      domain: ["Foundation, E, D"]
      exclusions: []
    - id: inversion-total
      role: conditional-theorem
      ru: |-
        При A1RecursiveSeparation(F), F2F3OneSidedExistence(F), RecursiveInversionDomain(F,E) и Grounded(F,x) теорема INV_01_recursive_inversion_total утверждает существование y, для которого RecursiveInversion(F,D,x,y). Отдельная F2F3GroundedNormalization не является предпосылкой этой теоремы. Нельзя распространять установленное существование на произвольные Связи без Grounded.
      proof_symbol: INV_01_recursive_inversion_total
      requires: [inversion-relation, separation-a1]
      premises: [A1RecursiveSeparation, F2F3OneSidedExistence, RecursiveInversionDomain]
      domain: ["Grounded(x)"]
      exclusions: ["no totality on arbitrary ungrounded Links"]
    - id: inversion-involutive
      role: conditional-theorem
      ru: |-
        При A1RecursiveSeparation(F), F2F3GroundedNormalization(F), F2F3OneSidedExistence(F), RecursiveInversionDomain(F,E) и Grounded(F,x) теорема INV_02_unique_total_involution даёт Связи y и z, для которых существуют последовательные отношения инверсии x→y и y→z и выполнено z=x. Это условный реляционный результат, а не объявление глобальной примитивной функции J для всех Link.
      proof_symbol: INV_02_unique_total_involution
      requires: [inversion-total, grounded-normalization]
      premises: [A1RecursiveSeparation, F2F3GroundedNormalization, F2F3OneSidedExistence, RecursiveInversionDomain]
      domain: ["Grounded(x)"]
      exclusions: ["not a global primitive J function"]
    - id: chiral-classes
      role: definition
      ru: |-
        ProperOneSided(F,x) означает StartOnly(F,x) либо FinishOnly(F,x). Для двух таких Связей внешний предикат SameChiralClass фиксирует совпадение позиционного класса, а OppositeChiralClass — противоположность классов. Эти отношения описывают полюсную хиральность, но не создают новых сортов Link и не назначают имена START_K/END_K до выбора контекста.
      proof_symbol: SameChiralClass
      requires: [incidence, inversion-relation]
      premises: []
      domain: ["ProperOneSided"]
      exclusions: []
    - id: chiral-orbit
      role: conditional-theorem
      ru: |-
        При A1RecursiveSeparation(F), F2F3GroundedNormalization(F), F2F3OneSidedExistence(F) и RecursiveInversionDomain(F,E) теорема CTX_03_objective_chiral_orbit_before_context утверждает существование различных Связей w и jw, взаимно связанных структурной инверсией и принадлежащих противоположным односторонним классам. Эта экзистенциальная орбита не требует предварительно выбранного контекста и не назначает глобально фиксированную Связь W.
      proof_symbol: CTX_03_objective_chiral_orbit_before_context
      requires: [chiral-classes, inversion-involutive]
      premises: [A1RecursiveSeparation, F2F3GroundedNormalization, F2F3OneSidedExistence, RecursiveInversionDomain]
      domain: ["Foundation"]
      exclusions: ["no globally selected W"]
    - id: context-marker
      role: definition
      ru: |-
        ContextOrientationMarker(F,D,body,m) — внешний предикат допустимости контекстного маркера: m должен совпадать с D.startForm(body) или D.endForm(body) при предъявленном RecursiveInversionDomain D. Параметр E интерфейса D в Lean неявен, в Rocq явен. Выбор такого маркера необходим для относительной ориентации; у произвольного контекста наличие маркера не объявляется автоматически.
      proof_symbol: ContextOrientationMarker
      requires: [chiral-orbit, inversion-domain]
      premises: []
      domain: ["body, selected marker"]
      exclusions: []
    - id: context-roles
      role: conditional-theorem
      ru: |-
