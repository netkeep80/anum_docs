reader_definitions:
  review_evidence:
    issue: 2132
    comment: 6103120355
  proof_sources:
    - proofs/lean4/MtsFoundation.lean
    - proofs/coq/MtsFoundation.v
  entries:
    - id: reader-def-root
      kind: definition
      domain: "Foundation"
      ru: |-
        Во внешнем математическом интерфейсе Foundation заданы носитель Link, формирующая операция form и выделенная Связь R; start и finish служат внешними проекциями полюсных позиций, а не самостоятельными примитивами МТС. Уравнения start(form(a,b))=a, finish(form(a,b))=b и form(R,R)=R дают start(R)=R и finish(R)=R: корень полностью самозамкнут. Сама R является входом внешней модели, а не результатом построения из одних уравнений проекций. Здесь FullSelf(F,x) означает одновременное выполнение start(x)=x и finish(x)=x; при фиксированном F далее используется сокращение FullSelf(x).
        Единственность полностью самозамкнутой Связи утверждается отдельно: FND_02_unique_root выводит FullSelf(x) ⇒ x=R при дополнительной предпосылке A1RecursiveSeparation.
      prerequisites: []
      proof_symbols: [FullSelf, root_full_self, FND_02_unique_root]
      external_metanotation: true
      author_approval: not-recorded
    - id: reader-def-local-decision
      kind: definition
      domain: "Foundation, конкретная Связь x"
      ru: |-
        Для Связи x определены два локальных свойства: start(x)=x и finish(x)=x. Их сочетания обозначаются 11, 10, 01, 00: оба полюса совпадают с x, только первый, только второй, ни один. Соответствующие внешние предикаты: FullSelf(x) — оба совпадения; StartOnly(x) — start(x)=x и finish(x)≠x; FinishOnly(x) — start(x)≠x и finish(x)=x; PairLocal(x) — оба полюса не равны x. Это метаобозначения, а не четыре вида сущностей МТС.
        LocalSelfDecision(F,x) означает предъявленные логические свидетельства (start(x)=x ∨ start(x)≠x) и (finish(x)=x ∨ finish(x)≠x). Они позволяют конструктивно установить один из четырёх случаев для данного x, но не доказывают наличие вычислительного алгоритма для всех Связей. Попарная несовместимость случаев не требует LocalSelfDecision; конструктивная исчерпываемость требует.
      prerequisites: [reader-def-root]
      proof_symbols: [StartOnly, FinishOnly, PairLocal, LocalSelfDecision, local_self_incidence_exhaustive, local_self_incidence_exclusive]
      external_metanotation: true
      author_approval: not-recorded
    - id: reader-def-grounded
      kind: definition
      domain: "Foundation, Связь x"
      ru: |-
        Grounded(F,x) — внешнее индуктивное свидетельство конечного обоснования структуры x. Для полюса, который совпадает с x, новая рекурсивная обязанность отсутствует; для каждого несовпадающего полюса требуется Grounded соответствующей Связи. Конечен доказательный объект, но это не запрет иных циклических структур Связей.
        Это условие области применения отдельных теорем, а не самостоятельная теорема тотальности. Теорема FND_13_identity_by_poles утверждает для Grounded(F,x) и Grounded(F,y): x=y тогда и только тогда, когда совпадают полюса x и y; дополнительно предполагается внешний интерфейс F2F3GroundedNormalization(F), чьё свойство complete означает: равенство нормальных форм двух Grounded-связей влечёт равенство самих Связей. Другая теорема INV_01_recursive_inversion_total устанавливает существование структурного инверса для Grounded(F,x) при A1RecursiveSeparation(F), F2F3OneSidedExistence(F) и RecursiveInversionDomain(F,E); F2F3GroundedNormalization не является её предпосылкой. У каждой теоремы своя область и свой набор условий.
      prerequisites: [reader-def-local-decision]
      proof_symbols: [Grounded, F2F3GroundedNormalization, FND_13_identity_by_poles, INV_01_recursive_inversion_total]
      external_metanotation: true
      author_approval: not-recorded
    - id: reader-premise-one-sided-existence
      kind: premise
      domain: "Foundation с дополнительным F2F3OneSidedExistence"
      ru: |-
        F2F3OneSidedExistence(F) — отдельная предпосылка внешней модели: существуют u и v такие, что u=form(u,R), v=form(R,v), u≠R и v≠R. Из неё совместно с законами Foundation выводятся StartOnly(u), FinishOnly(v), PairLocal(form(u,v)) и свидетельства Grounded для трёх построенных представителей (FND_01_grounded_realizability).
        Эти представители не следуют из одного слабого интерфейса Foundation в данном доказательстве. Здесь не заявляется отдельное модельно-теоретическое доказательство независимости предпосылки от всей принятой МТС.
      prerequisites: [reader-def-root, reader-def-local-decision, reader-def-grounded]
      proof_symbols: [F2F3OneSidedExistence, FND_01_grounded_realizability]
      external_metanotation: true
      author_approval: not-recorded
    - id: reader-def-context-relative-role
      kind: definition
      domain: "Односторонние Связи, выбранный контекстный маркер и RecursiveInversionDomain"
      ru: |-
        ProperOneSided(x) означает StartOnly(x) или FinishOnly(x). Предикат SameChiralClass(m,x) означает принадлежность m и x одному из этих двух позиционных классов; OppositeChiralClass(m,x) — принадлежность противоположным классам. Это внешние отношения, не дополнительный тип Связей.
        Внешний интерфейс RecursiveInversionDomain(F,E) дополнительно задаёт рекурсивные односторонние формы startForm(a)=form(startForm(a),a) и endForm(a)=form(a,endForm(a), их совместимость с корнем R и LocalSelfDecision для Grounded-связей; это отдельная предпосылка, а не следствие одних законов Foundation.
        Предикат ContextOrientationMarker(F,D,body,m) требует m=D.startForm(body) или m=D.endForm(body) для предъявленной RecursiveInversionDomain D, зависящей от F и E=F2F3OneSidedExistence(F); параметр E неявен в Lean, явен в Rocq. При A1RecursiveSeparation(F), E, D, body и таком выбранном m теорема CTX_03_context_selection_induces_local_roles устанавливает существование двух различных допустимых маркеров: localStart того же класса, что m, и localEnd противоположного класса. Здесь K обозначает контекст с предъявленным допустимым ориентационным маркером; роли START_K и END_K относятся к этому выбору, а не к абсолютной ориентации всех Связей. Теорема не утверждает, что произвольный контекст автоматически имеет такой маркер.
      prerequisites: [reader-def-local-decision, reader-premise-one-sided-existence]
      proof_symbols: [ProperOneSided, SameChiralClass, OppositeChiralClass, RecursiveInversionDomain, ContextOrientationMarker, ContextLocalStartRole, ContextLocalEndRole, CTX_03_context_selection_induces_local_roles]
      external_metanotation: true
      author_approval: not-recorded

