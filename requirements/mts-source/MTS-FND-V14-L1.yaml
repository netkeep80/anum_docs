  proposed_statement:
    ru: |-
      МТС рассматривает одну первичную сущность — Связь (Link). У каждой Связи различаются две полюсные позиции. Её образование задаётся одной абстрактной операцией, использующей значения обеих позиций.

      Пусть x — произвольная Связь. Для каждой полюсной позиции проверяется, совпадает ли занимающая её Связь с x. В записи ab символ 1 обозначает совпадение, а 0 — несовпадение; это условные знаки внешнего математического описания. Если оба сравнения разрешимы (предпосылка LocalSelfDecision), x принадлежит ровно одному из четырёх непересекающихся случаев: 11, 10, 01, 00.

      Эта классификация не доказывает, что все четыре случая реализованы в каждой модели. При предпосылке A1RecursiveSeparation полностью самозамкнутая Связь (11) единственна и совпадает с ROOT; существование односторонних представителей требует F2F3OneSidedExistence, а парный представитель образуется из них посредством общей операции образования Связи.

      На этом уровне два односторонних случая различаются позиционно, но не получают абсолютных имён «начало» и «конец». Их контекстно-относительные имена определяются отдельно, после задания ориентации.
    sha256: dd23ce6dd82c5f13205364dfd5a03e51ded3f1bc1c9b07ec6e8a6e819ec51040
    source_role: editorial-proposal
    author_approval: not-recorded

