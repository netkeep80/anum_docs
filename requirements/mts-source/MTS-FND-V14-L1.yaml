      diagnosis_ru: 'До списка не объяснены обе позиции и значение метазнаков 0 и 1.'
    - id: V14-L1-ED04
      category: missing-premise-boundary
      quote: 'четыре и только четыре класса самоинцидентности'
      diagnosis_ru: 'Разбиение случаев не равно существованию представителей; конструктивная классификация требует LocalSelfDecision.'
    - id: V14-L1-ED05
      category: forward-reference
      quote: 'средние два образуют одну хиральную орбиту'
      diagnosis_ru: 'До этого предложения не определены инверсия, орбита и её область; место утверждения — после введения этих понятий.'
    - id: V14-L1-ED06
      category: representation-leak
      quote: '`8/9/6/1` — рекурсивный структурный алфавит этих форм.'
      diagnosis_ru: 'Коды структурного представления преждевременно смешаны с онтологической классификацией.'
  proposed_statement:
    ru: |-
      МТС принимает одну первичную сущность — Связь (Link). У Связи различаются две полюсные позиции; образование Связи задаётся одной абстрактной операцией над двумя Связями. Во внешнем математическом описании обозначим проекции позиций s(x) и f(x), а образование — form(a,b), где s(form(a,b))=a и f(form(a,b))=b. Эти обозначения не вводят в МТС дополнительные сущности или машинные команды.

      Для Связи x самоинцидентность первой позиции означает s(x)=x, второй — f(x)=x. Запись ab использует внешние метазнаки: 1 означает совпадение, 0 — несовпадение; первый знак относится к первой позиции, второй — ко второй. Случаи 11, 10, 01, 00 попарно несовместимы без предположения о разрешимости произвольного равенства. Если для x предъявлено LocalSelfDecision, эти четыре случая образуют также исчерпывающую конструктивную классификацию.

      Разбиение случаев не утверждает существования представителей каждого случая. При A1RecursiveSeparation полностью самозамкнутая Связь (11) единственна и равна корню R (FND-02). При отдельной предпосылке F2F3OneSidedExistence существуют собственные односторонние представители 10 и 01, из которых общей операцией form строится представитель 00; их реализуемость в области Grounded установлена FND-01. Существование и единственность относятся к разным утверждениям.

      До введения структурной инверсии и ориентированного контекста K случаи 10 и 01 различаются по позициям, но не получают абсолютных имён «начало» и «конец». Только после выбора Link-структурного ориентационного маркера возникают локальные роли START_K и END_K. Тогда четыре структурных случая обозначаются ROOT, START_K, END_K и PAIR, а их рекурсивное представление использует коды 8/9/6/1. Эти коды не являются алфавитом Anum или Q и не определяют систему команд процессора.
    sha256: cc2673338708ca4dd245e1aa2b894d51a4859359960037bf25c5d7445d2c71c9
    source_role: editorial-proposal
    author_approval: not-recorded

