heading_ru: "M03. Языковые уровни и точное употребление математических обозначений"
intro_ru: "В научном тексте необходимо различать четыре уровня: выбранную одноcортную онтологию Link; синтаксис FORMAL/JSON с именами, пучками ролей и точными последовательностями; внешний математический язык, в котором Lean4/Rocq проверяют теоремы; и исполняемые TypeScript-свидетельства выбранных алгоритмов. Одинаковый печатный символ не делает операции различных уровней эквивалентными. Следующие десять определений закрепляют области употребления и намеренно не вводят новые принятые аксиомы."
