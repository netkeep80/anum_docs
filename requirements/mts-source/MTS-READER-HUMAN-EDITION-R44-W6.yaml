  body_ru: "Основной текст вводит математические понятия в проверяемом порядке, а исходные машинные идентификаторы, повторяющие определения редакционные комментарии и административные требования вынесены в приложения. Это перемещение не является удалением или переписыванием источников."
  caveat_ru: "Это генерация читательского черновика, а не окончательная публикация. Доказательства и условия применимости предъявляются только в пределах принятых внешних свидетельств; девять научных замечаний R40 остаются открытыми до отдельной авторской экспертизы."
  archive_ru: "Все 119 исходных текстов сохраняются без перефразирования: 102 в основной научной части и 17 в архивных приложениях. Для Q и L/U сохранность проверяется конкатенацией точно исходных фрагментов при их разнесённом первом употреблении."
  assurance_ru: "Редакционные рецензии всех 48 требований v0.15 и девяти открытых замечаний R40 помещаются в отдельные приложения и не объявляются теоремами МТС."
