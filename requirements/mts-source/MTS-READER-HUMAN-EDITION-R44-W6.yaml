  reason_ru: "Прямой просмотр действительного результата генератора выявил пустую десятую главу, повторяющиеся обезличенные заголовки, лишний пробел перед правилами Q и дубль предупреждения NO_MATCH в примере AND. Ремонт производится только в редакционной проекции с полным сохранением исходных 119 атомов."
  basis_boundary_ru: "Для записи базиса символ a ⟼ b в §1 означает внешнюю операцию form(a,b), а не новую онтологическую операцию. Знак = в формулах §1 является математическим равенством внешнего метаязыка, а не оператором = исполняемой МТС, возвращающим L/U. R=F.R задана Foundation без дополнительной предпосылки. Нетривиальные односторонние O и C выбираются лишь при E : F2F3OneSidedExistence(F): O=E.startRoot, C=E.finishRoot, O≠R и C≠R; после этого L=form(O,C), U=form(C,O). Одних уравнений O=form(O,R) и C=form(R,C) недостаточно: им также удовлетворяет R, поскольку form(R,R)=R. В частности, одноэлементная внешняя модель с носителем {R}, операцией form(R,R)=R и проекциями start(R)=finish(R)=R удовлетворяет всем трём законам Foundation, но не допускает E. Это условие подробно разбирается в F03 ниже; существование E из одной Foundation здесь не утверждается."
