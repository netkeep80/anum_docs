symbols:
  - symbol: R
    exact_equation: "R = R ⟼ R"
    explanation_ru: "R является выделенной корневой Связью и удовлетворяет самозамкнутому уравнению R=R⟼R. Она служит локальным началом последовательностей; одно лишь уравнение ещё не доказывает единственность всех возможных самозамкнутых объектов Foundation."
    exclusions: ["Не доказывать глобальную единственность самозамкнутых Link одним уравнением"]
  - symbol: O
    exact_equation: "O = O ⟼ R"
    explanation_ru: "Связь O задана уравнением O=O⟼R: её первая реляционная полюсная позиция совпадает с O, вторая связана с корневой R. Обозначение относится к наследуемому корневому базису, а не создаёт глобально ориентированный START для каждого Context."
    exclusions: ["Не переносить одностороннюю форму O на безусловную START-ориентацию"]
  - symbol: C
    exact_equation: "C = R ⟼ C"
    explanation_ru: "Связь C задана уравнением C=R⟼C: её вторая полюсная позиция совпадает с C, первая связана с R. Это именованная Связь принятого корневого базиса, а не новая операция образования и не глобально выбранная ориентация контекста."
    exclusions: ["Не превращать C в абсолютный END произвольного ориентированного Context"]
  - symbol: L
    exact_equation: "L = O ⟼ C"
    explanation_ru: "Связь L определяется композицией L=O⟼C и входит в наследуемый корневой базис. Отдельно в производной шкале Degree она обозначает первую степень D₁=L; это не даёт основания приравнивать её к единице Nat, определяемой через U⟼L."
    exclusions: ["Не считать L самостоятельным видом онтологии или тождественной Nat-единицей"]
  - symbol: U
    exact_equation: "U = C ⟼ O"
    explanation_ru: "Связь U определяется как U=C⟼O и входит в корневой базис как производная Link. Она служит нулём шкалы Nat, N₀=U, но локальный источник ExactSequence остаётся R; обе роли начала не позволяют отождествить U и R."
    exclusions: ["Не отождествлять U с R либо пустой позиционной последовательностью"]
