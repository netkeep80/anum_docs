format: repo-guard/requirement-v1
id: V15-JSON-02
normative: "FORMAL text and direct JSON converge to the same native source ANet roles, resolver and DAS denotation path before semantics. In direct JSON, object-member null denotes a bare source entry, a string RHS denotes a binding, a nested object denotes an anchored source bundle, and a structured bare key denotes resolved semantic membership. A root binding alone does not publish semantic membership. A non-empty role bundle publishes its resolved role members plus its Theory-to-Rule admission, while a grounded empty role bundle publishes only its Theory-to-Rule admission."
