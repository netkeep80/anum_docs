schema: mts-external-audit-methodology/v1
id: MTS-EA-v1
kind: review-methodology
status: author-accepted
authority_scope: independent-review-methodology-only
accepted_mts_semantics_unchanged: true
source_proposal_issue: 2132
source_proposal_comment: 6143150188
author_decision_issue: 2132
author_decision_comment: 6143247912
language: ru
requirements:
  - id: MTS-EA-01
    title_ru: "Название и предмет"
    statement_ru: "Использовать «Метатеория Связей»; Link-native метатеоретическая онтология, не исторический «graph theory»."
    falsifier_ru: "предмет переименован в «теорию связей» и сведен к графу/магме."
  - id: MTS-EA-02
    title_ru: "Порядок авторитета"
    statement_ru: "Сначала exact accepted native v0.15 (и соответствующие v0.14 inherited laws), затем предложенная научная редакция, затем внешняя модель."
    falsifier_ru: "model Foundation или справочник классической математики объявлен нормативным первоисточником МТС."
  - id: MTS-EA-03
    title_ru: "Native-first"
    statement_ru: "Рецензент обязан выписать собственные primitive/roles/relations/identity/Context/Γ и явно отделить внешние `Foundation`/Lean/Rocq/TypeScript/хранилища."
    falsifier_ru: "«Link = node of a graph» без отдельно построенного отображения."
  - id: MTS-EA-04
    title_ru: "Рабочая гипотеза, не догма"
    statement_ru: "Рассматривать МТС как предлагаемые новые основания, но не считать доказанными их независимость, универсальность или превосходство."
    falsifier_ru: "«всё выводится» без конструкций и теорем."
  - id: MTS-EA-05
    title_ru: "Направление реконструкции"
    statement_ru: "Для каждой существующей математической области искать `native конструкция → её правила → интерпретация традиционного объекта → доказанные законы → границы`."
    falsifier_ru: "простое переименование старых объектов принято за построение на МТС."
  - id: MTS-EA-06
    title_ru: "Без скрытого импорта"
    statement_ru: "Не вводить как первичные множества, типы, булевы значения, числа, графы, категории, графовые ID, host pointers, глобальную ориентацию или математическое `=`. Если внешняя метатеория используется в доказательстве, пометить её роль."
    falsifier_ru: "введённый host constructor назван native Link authority."
  - id: MTS-EA-07
    title_ru: "Точность реконструкции"
    statement_ru: "Явно определить исходный native носитель, роли, допустимые объекты, операции, денотацию и соответствие законам реконструируемой теории. Проверять, что кодирование не просто печатает формулы, а сохраняет нужную семантику."
    falsifier_ru: ""
  - id: MTS-EA-08
    title_ru: "Полнота и верность перевода"
    statement_ru: "Отдельно проверять: определённость на заявленной области, разрешение имён/контекста, сохранение и отражение отношений/равенства, обратимость если она заявлена, scope/контрпример; не требовать изоморфизма там, где достаточно более слабой интерпретации."
    falsifier_ru: ""
  - id: MTS-EA-09
    title_ru: "Контрмодель со сферой действия"
    statement_ru: "Для внешней контрмодели назвать **точный** набор аксиом и показать, удовлетворяет ли модель дополнительным native laws (identity/canonicalization/context и др.)."
    falsifier_ru: "`Foundation ⊭ P` без доказанной адекватности перевода названо `МТС ⊭ P`."
  - id: MTS-EA-10
    title_ru: "Независимая критика"
    statement_ru: "Проверять противоречия, недостающие посылки, недоопределённость, цикличность вывода, конструктивность, необоснованную универсальность и реальную ошибку в исходной МТС, даже если критика разрушает исходную исследовательскую гипотезу."
    falsifier_ru: ""
  - id: MTS-EA-11
    title_ru: "Роли уровней"
    statement_ru: "Отличать native ontology, selected/contextual roles, внешнюю модель, формальную нотацию, proof claim, кодек, тест, production semantics, научную проекцию. Нельзя выводить статус theorem из CI, а accepted law из текста рецензента."
    falsifier_ru: ""
  - id: MTS-EA-12
    title_ru: "Контекст и ориентация"
    statement_ru: "Не смешивать упорядоченные метаматематические `start/finish` как координаты выбранного представления с authority `START_K/END_K` выбранного контекста. При обвинении в противоречии показать точный уровень."
    falsifier_ru: ""
  - id: MTS-EA-13
    title_ru: "Контроль новизны"
    statement_ru: "Новизна исходных оснований / новизна теорем / реконструкция прежних теорий / сходство с магмами, графами, AFA — **разные** утверждения. Формальное сравнение разрешено, но оно не является условием права определять собственные основания."
    falsifier_ru: ""
  - id: MTS-EA-14
    title_ru: "Воспроизводимый finding"
    statement_ru: "Каждое замечание содержит точный SHA, source/paragraph, literal claim, native authority ref, premises, собственную проверку, admissibility external model, defect class, priority, minimal proposal, needed Author decision и статус replay."
    falsifier_ru: ""
  - id: MTS-EA-15
    title_ru: "Три независимых экспертизы"
    statement_ru: "Отдельно `FOUNDATIONS` (внутренняя непротиворечивость/адекватность), `RECONSTRUCTION` (получение прежних теорий на native МТС), `ADVERSARIAL` (попытки опровергнуть реальные native claims/translation). Вердикты не подменяют друг друга."
    falsifier_ru: ""
  - id: MTS-EA-16
    title_ru: "Никакого самопринятия"
    statement_ru: "Рецензент не меняет accepted v0.15, не вводит аксиомы, не закрывает М06/R40 одной суммарной оценкой, не мержит PR; все метатребования и промпты остаются `PROPOSED` до явного решения автора, review выполняется по exact artifact SHA."
    falsifier_ru: ""
prompts:
  - id: EA-P1
    title_ru: "независимый аудит оснований МТС"
    text_ru: "Вы — независимый исследователь математических оснований. Изучите **Метатеорию Связей** как предлагаемую самостоятельную метатеоретическую систему, исходя из её принятых Link-native положений, а не из заранее выбранных магм, графов, теории множеств или категорий. Установите exact нормативный owner и версию; отличайте принятую семантику, объяснительную редакцию, формальный внешний интерфейс и реализацию. Восстановите внутренние определения Link, структурного тождества, полюсных отношений, контекста, допустимых ролей, ANet и Γ по их явным источникам; укажите недоопределённое, не домысливая. Для каждого заявленного следствия проверьте посылки, область, доказательство/контрпример и evidence status. Внешние модели используйте лишь как инструменты метапроверки; если контрмодель удовлетворяет только слабому Foundation, вывод ограничивайте слабым Foundation, пока не доказана её допустимость по native МТС. Не считайте новизну/универсальность доказанными заранее и не защищайте МТС от настоящих опровержений. Дайте таблицу проверенных claims и findings с SHA, областями, аргументами и точными корректировками без изменения принятой семантики."
  - id: EA-P2
    title_ru: "реконструкция существующей математики на основаниях МТС"
    text_ru: "Вы — математик-конструктор, исследующий, **какие традиционные математические теории можно установить на основаниях Метатеории Связей**. Не начинайте с выбора теории множеств, графа или категории как определения Link. Сначала зафиксируйте Link-native примитивы и их нормы. Для выбранной математической области (например, отношения и множества; натуральные числа; функции; графы; алгебры) постройте средствами Link/ANet/Context явную структуру, укажите её carrier, различимость объектов, операции, определение истинности/допуска и точные правила. Затем сопоставьте с традиционными аксиомами и теоремами: покажите по одному или более законам native вывод, условия, контрслучаи и недостающие конструкции. Различайте (i) простую кодировку символов, (ii) семантическую интерпретацию, (iii) сохраняющий законы перевод, (iv) проверенную реконструкцию, (v) доказанную эквивалентность. Не заявляйте (iv)/(v), если имеются только (i)/(ii). Укажите, где внешние логические средства служат **метаязыком доказательства**, но не добавляют онтологию МТС. Верните таблицу `классический объект/закон → native конструкция → выведение → точная область → gap → evidence` и хотя бы один полностью разобранный пример либо честный статус невозможности при данном объёме источников."
  - id: EA-P3
    title_ru: "состязательная проверка и адекватность внешних моделей"
    text_ru: "Вы — независимый критический рецензент МТС. Ищите **реальные** противоречия, circular reasoning, ошибочные доказательства, скрытые предпосылки, ложные утверждения о достаточности Link-only конструкций и избыточные обещания восстановления математики. Начинайте с exact native claim и accepted source; не подменяйте его формулой из собственного Foundation, графовой онтологии или set-theoretic carrier. Для каждого контрпримера формализуйте, чему он удовлетворяет: минимальному Foundation, Foundation+E/A1/N/D, native contextual/identity laws, выбранной implementation или лишь внешнему model interface. Докажите или явно оставьте неизвестной адекватность `native → external → native` перевода. Когда тезис МТС действительно неверен, укажите P0/P1 и точную native несовместимость; когда лишь минимальный внешний интерфейс слишком слаб, маркируйте `EXTERNAL_INTERFACE_INSUFFICIENCY` и не объявляйте ошибку МТС. Проверяйте противоположную ошибку столь же строго: наличие native-терминов **не делает** сомнительное доказательство верным. Разделите результаты на proven/falsified/conditional/undetermined и перечислите обязательные исправления, не внося ни одного изменения в принятую v0.15 от имени автора."
finding_kinds:
  - "NATIVE_CONTRADICTION"
  - "NATIVE_DEFINITION_GAP"
  - "NATIVE_PROOF_GAP"
  - "EXTERNAL_MODEL_INADEQUACY"
  - "EXTERNAL_INTERFACE_INSUFFICIENCY"
  - "RECONSTRUCTION_GAP"
  - "ASSURANCE_SCOPE_GAP"
  - "READER_EXPOSITION_DEFECT"
  - "OPEN_COMPARISON"
  - "AUTHOR_DECISION_REQUIRED"
quality_criteria:
  - "Каждая из трёх инструкций самодостаточна, использует **«Метатеория Связей»**, не содержит обязательного вывода «МТС новая/универсальная/непротиворечивая»."
  - "Каждый реальный negative test содержит явный falsifier: слабая Foundation-контрмодель ошибочно объявлена опровержением всей МТС; внешняя категория выдана за native ontology; сквозной codec заявлен без обратного; CI принято за научную истину; обратный переход без proof; голословная ссылка на новизну; голословная защита от доказанного противоречия."
  - "Аудит выдаёт разные вердикты на `native contradiction` и `external-interface limitation`, **но** реальные дефекты научного текста и доказательств не замалчиваются."
  - "Traceability: промпт/версия/исходные SHA/inputs → findings → исправления в правильном source-owner → повторная проверка. Existing #1756 ProjectionModel, #2132 EXP, #2127 model; не создавать вторую parallel audit authority."
  - "Предложенные `MTS-EA-01…16` и `EA-P1…P3` требуют содержательного author review до политики repo-guard/CI и до применения как блокирующего публикационного gate."
