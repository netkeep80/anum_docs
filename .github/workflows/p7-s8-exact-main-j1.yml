name: P7-S8 exact main J1 diagnostic (temporary)
on:
  push:
    branches: [chore/p7-s8-exact-j1-diagnostic-20261108]
permissions:
  contents: read
jobs:
  exact-main-j1:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: External RepoGuard v6.0.1 on exact main
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate checkout --detach a8115f4161f33b83b77a41acb6e2caf973aa57d3
          test "$(git -C candidate rev-parse HEAD)" = "a8115f4161f33b83b77a41acb6e2caf973aa57d3"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "121119de9ae3a5583babefb34b3588dc25b98ee8"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base a8115f4161f33b83b77a41acb6e2caf973aa57d3 --head a8115f4161f33b83b77a41acb6e2caf973aa57d3 --format json > "$RUNNER_TEMP/j1.json" 2> "$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo "EXTERNAL_REPOGUARD=74db97791e6da8a75287164f0d0b41579108f114"
          echo "EXACT_MAIN=a8115f4161f33b83b77a41acb6e2caf973aa57d3"
          echo "EXACT_TREE=121119de9ae3a5583babefb34b3588dc25b98ee8"
          echo "COMPILER_EXIT=$rc"
          python3 - <<'PY'
          import json,collections,os
          o=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'j1.json')))
          unjustified=sorted(x['subject'].split(':',1)[1] for x in o.get('diagnostics',[]) if x.get('code')=='unjustified_resource')
          print("J1_ACTUAL",o.get('j1'))
          print("J2_ACTUAL",o.get('j2'))
          print("DIAGNOSTICS_TOTAL",len(o.get('diagnostics',[])))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          print("UNJUSTIFIED_ALL_JSON",json.dumps(unjustified,ensure_ascii=False,separators=(',',':')))
          groups=collections.Counter(p.split('/')[0] if '/' in p else '<root>' for p in unjustified)
          print("UNJUSTIFIED_GROUPS",json.dumps(dict(groups),sort_keys=True))
          PY
          test "$rc" -eq 1
