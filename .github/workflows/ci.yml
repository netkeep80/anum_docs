name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".gitkeep"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - ".gitkeep"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install TypeScript toolchain
        run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund

      - name: Typecheck, test and browser-check current MTS core
        run: npm --prefix ts run check

      - name: Install MTS visual browser companion dependencies
        run: npm ci --prefix packages/visual --ignore-scripts --no-audit --no-fund

      - name: Check renderer-neutral MTS visual package
        run: |
          ./ts/node_modules/.bin/tsc -p packages/visual/tsconfig.json
          node packages/visual/dist/test/model.test.js

      - name: Check Contract Observatory index
        run: |
          ./ts/node_modules/.bin/tsc -p web/contract-observatory/tsconfig.json
          node web/contract-observatory/dist/test/contract-index.test.js
          node web/contract-observatory/dist/test/site.test.js
          node web/contract-observatory/test/visual-consumer.test.mjs

  no-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reject Python sources or runtime dependencies
        shell: bash
        run: |
          if find . -path './.git' -prune -o -path './ts/node_modules' -prune -o -name '*.py' -print | grep -q .; then
            echo "::error::Python source remains after the TypeScript cutover"
            find . -path './.git' -prune -o -path './ts/node_modules' -prune -o -name '*.py' -print
            exit 1
          fi
          if grep -R -n -E 'python3|pytest|ruff' ts --exclude='*.map'; then
            echo "::error::Python runtime/tooling command remains in current TypeScript tree"
            exit 1
          fi
          echo "Python-free current tree confirmed."

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check documentation file sizes
        run: |
          echo "Checking documentation file sizes..."
          find docs/ -name "*.md" -type f 2>/dev/null | while read -r file; do
            line_count=$(wc -l < "$file")
            if [ "$line_count" -gt 2500 ]; then
              echo "::warning file=$file::Documentation file has $line_count lines (recommended max: 2500)"
            fi
          done
          echo "Documentation check complete."

  protect-readonly-files:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check protected files are not modified
        run: |
          PROTECTED_FILE="docs/research/Исходные мысли МТС.md"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "$PROTECTED_FILE"; then
            echo "::error::The file '$PROTECTED_FILE' is protected and may not be modified in a pull request. Only the repository owner may edit this file directly."
            exit 1
          fi
          echo "Protected file check passed."

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check root directory cleanliness
        shell: bash
        run: |
          echo "Checking root directory..."
          allowed='README.md|LICENSE|PORTFOLIO.md|repo-policy.json|.gitignore|.gitkeep'
          unexpected=0
          while IFS= read -r file; do
            if ! grep -Eq "^(${allowed})$" <<< "$file"; then
              echo "::error::Unexpected file in root: $file"
              unexpected=1
            fi
          done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          echo "Root directory check complete."

      - name: Check required directories exist
        run: |
          for dir in contracts cutover docs ts; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required directory missing: $dir"
              exit 1
            fi
          done
          echo "All required directories present."
