name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".gitkeep"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - ".gitkeep"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.changes.outputs.code }}
      docs-changed: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 2>/dev/null | grep -qE '\.(py|mtc|anum)$'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only HEAD~1 2>/dev/null | grep -qE '\.md$'; then
            echo "docs=true" >> $GITHUB_OUTPUT
          else
            echo "docs=false" >> $GITHUB_OUTPUT
          fi

  lint:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code-changed == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the lint ruleset. Ruff 0.16 changed default diagnostics and
          # made unchanged legacy files fail without any repository change.
          pip install ruff==0.15.22

      - name: Run Ruff linter
        run: |
          ruff check converters/ core/ tests/ --ignore E501,F401

  check-file-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python file line limits (1500 max)
        run: |
          EXIT_CODE=0
          for file in $(find . -name "*.py" -type f); do
            line_count=$(wc -l < "$file")
            if [ "$line_count" -gt 1500 ]; then
              echo "::error file=$file::File has $line_count lines (limit: 1500)"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

  test:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, check-file-limits]
    if: |
      always() &&
      !cancelled() &&
      (needs.detect-changes.outputs.code-changed == 'true' || github.event_name == 'push') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.check-file-limits.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests -v --tb=short

  validate-docs:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs-changed == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation file sizes
        run: |
          echo "Checking documentation file sizes..."
          find docs/ -name "*.md" -type f 2>/dev/null | while read -r file; do
            line_count=$(wc -l < "$file")
            if [ "$line_count" -gt 2500 ]; then
              echo "::warning file=$file::Documentation file has $line_count lines (recommended max: 2500)"
            fi
          done
          echo "Documentation check complete."

  protect-readonly-files:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected files are not modified
        run: |
          PROTECTED_FILE="docs/research/Исходные мысли МТС.md"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "$PROTECTED_FILE"; then
            echo "::error::The file '$PROTECTED_FILE' is protected and may not be modified in a pull request. Only the repository owner may edit this file directly."
            exit 1
          fi
          echo "Protected file check passed."

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check root directory cleanliness
        run: |
          echo "Checking root directory..."
          ALLOWED_FILES="README.md LICENSE .gitignore .gitkeep"
          for file in *; do
            if [ -f "$file" ]; then
              if ! echo "$ALLOWED_FILES" | grep -qw "$file"; then
                echo "::warning::Unexpected file in root: $file"
              fi
            fi
          done
          echo "Root directory check complete."

      - name: Check required directories exist
        run: |
          for dir in core converters docs tests; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required directory missing: $dir"
              exit 1
            fi
          done
          echo "All required directories present."
