name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".gitkeep"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - ".gitkeep"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect external proof diff
        id: external-proof-diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi
          echo "External proof diff: $BASE_SHA..$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(proofs/(lean4|coq|evidence)/|proofs/external-toolchains\.json$|proofs/external-proof-assurance\.json$|theorems/p0-v0\.14\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install TypeScript toolchain
        run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund

      - name: Typecheck, test and browser-check current MTS core
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm --prefix ts run check:current
          else
            npm --prefix ts run check:full
          fi

      - name: Compile pinned Lean external foundation
        if: steps.external-proof-diff.outputs.run == 'true'
        shell: bash
        run: |
          LEAN_URL="$(node -p "require('./proofs/external-toolchains.json').lean4.linuxReleaseUrl")"
          LEAN_SHA="$(node -p "require('./proofs/external-toolchains.json').lean4.linuxReleaseSha256")"
          rm -rf /tmp/mts-lean /tmp/mts-lean.tar.zst
          curl --fail --location --retry 3 --retry-delay 2 "$LEAN_URL" -o /tmp/mts-lean.tar.zst
          echo "$LEAN_SHA  /tmp/mts-lean.tar.zst" | sha256sum --check --strict
          mkdir -p /tmp/mts-lean
          tar --zstd -xf /tmp/mts-lean.tar.zst -C /tmp/mts-lean --strip-components=1
          /tmp/mts-lean/bin/lean --version
          /tmp/mts-lean/bin/lean proofs/lean4/MtsFoundation.lean
          cat proofs/lean4/MtsFoundation.lean proofs/lean4/MtsExplicitModel.lean > /tmp/MtsFoundationWithExplicitModel.lean
          /tmp/mts-lean/bin/lean /tmp/MtsFoundationWithExplicitModel.lean

          cp proofs/lean4/MtsFoundation.lean /tmp/MtsFoundationAssurance.lean
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = require("./proofs/external-proof-assurance.json");
          let source = fs.readFileSync("/tmp/MtsFoundationAssurance.lean", "utf8");
          for (const target of manifest.targets) {
            for (const symbol of target.lean4) {
              source += "\n#eval IO.println \"ASSURANCE_TARGET " + symbol + "\"\n";
              source += "#print axioms " + symbol + "\n";
            }
          }
          fs.writeFileSync("/tmp/MtsFoundationAssurance.lean", source);
          NODE
          /tmp/mts-lean/bin/lean /tmp/MtsFoundationAssurance.lean 2>&1 | tee /tmp/mts-lean-assurance.log
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = require("./proofs/external-proof-assurance.json");
          const log = fs.readFileSync("/tmp/mts-lean-assurance.log", "utf8");
          const allowed = new Set(manifest.allowedGlobalAxioms.lean4);
          const symbols = manifest.targets.flatMap((target) => target.lean4);
          if (log.includes("sorryAx")) {
            throw new Error("Lean assurance found sorryAx");
          }
          for (let index = 0; index < symbols.length; index += 1) {
            const symbol = symbols[index];
            const marker = "ASSURANCE_TARGET " + symbol;
            const start = log.indexOf(marker);
            if (start < 0) throw new Error("missing Lean assurance marker: " + symbol);
            const nextMarker =
              index + 1 < symbols.length
                ? log.indexOf("ASSURANCE_TARGET " + symbols[index + 1], start + marker.length)
                : log.length;
            const segment = log.slice(start, nextMarker < 0 ? log.length : nextMarker);
            if (segment.includes("does not depend on any axioms")) continue;
            const match = segment.match(/depends on axioms:\s*\[([^\]]*)\]/);
            if (!match) {
              throw new Error("unparsed Lean axiom report for " + symbol + "\n" + segment);
            }
            const axioms = match[1]
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const unexpected = axioms.filter((axiom) => !allowed.has(axiom));
            if (unexpected.length > 0) {
              throw new Error("unexpected Lean axioms for " + symbol + ": " + unexpected.join(", "));
            }
          }
          console.log("KERNEL_ASSUMPTIONS_LEAN=CHECKED targets=" + symbols.length);
          NODE

      - name: Compile pinned Rocq external foundation
        if: steps.external-proof-diff.outputs.run == 'true'
        shell: bash
        run: |
          ROCQ_IMAGE="$(node -p "require('./proofs/external-toolchains.json').rocq.dockerImage")"
          EXPECTED_VCS="$(node -p "require('./proofs/external-toolchains.json').rocq.imageVcsRef")"
          docker pull "$ROCQ_IMAGE"
          ACTUAL_VCS="$(docker inspect --format '{{ index .Config.Labels "org.label-schema.vcs-ref" }}' "$ROCQ_IMAGE")"
          test "$ACTUAL_VCS" = "$EXPECTED_VCS"
          docker run --rm "$ROCQ_IMAGE" rocq -v
          docker run --rm \
            -v "$PWD/proofs/coq:/input:ro" \
            "$ROCQ_IMAGE" \
            sh -lc 'cp /input/MtsFoundation.v /tmp/MtsFoundation.v && cd /tmp && rocq compile MtsFoundation.v'

          docker run --rm \
            -v "$PWD/proofs/coq:/input:ro" \
            "$ROCQ_IMAGE" \
            sh -lc 'cat /input/MtsFoundation.v /input/MtsExplicitModel.v > /tmp/MtsFoundationWithExplicitModel.v && cd /tmp && rocq compile MtsFoundationWithExplicitModel.v'

          rm -rf /tmp/mts-coq-assurance
          mkdir -p /tmp/mts-coq-assurance
          cp proofs/coq/MtsFoundation.v /tmp/mts-coq-assurance/MtsFoundationAssurance.v
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = require("./proofs/external-proof-assurance.json");
          const path = "/tmp/mts-coq-assurance/MtsFoundationAssurance.v";
          let source = fs.readFileSync(path, "utf8");
          for (const target of manifest.targets) {
            for (const symbol of target.rocq) {
              source += "\nGoal True. idtac \"ASSURANCE_TARGET " + symbol + "\". exact I. Qed.\n";
              source += "Print Assumptions " + symbol + ".\n";
            }
          }
          fs.writeFileSync(path, source);
          NODE
          docker run --rm \
            -v "/tmp/mts-coq-assurance:/input:ro" \
            "$ROCQ_IMAGE" \
            sh -lc 'cp /input/MtsFoundationAssurance.v /tmp/MtsFoundationAssurance.v && cd /tmp && rocq compile MtsFoundationAssurance.v' \
            2>&1 | tee /tmp/mts-coq-assurance.log
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = require("./proofs/external-proof-assurance.json");
          const log = fs.readFileSync("/tmp/mts-coq-assurance.log", "utf8");
          const allowed = new Set(manifest.allowedGlobalAxioms.rocq);
          const symbols = manifest.targets.flatMap((target) => target.rocq);
          for (let index = 0; index < symbols.length; index += 1) {
            const symbol = symbols[index];
            const marker = "ASSURANCE_TARGET " + symbol;
            const start = log.indexOf(marker);
            if (start < 0) throw new Error("missing Rocq assurance marker: " + symbol);
            const nextMarker =
              index + 1 < symbols.length
                ? log.indexOf("ASSURANCE_TARGET " + symbols[index + 1], start + marker.length)
                : log.length;
            const segment = log.slice(start, nextMarker < 0 ? log.length : nextMarker);
            if (segment.includes("Closed under the global context")) continue;
            const axiomBlock = segment.match(/Axioms?:\s*([\s\S]*)/);
            if (!axiomBlock) {
              throw new Error("unparsed Rocq assumption report for " + symbol + "\n" + segment);
            }
            const unexpected = axiomBlock[1]
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.includes(":"))
              .map((line) => line.split(":")[0].trim())
              .filter((name) => name.length > 0 && !allowed.has(name));
            if (unexpected.length > 0) {
              throw new Error("unexpected Rocq axioms for " + symbol + ": " + unexpected.join(", "));
            }
          }
          console.log("KERNEL_ASSUMPTIONS_ROCQ=CHECKED targets=" + symbols.length);
          NODE

      - name: Install MTS visual browser companion dependencies
        run: npm ci --prefix packages/visual --ignore-scripts --no-audit --no-fund

      - name: Check renderer-neutral MTS visual package
        run: |
          ./ts/node_modules/.bin/tsc -p packages/visual/tsconfig.json
          node packages/visual/dist/test/model.test.js

      - name: Check Contract Observatory index
        run: |
          ./ts/node_modules/.bin/tsc -p web/contract-observatory/tsconfig.json
          node web/contract-observatory/dist/test/contract-index.test.js
          node web/contract-observatory/dist/test/site.test.js


  protect-readonly-files:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check protected files are not modified
        run: |
          PROTECTED_FILE="docs/research/Исходные мысли МТС.md"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "$PROTECTED_FILE"; then
            echo "::error::The file '$PROTECTED_FILE' is protected and may not be modified in a pull request. Only the repository owner may edit this file directly."
            exit 1
          fi
          echo "Protected file check passed."

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check root directory cleanliness
        shell: bash
        run: |
          echo "Checking root directory..."
          allowed='README.md|LICENSE|PORTFOLIO.md|repo-policy.json|.gitignore|.gitkeep'
          unexpected=0
          while IFS= read -r file; do
            if ! grep -Eq "^(${allowed})$" <<< "$file"; then
              echo "::error::Unexpected file in root: $file"
              unexpected=1
            fi
          done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          echo "Root directory check complete."

      - name: Check required directories exist
        run: |
          for dir in contracts cutover docs ts; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required directory missing: $dir"
              exit 1
            fi
          done
          echo "All required directories present."
