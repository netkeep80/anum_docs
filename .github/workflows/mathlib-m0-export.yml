name: Mathlib M0 pinned export

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Exact anum_docs research ref containing the M0 exporter and pin
        required: true
        default: research/969-mathlib-m0
        type: string
  pull_request:
    paths:
      - .github/workflows/mathlib-m0-export.yml
      - research/mathlib-m0/lean/**
      - research/mathlib-m0/upstream-pin.json
      - research/mathlib-m0/corpus-seed.json
      - research/mathlib-m0/corpus-reproduction.json
      - ts/src/mathlib-m0-transport.ts
      - ts/src/mathlib-m0-external-boundary.ts
      - ts/package.json
      - ts/package-lock.json
      - ts/tsconfig.json

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact anum_docs research ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.research_ref || github.event.pull_request.head.sha }}
          path: anum_docs-research
          persist-credentials: false

      - name: Resolve immutable upstream pin
        id: pin
        shell: bash
        env:
          RESEARCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.research_ref || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$RESEARCH_REF"
          pin_path="anum_docs-research/research/mathlib-m0/upstream-pin.json"
          test -f "$pin_path"
          mathlib_sha="$(jq -er '.mathlibSha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$pin_path")"
          lean_toolchain="$(jq -er '.leanToolchain | select(type == "string" and length > 0)' "$pin_path")"
          research_sha="$(git -C anum_docs-research rev-parse HEAD)"
          printf 'research_ref=%s\n' "$RESEARCH_REF" >> "$GITHUB_OUTPUT"
          printf 'mathlib_sha=%s\n' "$mathlib_sha" >> "$GITHUB_OUTPUT"
          printf 'lean_toolchain=%s\n' "$lean_toolchain" >> "$GITHUB_OUTPUT"
          printf 'research_sha=%s\n' "$research_sha" >> "$GITHUB_OUTPUT"
          printf 'Research ref %s resolved to %s\n' "$RESEARCH_REF" "$research_sha"

      - name: Checkout exact mathlib revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.pin.outputs.mathlib_sha }}
          path: mathlib
          persist-credentials: false

      - name: Verify upstream revision and Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C mathlib rev-parse HEAD)" = "${{ steps.pin.outputs.mathlib_sha }}"
          actual_toolchain="$(tr -d '\r\n' < mathlib/lean-toolchain)"
          test "$actual_toolchain" = "${{ steps.pin.outputs.lean_toolchain }}"

      - name: Install exact Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: mathlib
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Materialize pinned mathlib cache
        shell: bash
        working-directory: mathlib
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Run post-elaboration exporter twice and verify determinism
        shell: bash
        working-directory: mathlib
        env:
          RESEARCH_REF: ${{ steps.pin.outputs.research_ref }}
          RESEARCH_SHA: ${{ steps.pin.outputs.research_sha }}
          MATHLIB_SHA: ${{ steps.pin.outputs.mathlib_sha }}
          LEAN_TOOLCHAIN: ${{ steps.pin.outputs.lean_toolchain }}
        run: |
          set -euo pipefail
          exporter="$GITHUB_WORKSPACE/anum_docs-research/research/mathlib-m0/lean/Export.lean"
          artifact_dir="$GITHUB_WORKSPACE/mathlib-m0-artifacts"
          test -f "$exporter"
          mkdir -p "$artifact_dir"
          for pass in 1 2; do
            MATHLIB_M0_OUTPUT="$artifact_dir/corpus-export-$pass.json" \
            MATHLIB_M0_BOUNDARY_OUTPUT="$artifact_dir/external-boundary-$pass.json" \
            MATHLIB_M0_MATHLIB_SHA="$MATHLIB_SHA" \
            MATHLIB_M0_LEAN_TOOLCHAIN="$LEAN_TOOLCHAIN" \
              lake env lean "$exporter"
            test -s "$artifact_dir/corpus-export-$pass.json"
            test -s "$artifact_dir/external-boundary-$pass.json"
          done
          cmp "$artifact_dir/corpus-export-1.json" "$artifact_dir/corpus-export-2.json"
          cmp "$artifact_dir/external-boundary-1.json" "$artifact_dir/external-boundary-2.json"
          jq -e --arg sha "$MATHLIB_SHA" --arg toolchain "$LEAN_TOOLCHAIN" '
            .upstream.mathlibSha == $sha and
            .upstream.leanToolchain == $toolchain and
            (.declarations | type == "array") and
            ((.declarations | length) >= 10) and
            ((.declarations | length) <= 100)
          ' "$artifact_dir/corpus-export-1.json" >/dev/null
          mv "$artifact_dir/corpus-export-1.json" "$artifact_dir/corpus-export.json"
          rm "$artifact_dir/corpus-export-2.json"
          mv "$artifact_dir/external-boundary-1.json" "$artifact_dir/external-boundary.json"
          rm "$artifact_dir/external-boundary-2.json"
          jq -n \
            --arg researchRef "$RESEARCH_REF" \
            --arg researchSha "$RESEARCH_SHA" \
            --arg mathlibSha "$MATHLIB_SHA" \
            --arg leanToolchain "$LEAN_TOOLCHAIN" \
            '{researchRef:$researchRef,researchSha:$researchSha,mathlibSha:$mathlibSha,leanToolchain:$leanToolchain,trust:"untrusted-export-evidence"}' \
            > "$artifact_dir/run-metadata.json"
          test -z "$(git -C "$GITHUB_WORKSPACE/anum_docs-research" status --porcelain)"

      - name: Validate live export through TypeScript transport contract
        shell: bash
        working-directory: anum_docs-research/ts
        env:
          MATHLIB_M0_LIVE_EXPORT: ${{ github.workspace }}/mathlib-m0-artifacts/corpus-export.json
          MATHLIB_M0_LIVE_BOUNDARY: ${{ github.workspace }}/mathlib-m0-artifacts/external-boundary.json
          MATHLIB_SHA: ${{ steps.pin.outputs.mathlib_sha }}
          LEAN_TOOLCHAIN: ${{ steps.pin.outputs.lean_toolchain }}
        run: |
          set -euo pipefail
          npm ci
          npm run build --silent
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseMathlibM0ExternalBoundary } from "./dist/src/mathlib-m0-external-boundary.js";
          import {
            computeMathlibM0TransportBundleDigest,
            parseMathlibM0TransportBundle,
          } from "./dist/src/mathlib-m0-transport.js";

          const exportPath = process.env.MATHLIB_M0_LIVE_EXPORT;
          const boundaryPath = process.env.MATHLIB_M0_LIVE_BOUNDARY;
          if (!exportPath) throw new Error("MATHLIB_M0_LIVE_EXPORT is required");
          if (!boundaryPath) throw new Error("MATHLIB_M0_LIVE_BOUNDARY is required");

          const input = JSON.parse(readFileSync(exportPath, "utf8"));
          const boundaryInput = JSON.parse(readFileSync(boundaryPath, "utf8"));
          const bundle = parseMathlibM0TransportBundle(input);
          const boundary = parseMathlibM0ExternalBoundary(boundaryInput);

          if (bundle.upstream.mathlibSha !== process.env.MATHLIB_SHA) {
            throw new Error("live transport mathlib SHA mismatch");
          }
          if (bundle.upstream.leanToolchain !== process.env.LEAN_TOOLCHAIN) {
            throw new Error("live transport Lean toolchain mismatch");
          }
          if (boundary.upstream.mathlibSha !== process.env.MATHLIB_SHA) {
            throw new Error("live boundary mathlib SHA mismatch");
          }
          if (boundary.upstream.leanToolchain !== process.env.LEAN_TOOLCHAIN) {
            throw new Error("live boundary Lean toolchain mismatch");
          }
          if (
            boundary.upstream.mathlibSha !== bundle.upstream.mathlibSha ||
            boundary.upstream.leanToolchain !== bundle.upstream.leanToolchain
          ) {
            throw new Error("live transport/boundary upstream mismatch");
          }
          if (bundle.declarations.length < 10 || bundle.declarations.length > 100) {
            throw new Error(`live transport corpus size out of range: ${bundle.declarations.length}`);
          }

          const expectedBoundary = new Map();
          for (const declaration of bundle.declarations) {
            for (const externalName of declaration.externalDependencies) {
              let references = expectedBoundary.get(externalName);
              if (!references) {
                references = new Set();
                expectedBoundary.set(externalName, references);
              }
              references.add(declaration.qualifiedName);
            }
          }
          const expectedBoundaryIdentity = [...expectedBoundary.entries()]
            .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0)
            .map(([qualifiedName, references]) => ({
              qualifiedName,
              referencedBy: [...references].sort(),
            }));
          const actualBoundaryIdentity = boundary.entries.map((entry) => ({
            qualifiedName: entry.qualifiedName,
            referencedBy: [...entry.referencedBy],
          }));
          if (JSON.stringify(actualBoundaryIdentity) !== JSON.stringify(expectedBoundaryIdentity)) {
            throw new Error("live boundary identity does not exactly match transport external references");
          }

          const digest = await computeMathlibM0TransportBundleDigest(bundle);
          console.log(
            `validated ${bundle.declarations.length} live declarations and ${boundary.entries.length} external boundary entries; ${digest.scheme}=${digest.value}`,
          );
          NODE

      - name: Upload untrusted export evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mathlib-m0-export-${{ github.run_id }}
          path: mathlib-m0-artifacts/
          if-no-files-found: error
          retention-days: 14
