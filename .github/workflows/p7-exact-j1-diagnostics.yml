name: P7 external exact J1 delta (temporary)
on:
  push:
    branches: [feat/p7-bounded-project-ownership-20261108]
permissions:
  contents: read
jobs:
  exact-j1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Exact identities and external compiler J1
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C candidate rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          echo "J1_HEAD=$sha"
          echo "J1_TREE=$(git -C candidate rev-parse HEAD^{tree})"
          test "$(git -C candidate/vendor/repo-guard rev-parse HEAD)" = "b8aaf22b11d8f045bc47b78f0a2a0808ae208b71"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/p7-j1"
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base "$sha" --head "$sha" --format json > "$RUNNER_TEMP/p7-j1/positive.json" 2> "$RUNNER_TEMP/p7-j1/stderr.txt"
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.j1 | (.tracked|type=="number") and (.justified|type=="number")' "$RUNNER_TEMP/p7-j1/positive.json" >/dev/null
          jq -r '"P7_EXACT_J1=\(.j1.tracked)/\(.j1.justified)/\(.j1.tracked - .j1.justified) J2=\(.j2.rooted) ERRORS=\(.diagnostics|length)"' "$RUNNER_TEMP/p7-j1/positive.json"
      - name: Negative — deleted actual public API source rejected
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.email 'p7-negative@invalid.example'
          git -C candidate config user.name 'P7 negative only'
          sed -i 's#path: ts/src/anum.ts#path: ts/src/public-api-absent.ts#' candidate/requirements/project/MTS-PROJECT-PACKAGE-01.rg.yaml
          grep -q 'path: ts/src/public-api-absent.ts' candidate/requirements/project/MTS-PROJECT-PACKAGE-01.rg.yaml
          git -C candidate add requirements/project/MTS-PROJECT-PACKAGE-01.rg.yaml
          git -C candidate commit -m "NEGATIVE_ONLY: missing public export module"
          sha="$(git -C candidate rev-parse HEAD)"
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base "$sha" --head "$sha" --format json > "$RUNNER_TEMP/p7-j1/negative.json" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q 'missing_resource_target' "$RUNNER_TEMP/p7-j1/negative.json"
          echo "P7_NEGATIVE_PUBLIC_SOURCE_MISSING=REJECTED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-external-exact-j1
          path: ${{ runner.temp }}/p7-j1/
          retention-days: 3
