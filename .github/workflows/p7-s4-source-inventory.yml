name: P7-S4 exact J1 and tooling source closure (temporary)
on:
  push:
    branches: [feat/p7-tooling-closure-s4-20261108]
permissions:
  contents: read
jobs:
  exact-j1-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact accepted main identity and pinned tools
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate checkout --detach 99adebc6dded184f747791431e3a1fee9e88c9c0
          test "$(git -C candidate rev-parse HEAD)" = "99adebc6dded184f747791431e3a1fee9e88c9c0"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "0d1aef86bf2bb3352ea56b1fb9e542c3a8362e08"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate/ts --ignore-scripts --no-audit --no-fund
      - name: Measure exact current J1 and inspect failing resource categories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p7-s4"
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base "99adebc6dded184f747791431e3a1fee9e88c9c0" --head "99adebc6dded184f747791431e3a1fee9e88c9c0" --format json > "$RUNNER_TEMP/p7-s4/rg.json" 2> "$RUNNER_TEMP/p7-s4/stderr.txt"
          rc=$?
          set -e
          test "$rc" -eq 1
          echo "EXACT_MAIN=99adebc6dded184f747791431e3a1fee9e88c9c0"
          jq -r '"ACTUAL_J1=\(.j1.tracked)/\(.j1.justified)/\(.j1.tracked-.j1.justified) J2=\(.j2.rooted) DIAGNOSTICS=\(.diagnostics|length)"' "$RUNNER_TEMP/p7-s4/rg.json"
          python3 - <<'PY'
          import json,os,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"p7-s4","rg.json")))
          ds=o.get("diagnostics",[])
          print("FIRST_DIAGNOSTICS",json.dumps(ds[:5],ensure_ascii=False)[:3000])
          summary=collections.Counter(str(x.get("code","unknown")) for x in ds if isinstance(x,dict))
          print("DIAGNOSTIC_CODES",json.dumps(summary,ensure_ascii=False))
          PY
      - name: Source-derived import closure of existing accepted project tooling roots
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import {createRequire} from "node:module";
          const root=path.resolve("candidate");
          const req=createRequire(path.resolve(root,"ts/package.json"));
          const ts=req("typescript"), yaml=req("yaml");
          const base=path.resolve(root,"ts/src");
          const rel=p=>path.relative(root,p).replaceAll("\\","/");
          const owned=new Set();
          for(const filename of fs.readdirSync(path.resolve(root,"requirements/project"))){
            if(!filename.endsWith(".rg.yaml"))continue;
            const doc=yaml.parse(fs.readFileSync(path.resolve(root,"requirements/project",filename),"utf8"));
            for(const r of doc.relations||[])if(r.target?.kind==="artifact")owned.add(r.target.path);
          }
          const roots=[
            ["CI","ts/src/tooling/test-runner.ts"],
            ["CI","ts/src/tooling/test-tier.ts"],
            ["LINEAGE","ts/src/tooling/mts-compiler.ts"],
            ["LINEAGE","ts/src/tooling/v015-documentation-acceptance.ts"],
            ["PUBLICATION","ts/src/tooling/mts-reader-coverage.ts"]
          ];
          const graph=new Map();
          function edges(file){
            if(graph.has(file))return graph.get(file);
            const abs=path.resolve(root,file);
            const source=ts.createSourceFile(file,fs.readFileSync(abs,"utf8"),ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
            const es=new Set();
            const add=spec=>{
              if(!spec.startsWith(".")||!spec.endsWith(".js"))return;
              const target=path.resolve(path.dirname(abs),spec.slice(0,-3)+".ts");
              if(target.startsWith(base+path.sep)&&fs.existsSync(target))es.add(rel(target));
            };
            const visit=node=>{
              if((ts.isImportDeclaration(node)||ts.isExportDeclaration(node))&&node.moduleSpecifier&&ts.isStringLiteral(node.moduleSpecifier))add(node.moduleSpecifier.text);
              if(ts.isImportTypeNode(node)&&ts.isLiteralTypeNode(node.argument)&&ts.isStringLiteral(node.argument.literal))add(node.argument.literal.text);
              if(ts.isCallExpression(node)&&node.expression.kind===ts.SyntaxKind.ImportKeyword&&node.arguments[0]&&ts.isStringLiteral(node.arguments[0]))add(node.arguments[0].text);
              ts.forEachChild(node,visit);
            };
            visit(source);const out=[...es].sort();graph.set(file,out);return out;
          }
          const candidates=new Map();
          for(const [owner,start] of roots){
            if(!owned.has(start))throw Error("unowned tooling source "+start);
            const seen=new Set(),todo=[start];
            while(todo.length){
              const f=todo.pop();
              if(seen.has(f))continue;seen.add(f);
              for(const dep of edges(f)){
                if(!owned.has(dep)&&!candidates.has(dep))candidates.set(dep,{owner,from:f});
                todo.push(dep);
              }
            }
            console.log("TOOLING_GRAPH",owner,start,"reachable",seen.size,"unownedNow",[...seen].filter(x=>!owned.has(x)).length);
          }
          const pkg=JSON.parse(fs.readFileSync(path.resolve(root,"ts/package.json"),"utf8"));
          const publicTooling=[];
          for(const [key,obj] of Object.entries(pkg.exports)){
            if(key==="." )continue;
            const js=typeof obj==="string"?obj:obj.default;
            if(js?.startsWith("./dist/src/tooling/")&&js.endsWith(".js")){
              publicTooling.push({key,path:js.replace("./dist/src/","ts/src/").replace(/\.js$/,".ts")});
            }
          }
          for(const [bin,js] of Object.entries(pkg.bin||{})){
            if(js?.startsWith("./dist/src/tooling/")&&js.endsWith(".js"))
              publicTooling.push({key:"bin:"+bin,path:js.replace("./dist/src/","ts/src/").replace(/\.js$/,".ts")});
          }
          console.log("PUBLIC_TOOLING_ENTRYPOINTS",JSON.stringify(publicTooling));
          console.log("TOOLING_UNOWNED_IMPORTS",candidates.size);
          for(const [file,{owner,from}] of [...candidates.entries()].sort((a,b)=>a[0].localeCompare(b[0])))console.log("TOOLING_REQUIRES",owner,file,"VIA",from);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-s4-main-j1
          path: ${{ runner.temp }}/p7-s4/
          retention-days: 3
