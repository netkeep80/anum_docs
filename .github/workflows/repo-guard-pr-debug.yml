name: Repo-guard PR debug

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout pinned repo-guard
        uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: a2cb2ae98596c5b673eed2548abef40edcf4bdce
          path: .repo-guard

      - name: Install repo-guard
        run: npm install --prefix .repo-guard --omit=dev --silent

      - name: Print structured PR report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node .repo-guard/dist/repo-guard.mjs             --repo-root "$GITHUB_WORKSPACE"             --enforcement blocking             check-pr             --format json > "$RUNNER_TEMP/repo-guard-pr.json"
          status=$?
          cat "$RUNNER_TEMP/repo-guard-pr.json"
          exit "$status"
