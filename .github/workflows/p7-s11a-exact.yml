name: P7-S11-A exact external v6 J1 CURRENT FULL temporary
on:
  push:
    branches: [chore/p7-s11a-exact-20261108]
permissions:
  contents: read
jobs:
  s11a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Exact S11-A external J1/J2 and CURRENT/FULL
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate checkout --detach 07e820624b6603a979181f411ac35ffb82f5321a
          test "$(git -C candidate rev-parse HEAD)" = 07e820624b6603a979181f411ac35ffb82f5321a
          test "$(git -C candidate rev-parse HEAD^{tree})" = 8b6979cad599e70863e761a62b2e144b63b42612
          test "$(git -C repoguard rev-parse HEAD)" = 74db97791e6da8a75287164f0d0b41579108f114
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 07e820624b6603a979181f411ac35ffb82f5321a --head 07e820624b6603a979181f411ac35ffb82f5321a --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo "EXACT_HEAD=07e820624b6603a979181f411ac35ffb82f5321a"
          echo "EXACT_TREE=8b6979cad599e70863e761a62b2e144b63b42612"
          echo "COMPILER_EXIT=$rc"
          python3 - <<'PY'
          import json,os,collections
          o=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'j1.json')))
          unjustified=sorted(x['subject'].split(':',1)[1] for x in o.get('diagnostics',[]) if x.get('code')=='unjustified_resource')
          print("J1_ACTUAL",o.get('j1'))
          print("J2_ACTUAL",o.get('j2'))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(x.split('/')[0] for x in unjustified)))
          PY
          test "$rc" -eq 1
          npm ci --prefix candidate/vendor/repo-guard --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate/ts --ignore-scripts --no-audit --no-fund
          (cd candidate/ts && npm run check:current)
          (cd candidate/ts && npm run check:full)
