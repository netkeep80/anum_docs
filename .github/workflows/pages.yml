name: Contract Observatory Pages

on:
  pull_request:
    branches: ["**"]
    paths:
      - "contracts/**"
      - "cutover/**"
      - "requirements/**"
      - "traceability/**"
      # v0.15 research stays outside current-tier authority but must run the full semantic suite.
      - "ts/src/v015-*.ts"
      - "ts/test/research-v015-*.test.ts"
      - "ts/src/tooling/mts-compiler.ts"
      - "ts/src/tooling/markdown-section-adapter.ts"
      - "vendor/repo-guard"
      - ".gitmodules"
      - "ts/src/tooling/docs-sync.ts"
      - "ts/src/tooling/theorem-projection-contract.ts"
      - "web/contract-observatory/**"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "cutover/**"
      - "requirements/**"
      - "traceability/**"
      # v0.15 research stays outside current-tier authority but must run the full semantic suite.
      - "ts/src/v015-*.ts"
      - "ts/test/research-v015-*.test.ts"
      - "ts/src/tooling/mts-compiler.ts"
      - "ts/src/tooling/markdown-section-adapter.ts"
      - "vendor/repo-guard"
      - ".gitmodules"
      - "ts/src/tooling/docs-sync.ts"
      - "ts/src/tooling/theorem-projection-contract.ts"
      - "web/contract-observatory/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-observatory-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned RepoGuard 6.0.0 runtime
        run: |
          test "$(git -C vendor/repo-guard rev-parse HEAD)" = "b8aaf22b11d8f045bc47b78f0a2a0808ae208b71"
          npm ci --prefix vendor/repo-guard --ignore-scripts --no-audit --no-fund --omit=dev

      - name: Install TypeScript toolchain
        run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund

      - name: Verify MTS semantic tests
        run: npm --prefix ts test

      - name: Verify compiled Markdown is current
        run: npm --prefix ts run docs:check

      - name: Verify documentation idempotence and coverage
        run: |
          npm --prefix ts run docs:sync
          git diff --exit-code -- README.md PORTFOLIO.md docs
          npm --prefix ts run docs:sync
          git diff --exit-code -- README.md PORTFOLIO.md docs
          npm --prefix ts run docs:coverage

      - name: Compile Contract Observatory
        run: ./ts/node_modules/.bin/tsc -p web/contract-observatory/tsconfig.json

      - name: Verify Contract Observatory evidence and static site
        run: |
          node web/contract-observatory/dist/test/contract-index.test.js
          node web/contract-observatory/dist/test/site.test.js

      - name: Materialize Pages artifact
        run: |
          node web/contract-observatory/dist/src/build-site.js . _site
          test -s _site/index.html
          test -f _site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy Contract Observatory
        id: deployment
        uses: actions/deploy-pages@v5
