name: C3.10 one-shot repo-guard policy migration

on:
  push:
    branches:
      - c3.10/1183-repo-guard-external-proof

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c3.10/1183-repo-guard-external-proof
          fetch-depth: 1

      - name: Migrate retired repo-guard policy surfaces
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'repo-policy.json';
          const candidate = 'f36a417a7c3a72a99c6e8c824194f96471218f73';
          const policy = JSON.parse(fs.readFileSync(path, 'utf8'));

          delete policy.integration;
          policy.evidence_bindings = (policy.evidence_bindings ?? [])
            .filter((binding) => binding.kind !== 'workflow_path_coverage');

          policy.document_relations ??= { documents: {}, rules: [] };
          policy.document_relations.documents['repo-guard-workflow'] = {
            path: '.github/workflows/repo-guard.yml',
            format: 'yaml',
          };

          const ids = new Set(policy.document_relations.rules.map((rule) => rule.id));
          const workflowRules = [
            {
              id: 'repo-guard-workflow-action-pin',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/jobs/policy-check/steps/1/uses', type: 'string' },
              value: `netkeep80/repo-guard@${candidate}`,
            },
            {
              id: 'repo-guard-workflow-mode',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/jobs/policy-check/steps/1/with/mode', type: 'string' },
              value: 'check-pr',
            },
            {
              id: 'repo-guard-workflow-enforcement',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/jobs/policy-check/steps/1/with/enforcement', type: 'string' },
              value: 'blocking',
            },
            {
              id: 'repo-guard-workflow-permission-contents',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/permissions/contents', type: 'string' },
              value: 'read',
            },
            {
              id: 'repo-guard-workflow-permission-issues',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/permissions/issues', type: 'string' },
              value: 'read',
            },
            {
              id: 'repo-guard-workflow-permission-pull-requests',
              kind: 'scalar_equals_literal',
              source: { document: 'repo-guard-workflow', pointer: '/permissions/pull-requests', type: 'string' },
              value: 'read',
            },
          ];
          for (const rule of workflowRules) {
            if (!ids.has(rule.id)) policy.document_relations.rules.push(rule);
          }

          fs.writeFileSync(path, `${JSON.stringify(policy)}\n`);
          NODE

          rm .github/workflows/c3-10-policy-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo-policy.json .github/workflows/c3-10-policy-migration.yml
          git commit -m "refactor(repo-guard): migrate anum_docs to final policy model"
          git push origin HEAD:c3.10/1183-repo-guard-external-proof
