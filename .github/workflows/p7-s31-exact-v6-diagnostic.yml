name: P7-S31 exact pinned v6 J1 J2 (TEMPORARY DO NOT MERGE)
on:
  push:
    branches: [diagnostics/p7-s31-exact-v6-20261110]
    paths: [".github/workflows/p7-s31-exact-v6-diagnostic.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact S31 J1 J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s31-exact-w6-roles-association-20261110
          git -C candidate checkout --detach 29a57f00571ec7c9bcfdf710a7a0d115fc3ff9b7
          test "$(git -C candidate rev-parse HEAD)" = "29a57f00571ec7c9bcfdf710a7a0d115fc3ff9b7"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "a4499b4e9dfa6036c65ba34733021d27710e80fb"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=29a57f00571ec7c9bcfdf710a7a0d115fc3ff9b7
          echo EXACT_TREE=a4499b4e9dfa6036c65ba34733021d27710e80fb
          echo EXACT_GUARD=74db97791e6da8a75287164f0d0b41579108f114
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 29a57f00571ec7c9bcfdf710a7a0d115fc3ff9b7 --head 29a57f00571ec7c9bcfdf710a7a0d115fc3ff9b7 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          target={"ts/src/v015-formal-roles.ts","ts/src/v015-direct-association.ts"}
          print("S31_CURRENT_W6_SOURCES_STILL_UNJUSTIFIED",sorted(target.intersection(paths)))
          assert o["j1"]["tracked"]==650 and o["j1"]["justified"]==554 and o["j1"]["head"] is False,"unexpected J1"
          assert len(paths)==96 and not target.intersection(paths),"unexpected S31 unjustified"
          assert o["j2"]["rooted"]==54 and o["j2"]["head"] is True,"unexpected J2"
          print("P7_S31_TWO_REAL_W6_SOURCE_READS=PASS")
          for path in paths: print("J1_UNJUSTIFIED_PATH",path)
          PY
          test "$rc" -eq 1
