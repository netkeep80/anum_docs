name: P7-S34 BULK pinned exact v6 J1 J2 diagnostic (TEMPORARY DO NOT MERGE)
on:
  push:
    branches: [diagnostics/p7-s34-bulk-exact-v6-20261110]
    paths: [".github/workflows/p7-s34-bulk-exact-v6-diagnostic.yml"]
permissions: {contents: read, issues: read, pull-requests: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify exact S34 BULK J1 J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s34-bulk-current-conformance-and-source-closure-20261110
          git -C candidate checkout --detach fe0961d24369e09a68ffc49a1841ddc8a67cb1f4
          test "$(git -C candidate rev-parse HEAD)" = "fe0961d24369e09a68ffc49a1841ddc8a67cb1f4"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "9120f3392a32d31668963252ec3356ac5e13c4e9"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=fe0961d24369e09a68ffc49a1841ddc8a67cb1f4
          echo EXACT_TREE=9120f3392a32d31668963252ec3356ac5e13c4e9
          echo EXACT_GUARD=74db97791e6da8a75287164f0d0b41579108f114
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base fe0961d24369e09a68ffc49a1841ddc8a67cb1f4 --head fe0961d24369e09a68ffc49a1841ddc8a67cb1f4 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import json,os
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          unjustified=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          assert o["j1"]["tracked"]==650 and o["j1"]["justified"]==634 and o["j1"]["head"] is False,"unexpected J1"
          assert len(unjustified)==16,"unexpected S34 remaining J1 set"
          assert o["j2"]["rooted"]==54 and o["j2"]["head"] is True,"unexpected J2"
          print("P7_S34_EXACT_BULK_78=PASS")
          for path in unjustified: print("J1_UNJUSTIFIED_PATH",path)
          PY
          test "$rc" -eq 1
