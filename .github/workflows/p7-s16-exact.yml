name: P7-S16 exact external v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s16-exact-verification-20261108]
    paths: [".github/workflows/p7-s16-exact.yml"]
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact S16 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s16-historical-lineage-immutable-20261108
          git -C candidate checkout --detach b616174be7d9c31f8477b6090856be3351d96251
          test "$(git -C candidate rev-parse HEAD)" = "b616174be7d9c31f8477b6090856be3351d96251"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "6c879357a650678e18cb67ce3aadabc65085e878"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=b616174be7d9c31f8477b6090856be3351d96251
          echo EXACT_TREE=6c879357a650678e18cb67ce3aadabc65085e878
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base b616174be7d9c31f8477b6090856be3351d96251 --head b616174be7d9c31f8477b6090856be3351d96251 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          PY
          test "$rc" -eq 1
