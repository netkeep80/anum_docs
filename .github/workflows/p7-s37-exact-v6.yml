name: P7-S37 exact verification (TEMPORARY DO NOT MERGE)

on:
  push:
    branches: [diagnostics/p7-s37-exact-v6-20261110]
    paths: [".github/workflows/p7-s37-exact-v6.yml"]

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          fetch-depth: 1
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact BASE-to-HEAD RepoGuard v6 replay
        shell: bash
        run: |
          set -euo pipefail
          BASE=705433694c2a5c3fe4a0f80d4e7b8e3fb448d82d
          HEAD=83efce3ef27a6a4558e51790f240faccffa28f5d
          git -C candidate fetch origin migration/p7-s37-repo-policy-retirement-20261110
          git -C candidate checkout --detach "$HEAD"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            check --base "$BASE" --head "$HEAD" --format json > "$RUNNER_TEMP/report.json"
          python3 - <<'PY'
          import json, os
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"report.json")))
          print("OK",o.get("ok"))
          print("BASE",o.get("base"))
          print("HEAD",o.get("head"))
          print("J1",o.get("j1"))
          print("J2",o.get("j2"))
          print("J3",o.get("j3"))
          print("DIAGNOSTICS",o.get("diagnostics"))
          assert o["ok"] is True
          assert o["base"]=="705433694c2a5c3fe4a0f80d4e7b8e3fb448d82d"
          assert o["head"]=="83efce3ef27a6a4558e51790f240faccffa28f5d"
          assert o["j1"]["base"] is True and o["j1"]["head"] is True
          assert o["j2"]["base"] is True and o["j2"]["head"] is True
          assert o["j3"]["ok"] is True
          assert o["diagnostics"]==[]
          print("P7_S37_EXACT_V6=PASS")
          PY

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 83efce3ef27a6a4558e51790f240faccffa28f5d
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix vendor/repo-guard --ignore-scripts --no-audit --no-fund --omit=dev
      - run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund
      - run: npm --prefix ts run check:full
