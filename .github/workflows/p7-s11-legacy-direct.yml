name: P7-S11 legacy RepoGuard exact check-pr diagnostic temporary
on:
  push:
    branches: [chore/p7-s11-observe-reader-yaml-20261108]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  old-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: c19f29da366c985e2cf162ef7e75f5594f60c3a2
          persist-credentials: false
          path: oldguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Direct old check-pr with exact actual PR event payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin refs/heads/feat/p7-s11-runtime-reader-closure-20261108
          git -C candidate checkout --detach ce016bee2c3fd2bcc1728f40136b578d4f739d81
          test "$(git -C candidate rev-parse HEAD)" = ce016bee2c3fd2bcc1728f40136b578d4f739d81
          test "$(git -C candidate rev-parse HEAD^{tree})" = de9a7dd19570b55014e69f35b1b4557711de04df
          test "$(git -C oldguard rev-parse HEAD)" = c19f29da366c985e2cf162ef7e75f5594f60c3a2
          npm ci --prefix oldguard --omit=dev --ignore-scripts --no-audit --no-fund
          gh api repos/netkeep80/anum_docs/pulls/2362 --jq '.body' > "$RUNNER_TEMP/pr-body.txt"
          jq -n --rawfile body "$RUNNER_TEMP/pr-body.txt" \
            --arg base d58c140b3f9b40fdc52507b6080a41863f1d9a66 \
            --arg head ce016bee2c3fd2bcc1728f40136b578d4f739d81 \
            '{pull_request:{number:2362,base:{sha:$base,ref:"main"},head:{sha:$head},body:$body},repository:{full_name:"netkeep80/anum_docs"}}' \
            > "$RUNNER_TEMP/pr-event.json"
          set +e
          RG_EVENT_PATH="$RUNNER_TEMP/pr-event.json" \
            node "$GITHUB_WORKSPACE/oldguard/dist/repo-guard.mjs" \
              --repo-root "$GITHUB_WORKSPACE/candidate" --enforcement blocking check-pr --format json \
              > "$RUNNER_TEMP/old-report.json" 2>"$RUNNER_TEMP/old-error.log"
          rc=$?
          set -e
          echo "LEGACY_DIRECT_EXIT=$rc"
          cat "$RUNNER_TEMP/old-error.log"
          python3 - <<'PY'
          import os,json
          p=os.path.join(os.environ['RUNNER_TEMP'],'old-report.json')
          try: o=json.load(open(p))
          except Exception as e:
            print("NON_JSON_REPORT",repr(e)); raise
          print("RESULT",o.get("result"),"VIOLATION_COUNT",o.get("violationCount"))
          print("EXACT_CHECKED",o.get("evaluated") or o.get("headRef"))
          for x in o.get("violations",[]):
            print("LEGACY_VIOLATION",json.dumps(x,ensure_ascii=False)[:9000])
          for x in o.get("advisoryWarnings",[]):
            print("ADVISORY",json.dumps(x,ensure_ascii=False)[:1000])
          PY
