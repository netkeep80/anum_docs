name: P7-S11 exact candidate external J1 CURRENT FULL temporary
on:
  push:
    branches: [chore/p7-s11-observe-reader-yaml-20261108]
permissions:
  contents: read
jobs:
  external-s11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Exact S11 candidate J1/J2 and 43 CURRENT/160 FULL
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin refs/heads/feat/p7-s11-runtime-reader-closure-20261108
          git -C candidate checkout --detach ce016bee2c3fd2bcc1728f40136b578d4f739d81
          test "$(git -C candidate rev-parse HEAD)" = "ce016bee2c3fd2bcc1728f40136b578d4f739d81"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "de9a7dd19570b55014e69f35b1b4557711de04df"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base ce016bee2c3fd2bcc1728f40136b578d4f739d81 --head ce016bee2c3fd2bcc1728f40136b578d4f739d81 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo "EXACT_HEAD=ce016bee2c3fd2bcc1728f40136b578d4f739d81"
          echo "EXACT_TREE=de9a7dd19570b55014e69f35b1b4557711de04df"
          echo "COMPILER_EXIT=$rc"
          python3 - <<'PY'
          import json,os,collections
          o=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'j1.json')))
          unjustified=sorted(x['subject'].split(':',1)[1] for x in o.get('diagnostics',[]) if x.get('code')=='unjustified_resource')
          print("J1_ACTUAL",o.get('j1'))
          print("J2_ACTUAL",o.get('j2'))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(x.split('/')[0] for x in unjustified)))
          PY
          test "$rc" -eq 1
          npm ci --prefix candidate/vendor/repo-guard --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate/ts --ignore-scripts --no-audit --no-fund
          (cd candidate/ts && npm run check:current)
          (cd candidate/ts && npm run check:full)
