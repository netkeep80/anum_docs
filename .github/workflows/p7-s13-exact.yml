name: P7-S13 exact external v6 and test tiers (TEMPORARY)
on:
  push:
    branches: [chore/p7-s13-exact-verification-20261108]
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact candidate J1/J2, CURRENT and FULL
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin refs/heads/cleanup/p7-s13-bulk-falsification-20261108
          git -C candidate checkout --detach 6744ab8dc2bae1442444ba45f68601ff1618bfa5
          test "$(git -C candidate rev-parse HEAD)" = "6744ab8dc2bae1442444ba45f68601ff1618bfa5"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "abcd6bb319b04d68dfdc46bb532edb51caf57c3e"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=6744ab8dc2bae1442444ba45f68601ff1618bfa5
          echo EXACT_TREE=abcd6bb319b04d68dfdc46bb532edb51caf57c3e
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 6744ab8dc2bae1442444ba45f68601ff1618bfa5 --head 6744ab8dc2bae1442444ba45f68601ff1618bfa5 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'j1.json')))
          ps=sorted(x['subject'].split(':',1)[1] for x in o.get('diagnostics',[]) if x.get('code')=='unjustified_resource')
          print('J1_ACTUAL',o.get('j1'))
          print('J2_ACTUAL',o.get('j2'))
          print('UNJUSTIFIED_COUNT',len(ps))
          print('UNJUSTIFIED_GROUPS',dict(collections.Counter(p.split('/')[0] for p in ps)))
          PY
          test "$rc" -eq 1
          npm ci --prefix candidate/vendor/repo-guard --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate/ts --ignore-scripts --no-audit --no-fund
          (cd candidate/ts && npm run check:current)
          (cd candidate/ts && npm run check:full)
