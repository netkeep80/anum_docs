name: P7-S9 exact candidate external J1 CURRENT FULL (temporary)
on:
  push:
    branches: [chore/p7-s9-exact-diagnostic-20261108]
permissions:
  contents: read
jobs:
  exact-s9:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Assert candidate exact identities and replay external v6 CURRENT FULL
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin refs/heads/feat/p7-s9-reader-preview-inputs-20261108
          git -C candidate checkout --detach e734a61a67973b1be9a2423fc9d43aaefe618bcf
          test "$(git -C candidate rev-parse HEAD)" = "e734a61a67973b1be9a2423fc9d43aaefe618bcf"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "2af83ddfb442213ee7eeb403bf87282003bf3772"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base e734a61a67973b1be9a2423fc9d43aaefe618bcf --head e734a61a67973b1be9a2423fc9d43aaefe618bcf --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo "EXACT_HEAD=e734a61a67973b1be9a2423fc9d43aaefe618bcf"
          echo "EXACT_TREE=2af83ddfb442213ee7eeb403bf87282003bf3772"
          echo "COMPILER_EXIT=$rc"
          python3 - <<'PY'
          import json,os,collections
          o=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'j1.json')))
          unjustified=sorted(x['subject'].split(':',1)[1] for x in o.get('diagnostics',[]) if x.get('code')=='unjustified_resource')
          print("J1_ACTUAL",o.get('j1'))
          print("J2_ACTUAL",o.get('j2'))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(x.split('/')[0] for x in unjustified)))
          PY
          test "$rc" -eq 1
          npm ci --prefix candidate/vendor/repo-guard --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate/ts --ignore-scripts --no-audit --no-fund
          (cd candidate/ts && npm run check:current)
          (cd candidate/ts && npm run check:full)
