name: agent-rename-rooted-link-network

on:
  push:
    branches:
      - agent/rename-rooted-link-network

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rename-rooted-link-network
          fetch-depth: 0

      - name: Rename occurrence vocabulary mechanically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/agent-rename-rooted-link-network.yml')
          old_module = Path('core/exact_link_network.py')
          new_module = Path('core/rooted_link_network.py')
          old_test = Path('tests/test_mts_exact_occurrence_link_network.py')
          new_test = Path('tests/test_mts_rooted_link_network.py')

          if not old_module.is_file() or new_module.exists():
              raise SystemExit('unexpected rooted-link module state')
          if not old_test.is_file() or new_test.exists():
              raise SystemExit('unexpected rooted-link test state')

          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('OccurrenceRef', 'LinkRef').replace(
                  'exact_link_network', 'rooted_link_network'
              )
              updated = updated.replace(
                  '``LinkRef`` is retained temporarily as a network-local technical access\n'
                  'handle. Its slot/object identity is not an MTS identity component.',
                  '``LinkRef`` is a network-local technical access handle. Its slot/object '
                  'identity is not an MTS identity component.',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          old_module.rename(new_module)
          old_test.rename(new_test)

          forbidden = ('OccurrenceRef', 'exact_link_network', 'test_mts_exact_occurrence_link_network')
          leftovers = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(token in text for token in forbidden):
                  leftovers.append(path.as_posix())

          if leftovers:
              raise SystemExit('old occurrence vocabulary remains in: ' + ', '.join(leftovers))

          print(f'updated {len(changed)} text files')
          PY

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/agent-rename-rooted-link-network.yml

      - name: Commit atomic rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Убрать occurrence-терминологию из Foundation-v2 runtime API"
          git push origin HEAD:agent/rename-rooted-link-network
