name: P7-S36 exact candidate verification (TEMPORARY DO NOT MERGE)

on:
  push:
    branches: [diagnostics/p7-s36-exact-v6-20261110]
    paths: [".github/workflows/p7-s36-exact-v6.yml"]

permissions:
  contents: read

jobs:
  exact-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - name: Pin exact S36 candidate
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin migration/p7-s36-repoguard-v6-blocking-cutover-20261110\n          git -C candidate checkout --detach d368ccc525db95a91f3132ee801a387548ddb7a3
          test "$(git -C candidate rev-parse HEAD)" = "d368ccc525db95a91f3132ee801a387548ddb7a3"
          test "$(git -C candidate rev-parse 9bdca48e10f9ac80e5a539495c040c425851854a)" = "9bdca48e10f9ac80e5a539495c040c425851854a"
      - name: Run pinned RepoGuard v6 Action on exact BASE to HEAD
        id: guard
        uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          repo-root: ${{ github.workspace }}/candidate
          base: 9bdca48e10f9ac80e5a539495c040c425851854a
          head: d368ccc525db95a91f3132ee801a387548ddb7a3
      - name: Assert exact v6 result
        shell: bash
        run: |
          test "${{ steps.guard.outputs.result }}" = "passed"
          echo "${{ steps.guard.outputs.summary }}"
          echo P7_S36_EXACT_V6_ACTION=PASS

  current:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d368ccc525db95a91f3132ee801a387548ddb7a3
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund
      - run: npm --prefix ts run check:current

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d368ccc525db95a91f3132ee801a387548ddb7a3
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts --ignore-scripts --no-audit --no-fund
      - run: npm --prefix ts run check:full
