name: P7-S14 exact external v6.0.1 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s13-exact-verification-20261108]
    paths: [".github/workflows/p7-s14-exact.yml"]
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact unmodified PR candidate J1/J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s14-current-evidence-suite-20261108
          git -C candidate checkout --detach 94b3f13accca95684e904d0e090036edc2a86e61
          test "$(git -C candidate rev-parse HEAD)" = "94b3f13accca95684e904d0e090036edc2a86e61"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "e76fbcb2bd49e4e052c99c1b4b4d67a80314d279"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_PR_HEAD=94b3f13accca95684e904d0e090036edc2a86e61
          echo EXACT_PR_TREE=e76fbcb2bd49e4e052c99c1b4b4d67a80314d279
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 94b3f13accca95684e904d0e090036edc2a86e61 --head 94b3f13accca95684e904d0e090036edc2a86e61 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          PY
          test "$rc" -eq 1
