name: P7-S28 exact legacy RG3.2.4 violation diagnostics (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  legacy:
    name: Exact S28 candidate legacy RepoGuard 3.2.4 diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: c19f29da366c985e2cf162ef7e75f5594f60c3a2
          persist-credentials: false
          path: oldguard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact candidate / oldguard and real PR body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s28-retire-orphan-a9-research-test-20261110
          git -C candidate checkout --detach ac954ccb44a4d41c80a61b59fcbab764bd89f5b3
          test "$(git -C candidate rev-parse HEAD)" = "ac954ccb44a4d41c80a61b59fcbab764bd89f5b3"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "bd09b8aff1cbcc3c748176176c6acb169dc327d5"
          test "$(git -C oldguard rev-parse HEAD)" = "c19f29da366c985e2cf162ef7e75f5594f60c3a2"
          npm ci --prefix oldguard --omit=dev --ignore-scripts --no-audit --no-fund
          curl --fail --silent --show-error -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/netkeep80/anum_docs/pulls/2410" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import os,json
          d=os.environ["RUNNER_TEMP"]
          p=json.load(open(d+"/pr.json"))
          assert p["number"]==2410
          assert p["base"]["sha"]=="fd399ce7c0fb1a77c15a3b5d290bc610fe871022"
          assert p["head"]["sha"]=="ac954ccb44a4d41c80a61b59fcbab764bd89f5b3"
          assert p["state"]=="open"
          event={"repository":{"full_name":"netkeep80/anum_docs"},"pull_request":{"number":2410,"base":{"sha":p["base"]["sha"],"ref":"main"},"head":{"sha":p["head"]["sha"]},"body":p.get("body") or ""}}
          json.dump(event,open(d+"/event.json","w"))
          print("S28_EXACT_LEGACY_PR_EVENT=PASS")
          PY
          export RG_EVENT_PATH="$RUNNER_TEMP/event.json"
          set +e
          node "$GITHUB_WORKSPACE/oldguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" --enforcement blocking check-pr --format json > "$RUNNER_TEMP/rg32.json" 2> "$RUNNER_TEMP/rg32.err"
          rc=$?
          set -e
          echo "S28_LEGACY_EXIT=$rc"
          python3 - <<'PY'
          import os,json
          d=os.environ["RUNNER_TEMP"]; file=d+"/rg32.json"
          try:
            o=json.load(open(file))
            print("LEGACY_KEYS", list(o.keys()))
            for key in ["result","reasonCode","passed","warningCount","violationCount","warnings","violations","diagnostics","checks","rules","changeIntent","policy"]:
              v=o.get(key)
              if v is not None: print("LEGACY_"+key.upper(),json.dumps(v,ensure_ascii=False)[:25000])
          except Exception as e:
            print("S28_LEGACY_PARSE_ERROR",repr(e),open(file).read()[:10000])
          print("LEGACY_STDERR",open(d+"/rg32.err").read()[:3000])
          PY
          echo S28_LEGACY_DIAGNOSTIC_COLLECTED=1
          # A negative report is an expected outcome for a diagnostic investigation.
