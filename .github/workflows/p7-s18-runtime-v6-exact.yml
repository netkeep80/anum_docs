name: P7-S20 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S20 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s20-current-docs-check-inputs-20261109
          git -C candidate checkout --detach a110a9034e19b51702acf1d423bd6998ecb6351e
          test "$(git -C candidate rev-parse HEAD)" = "a110a9034e19b51702acf1d423bd6998ecb6351e"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "f3f50082e8a7925085496f2615cbcc76da07c3cf"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=a110a9034e19b51702acf1d423bd6998ecb6351e
          echo EXACT_TREE=f3f50082e8a7925085496f2615cbcc76da07c3cf
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base a110a9034e19b51702acf1d423bd6998ecb6351e --head a110a9034e19b51702acf1d423bd6998ecb6351e --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          expected={'requirements/mts-v0.13.json','traceability/markdown-stable-anchor-baseline.json','requirements/publication/MTS-EA-v1.yaml'}
          assert o['j1']['tracked']==655 and o['j1']['justified']==493, "unexpected J1 counts"
          assert len(paths)==162 and not expected.intersection(paths), "unexpected three-resource closure"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S20_THREE_EXACT_DOCS_CHECK_INPUTS=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1
