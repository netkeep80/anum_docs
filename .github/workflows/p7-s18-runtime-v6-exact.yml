name: P7-S22 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S22 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s22-proof-evidence-bounded-ownership-20261109
          git -C candidate checkout --detach c9a481c2afe8cba1c908449f87950d934d0b71e8
          test "$(git -C candidate rev-parse HEAD)" = "c9a481c2afe8cba1c908449f87950d934d0b71e8"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "f6a2fba816579a94195d45614069dfea38d09936"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=c9a481c2afe8cba1c908449f87950d934d0b71e8
          echo EXACT_TREE=f6a2fba816579a94195d45614069dfea38d09936
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base c9a481c2afe8cba1c908449f87950d934d0b71e8 --head c9a481c2afe8cba1c908449f87950d934d0b71e8 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          expected={'ts/src/tooling/v015-native-evidence-verifier.ts','ts/src/tooling/v015-root-basis-evidence-verifier.ts','ts/src/tooling/v015-semantic-metamodel-evidence-verifier-v02.ts','ts/src/tooling/v015-semantic-metamodel-evidence-verifier.ts','ts/src/tooling/v015-theorem-statement-evidence-verifier.ts','ts/src/v015-proof-source.ts','ts/test/v015-native-evidence-verifier.test.ts','ts/test/v015-root-basis-evidence-verifier.test.ts','ts/test/v015-semantic-metamodel-evidence-verifier-v02.test.ts','ts/test/v015-theorem-statement-evidence-verifier.test.ts'}
          assert o['j1']['tracked']==655 and o['j1']['justified']==514, "unexpected J1 counts"
          assert len(paths)==141 and not expected.intersection(paths), "unexpected ten-resource closure"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S22_TEN_PROOF_EVIDENCE_CLOSURE=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1
