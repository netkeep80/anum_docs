name: P7-S25 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S25 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s25-observed-evidence-witness-closure-20261110
          git -C candidate checkout --detach f21365ae1936809e0d0503ff4bf2602f5139b7ef
          test "$(git -C candidate rev-parse HEAD)" = "f21365ae1936809e0d0503ff4bf2602f5139b7ef"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "f01d460ba3f5c9e13885ba6d32586cc9649bed7e"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=f21365ae1936809e0d0503ff4bf2602f5139b7ef
          echo EXACT_TREE=f01d460ba3f5c9e13885ba6d32586cc9649bed7e
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base f21365ae1936809e0d0503ff4bf2602f5139b7ef --head f21365ae1936809e0d0503ff4bf2602f5139b7ef --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          print("EXPECTED_S25_OWNED_SOURCES",sorted(expected))
          expected={'ts/test/research-v013-append-only-currentness-falsifier-a72n.test.ts','ts/test/research-v013-context-dualization-a75b.test.ts','ts/test/research-v013-static-fixity-a7.test.ts','ts/test/research-v013-finite-recursive-description-boundary.test.ts','ts/test/research-v013-execution-entry-root-chirality-a68c.test.ts','ts/test/research-physical-dot-bootstrap.test.ts'}
          assert o['j1']['tracked']==651 and o['j1']['justified']==540, "unexpected J1 counts"
          assert len(paths)==111 and not expected.intersection(paths), "unexpected six restored witness ownership"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S25_SIX_OBSERVED_WITNESSES=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1
