name: P7-S26 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S26 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s26-approved-formal-source-integrity-20261110
          git -C candidate checkout --detach e8172e94719125d1742699ea7094ab3a3f7de8a4
          test "$(git -C candidate rev-parse HEAD)" = "e8172e94719125d1742699ea7094ab3a3f7de8a4"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "fd5ddf53f0341b7878eca3fa9aff17f46b5d8197"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=e8172e94719125d1742699ea7094ab3a3f7de8a4
          echo EXACT_TREE=fd5ddf53f0341b7878eca3fa9aff17f46b5d8197
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base e8172e94719125d1742699ea7094ab3a3f7de8a4 --head e8172e94719125d1742699ea7094ab3a3f7de8a4 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          expected={'formal/v0.15/regression/grounded-zero-role.formal','formal/v0.15/regression/grounded-zero-role.json','formal/v0.15/regression/grounded-zero-role.recursive','formal/v0.15/regression/two-role-meta-rule.formal','formal/v0.15/regression/two-role-meta-rule.json','formal/v0.15/regression/two-role-meta-rule.recursive'}
          print("EXPECTED_S26_OWNED_INPUTS",sorted(expected))
          assert o['j1']['tracked']==651 and o['j1']['justified']==546, "unexpected J1 counts"
          assert len(paths)==105 and not expected.intersection(paths), "unexpected six approved physical source inputs"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S26_SIX_APPROVED_SOURCE_INPUTS=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1
