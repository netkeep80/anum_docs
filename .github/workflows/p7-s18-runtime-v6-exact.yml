name: P7-S23 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S23 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s23-retire-unreferenced-research-by-falsification-20261109
          git -C candidate checkout --detach ba85d95fd86bd1f4353115d5d965e010403c0308
          test "$(git -C candidate rev-parse HEAD)" = "ba85d95fd86bd1f4353115d5d965e010403c0308"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "3ae09a7df6c196cd56290a979d02b4aefcbe3f6f"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=ba85d95fd86bd1f4353115d5d965e010403c0308
          echo EXACT_TREE=3ae09a7df6c196cd56290a979d02b4aefcbe3f6f
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base ba85d95fd86bd1f4353115d5d965e010403c0308 --head ba85d95fd86bd1f4353115d5d965e010403c0308 --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          expected={'ts/test/research-v013-formal-duality-a75c.test.ts','ts/test/research-v013-full-duality-audit-a75f.test.ts','ts/test/research-v013-grounded-execution-dualization-a75e.test.ts','ts/test/research-v013-theory-authority-dualization-a75d.test.ts'}
          assert o['j1']['tracked']==651 and o['j1']['justified']==514, "unexpected J1 counts"
          assert len(paths)==137 and not expected.intersection(paths), "unexpected four-resource trial"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S23_FOUR_TRIAL_DELETIONS=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1

  full:
    name: S23 exact candidate FULL behavior
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ba85d95fd86bd1f4353115d5d965e010403c0308
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run exact candidate check FULL and Observatory
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba85d95fd86bd1f4353115d5d965e010403c0308"
          test "$(git rev-parse HEAD^{tree})" = "3ae09a7df6c196cd56290a979d02b4aefcbe3f6f"
          npm ci --prefix vendor/repo-guard --ignore-scripts --no-audit --no-fund --omit=dev
          npm ci --prefix ts --ignore-scripts --no-audit --no-fund
          npm --prefix ts run check:full
          ./ts/node_modules/.bin/tsc -p web/contract-observatory/tsconfig.json
          node web/contract-observatory/dist/test/contract-index.test.js
          node web/contract-observatory/dist/test/site.test.js
          echo S23_EXACT_FULL_SUCCESS=1
  legacy-diag:
    name: S23 legacy RG 3.2.4 exact violation diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ba85d95fd86bd1f4353115d5d965e010403c0308
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: c19f29da366c985e2cf162ef7e75f5594f60c3a2
          persist-credentials: false
          path: oldguard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Probe legacy exact violations without hiding machine report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C candidate fetch origin main
          test "$(git -C candidate rev-parse HEAD)" = "ba85d95fd86bd1f4353115d5d965e010403c0308"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "3ae09a7df6c196cd56290a979d02b4aefcbe3f6f"
          npm ci --prefix oldguard --omit=dev --ignore-scripts --no-audit --no-fund
          curl --fail --silent --show-error -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/netkeep80/anum_docs/pulls/2400" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json,os
          tmp=os.environ['RUNNER_TEMP']; p=json.load(open(tmp+'/pr.json'))
          obj={'repository':{'full_name':'netkeep80/anum_docs'},'pull_request':{'number':2400,'base':{'sha':'ace1aa51a3baaa0a7dd551a6914bc9c8362ec32d','ref':'main'},'head':{'sha':'ba85d95fd86bd1f4353115d5d965e010403c0308'},'body':p.get('body') or ''}}
          json.dump(obj,open(tmp+'/event.json','w'))
          PY
          export RG_EVENT_PATH="$RUNNER_TEMP/event.json"
          set +e
          node "$GITHUB_WORKSPACE/oldguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" --enforcement blocking check-pr --format json > "$RUNNER_TEMP/rg32.json" 2> "$RUNNER_TEMP/rg32.err"
          rc=$?
          set -e
          echo S23_LEGACY_EXIT="$rc"
          python3 - <<'PY'
          import os,json
          tmp=os.environ['RUNNER_TEMP']
          try:
            o=json.load(open(tmp+'/rg32.json'))
            print('LEGACY_RESULT',o.get('result'))
            print('LEGACY_VIOLATION_COUNT',o.get('violationCount'))
            for k in ['violations','checks','results','rules','diagnostics']:
              v=o.get(k)
              if v is not None: print('LEGACY_FIELD_'+k.upper(),json.dumps(v,ensure_ascii=False)[:21000])
            print('LEGACY_KEYS',list(o.keys()))
          except Exception as e:
            print('LEGACY_JSON_PARSE_ERROR',str(e)); print(open(tmp+'/rg32.json').read()[:5000])
          print('LEGACY_STDERR',open(tmp+'/rg32.err').read()[:2500])
          PY
          test "$rc" -eq 0
