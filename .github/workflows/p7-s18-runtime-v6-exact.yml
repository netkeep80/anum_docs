name: P7-S27 candidate exact v6 J1 J2 (TEMPORARY)
on:
  push:
    branches: [chore/p7-s18-runtime-v6-20261109]
    paths: [".github/workflows/p7-s18-runtime-v6-exact.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact P7-S27 candidate J1 and J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s27-native-fnd02-fnd13-witness-pins-20261110
          git -C candidate checkout --detach 2e1c4362ef91b732ef7572133367c249de71853c
          test "$(git -C candidate rev-parse HEAD)" = "2e1c4362ef91b732ef7572133367c249de71853c"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "59a5f1ea90d8e815d202db01fc2fb02bdf06aaf4"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=2e1c4362ef91b732ef7572133367c249de71853c
          echo EXACT_TREE=59a5f1ea90d8e815d202db01fc2fb02bdf06aaf4
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 2e1c4362ef91b732ef7572133367c249de71853c --head 2e1c4362ef91b732ef7572133367c249de71853c --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import os,json,collections
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          paths=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(paths))
          expected={'ts/test/recursive-link-identity-proof.test.ts','ts/test/v013-aspect-foundation-theorem.test.ts','ts/test/v013-cyclic-grounding-boundary.test.ts'}
          print("EXPECTED_S27_NATIVE_WITNESSES",sorted(expected))
          assert o['j1']['tracked']==651 and o['j1']['justified']==549, "unexpected J1 counts"
          assert len(paths)==102 and not expected.intersection(paths), "unexpected three FND-02/FND-13 source witnesses"
          assert o['j2']['rooted']==54 and o['j2']['head'] is True, "unexpected J2"
          print("P7_S27_THREE_NATIVE_SOURCE_PINS=PASS")
          print("UNJUSTIFIED_GROUPS",dict(collections.Counter(p.split("/")[0] for p in paths)))
          for p in paths: print("J1_UNJUSTIFIED_PATH",p)
          PY
          test "$rc" -eq 1
