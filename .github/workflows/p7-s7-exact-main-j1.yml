name: P7-S7 exact merged-main J1 residual evidence (temporary)
on:
  push:
    branches: [feat/p7-evidence-closure-s7-20261108]
permissions:
  contents: read
jobs:
  exact-accepted-main:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: repoguard
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify exact accepted main and run external RepoGuard 6.0.1
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate checkout --detach 89d55eefbae7bb330df2ec82d006a47b0e8733ee
          test "$(git -C candidate rev-parse HEAD)" = "89d55eefbae7bb330df2ec82d006a47b0e8733ee"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "333bf3083f77b5983e6628f5a234c9b30efc6e73"
          test "$(git -C repoguard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          npm ci --prefix repoguard --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/s7"
          set +e
          node "$GITHUB_WORKSPACE/repoguard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base "89d55eefbae7bb330df2ec82d006a47b0e8733ee" --head "89d55eefbae7bb330df2ec82d006a47b0e8733ee" --format json > "$RUNNER_TEMP/s7/rg.json" 2>"$RUNNER_TEMP/s7/rg.err"
          rc=$?
          set -e
          test "$rc" -eq 1
          echo "EXACT_MAIN=89d55eefbae7bb330df2ec82d006a47b0e8733ee"
          jq -r '"EXACT_J1=\(.j1.tracked)/\(.j1.justified)/\(.j1.tracked-.j1.justified) EXACT_J2=\(.j2.rooted) DIAGNOSTICS=\(.diagnostics|length)"' "$RUNNER_TEMP/s7/rg.json"
          python3 - <<'PY'
          import json,collections,os
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"s7","rg.json")))
          paths=[]
          for x in o.get("diagnostics",[]):
            if x.get("code")=="unjustified_resource":
              paths.append(x["subject"].split(":",1)[1])
          groups=collections.defaultdict(list)
          for path in sorted(paths):
            key=path.split("/",1)[0] if "/" in path else "<root>"
            groups[key].append(path)
          print("TOTAL_EXACT_UNJUSTIFIED",len(paths))
          for key,files in sorted(groups.items(),key=lambda x:(-len(x[1]),x[0])):
            print("UNJUSTIFIED_GROUP",key,"COUNT",len(files),"FIRST",json.dumps(files[:9],ensure_ascii=False))
          for prefix in ["ts/src/","ts/test/","formal/","proofs/","contracts/","audits/","cutover/","web/","requirements/","reviews/","profiles/","theorems/"]:
            subset=[p for p in paths if p.startswith(prefix)]
            print("UNJUSTIFIED_SUBTREE",prefix,"COUNT",len(subset))
            if prefix not in ["ts/test/","requirements/"]: print("UNJUSTIFIED_PATHS",prefix,json.dumps(sorted(subset)[:55],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-s7-exact-main-receipt
          path: ${{ runner.temp }}/s7/
          retention-days: 3
