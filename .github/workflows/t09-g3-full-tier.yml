name: T09 G3 Temporary Exact Head Full Tier
on:
  push:
    branches:
      - "probe/t09-g3-full-tier-20261015"
    paths:
      - '.github/workflows/t09-g3-full-tier.yml'
permissions:
  contents: read
concurrency:
  group: t09-g3-temporary-exact-head
  cancel-in-progress: false
jobs:
  full-tier:
    name: Exact T09 source on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact T09 PR head (not probe commit)
        uses: actions/checkout@v6
        with:
          ref: 0dd62e6ee6c6a6b568d6fddbf6c6265ee43c18ab
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify source identity and execute full tier
        shell: bash
        env:
          T09_EXPECT_HEAD: 0dd62e6ee6c6a6b568d6fddbf6c6265ee43c18ab
          T09_MAIN: 63bd6624e0e030b26ca5a79bc676892ed1408594
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/t09-g3-evidence"
          mkdir -p "$OUT"
          FAIL=0
          g3_capture() {
            local label="$1"; shift
            set +e
            "$@" > "$OUT/${label}.stdout.log" 2> "$OUT/${label}.stderr.log"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/${label}.exit-code"
            echo "G3_GATE_${label}=$code"
            if [ "$code" -ne 0 ]; then FAIL=1; fi
          }
          printf '%s\n' "$T09_EXPECT_HEAD" > "$OUT/expected-head.txt"
          printf '%s\n' "$T09_MAIN" > "$OUT/expected-main.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/probe-workflow-commit.txt"
          git rev-parse HEAD > "$OUT/actual-head.txt"
          git rev-parse HEAD^{tree} > "$OUT/actual-tree.txt"
          node --version > "$OUT/node-version.txt"
          npm --version > "$OUT/npm-version.txt"
          git status --porcelain=v1 > "$OUT/working-tree-before.txt"
          sha256sum ts/package-lock.json > "$OUT/lockfile-sha256.txt"
          git hash-object ts/package-lock.json > "$OUT/lockfile-git-blob.txt"
          git hash-object ts/src/v016-functional-formal.ts > "$OUT/source-git-blob.txt"
          git hash-object ts/test/v016-functional-formal-t09.test.ts > "$OUT/test-git-blob.txt"
          {
            test "$(git rev-parse HEAD)" = "$T09_EXPECT_HEAD"
            test "$(git merge-base "$T09_MAIN" HEAD)" = "$T09_MAIN"
            test ! -s "$OUT/working-tree-before.txt"
            test "$(node -p 'process.versions.node.split(".")[0]')" = 24
            test "$(cat "$OUT/source-git-blob.txt")" = '4259027a2d8c61c5d03b4966b11642991cb47f5e'
            test "$(cat "$OUT/test-git-blob.txt")" = '8cefc610cbf0e283d134102e8d56554a824a24bf'
            test "$(cat "$OUT/lockfile-git-blob.txt")" = '60ac4e41329fccca45f8c1bf4480905e292b6de2'
          } > "$OUT/provenance.stdout.log" 2> "$OUT/provenance.stderr.log" || {
            echo 'SOURCE_PROVENANCE_FAILED' | tee "$OUT/verdict.txt"
            exit 2
          }
          echo 'SOURCE_PROVENANCE=PASS'
          g3_capture git-diff-check git diff --check "$T09_MAIN...HEAD"
          g3_capture git-diff-stat git diff --stat "$T09_MAIN...HEAD"
          g3_capture git-name-status git diff --name-status "$T09_MAIN...HEAD"
          g3_capture npm-ci npm ci --prefix ts --ignore-scripts --no-audit --no-fund
          if [ "$(cat "$OUT/npm-ci.exit-code")" -ne 0 ]; then
            echo 'DEPENDENCY_INSTALL_FAILED' | tee "$OUT/verdict.txt"
            exit 3
          fi
          g3_capture npm-check-current npm --prefix ts run check:current
          g3_capture npm-check-full npm --prefix ts run check:full
          set +e
          grep -F 'Executed 569 tests from full tier; full suite has 569 tests.' "$OUT/npm-check-full.stdout.log" > "$OUT/full-tier-count.txt"
          COUNT_RC=$?
          set -e
          printf '%s\n' "$COUNT_RC" > "$OUT/full-tier-count.exit-code"
          if [ "$COUNT_RC" -ne 0 ]; then FAIL=1; fi
          g3_capture working-tree-after git status --porcelain=v1
          {
            echo 'SCOPE=EXACT_T09_HEAD'
            echo "HEAD=$(cat "$OUT/actual-head.txt")"
            echo "NODE=$(cat "$OUT/node-version.txt")"
            echo "NPM=$(cat "$OUT/npm-version.txt")"
            echo "CURRENT_RC=$(cat "$OUT/npm-check-current.exit-code")"
            echo "FULL_RC=$(cat "$OUT/npm-check-full.exit-code")"
            echo "FULL_COUNT_RC=$COUNT_RC"
            echo "DIFF_CHECK_RC=$(cat "$OUT/git-diff-check.exit-code")"
            echo "G3_FAILED=$FAIL"
          } | tee "$OUT/verdict.txt"
          if [ "$FAIL" -ne 0 ]; then exit 4; fi
          echo 'T09_FULL_TIER_GREEN=PASS' | tee -a "$OUT/verdict.txt"
      - name: Write SHA256 evidence manifest
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/t09-g3-evidence"
          mkdir -p "$OUT"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          echo "Evidence files: $(find "$OUT" -type f | wc -l)"
      - name: Upload evidence (even if full tier fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-g3-exact-head-full-tier
          path: ${{ runner.temp }}/t09-g3-evidence/
          retention-days: 30
          if-no-files-found: error
