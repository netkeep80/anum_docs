name: agent-add-rooted-vocabulary-veto

on:
  push:
    branches:
      - agent/rename-rooted-link-network

permissions:
  contents: write

jobs:
  add-veto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rename-rooted-link-network
          fetch-depth: 0

      - name: Add permanent vocabulary regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_mts_rooted_link_network.py')
          text = path.read_text(encoding='utf-8')
          if 'from pathlib import Path\n' not in text:
              text = text.replace('from dataclasses import fields\n', 'from dataclasses import fields\nfrom pathlib import Path\n')

          marker = 'def test_old_occurrence_api_vocabulary_does_not_return() -> None:'
          if marker not in text:
              text += '''\n\n\ndef test_old_occurrence_api_vocabulary_does_not_return() -> None:\n    root = Path(__file__).resolve().parents[1]\n    old_type = "Occurrence" + "Ref"\n    old_module = "exact_" + "link_network"\n    old_test = "test_mts_exact_" + "occurrence_link_network.py"\n\n    assert not (root / "core" / f"{old_module}.py").exists()\n    assert not (root / "tests" / old_test).exists()\n\n    for directory in (root / "core", root / "docs" / "specs", root / "tests"):\n        for source in directory.rglob("*"):\n            if not source.is_file() or source.suffix not in {".py", ".md"}:\n                continue\n            content = source.read_text(encoding="utf-8")\n            assert old_type not in content, source\n            assert old_module not in content, source\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-add-rooted-vocabulary-veto.yml

      - name: Commit regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Запретить возврат occurrence vocabulary в Foundation-v2 API"
          git push origin HEAD:agent/rename-rooted-link-network
