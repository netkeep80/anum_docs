name: P7-S33 exact pinned v6 J1 J2 (TEMPORARY DO NOT MERGE)
on:
  push:
    branches: [diagnostics/p7-s33-exact-v6-20261110]
    paths: [".github/workflows/p7-s33-exact-v6-diagnostic.yml"]
permissions: {contents: read, pull-requests: read, issues: read}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v6
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact S33 J1 J2
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch origin cleanup/p7-s33-exact-v014-traceability-erratum-20261110
          git -C candidate checkout --detach 28ec583d2c393999b9b3b5727f1031cbbf86855e
          test "$(git -C candidate rev-parse HEAD)" = "28ec583d2c393999b9b3b5727f1031cbbf86855e"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "803f1ac2b68d2ac9d6e23df560079764bfede0e5"
          test "$(git -C guard rev-parse HEAD)" = "74db97791e6da8a75287164f0d0b41579108f114"
          echo EXACT_HEAD=28ec583d2c393999b9b3b5727f1031cbbf86855e
          echo EXACT_TREE=803f1ac2b68d2ac9d6e23df560079764bfede0e5
          echo EXACT_GUARD=74db97791e6da8a75287164f0d0b41579108f114
          npm ci --prefix guard --omit=dev --ignore-scripts --no-audit --no-fund
          set +e
          node "$GITHUB_WORKSPACE/guard/dist/repo-guard.mjs" --repo-root "$GITHUB_WORKSPACE/candidate" check --base 28ec583d2c393999b9b3b5727f1031cbbf86855e --head 28ec583d2c393999b9b3b5727f1031cbbf86855e --format json > "$RUNNER_TEMP/j1.json" 2>"$RUNNER_TEMP/j1.err"
          rc=$?
          set -e
          echo RG_V6_EXIT=$rc
          python3 - <<'PY'
          import json,os
          o=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"j1.json")))
          unjustified=sorted(d["subject"].split(":",1)[1] for d in o.get("diagnostics",[]) if d.get("code")=="unjustified_resource")
          print("J1_ACTUAL",o.get("j1"))
          print("J2_ACTUAL",o.get("j2"))
          print("UNJUSTIFIED_COUNT",len(unjustified))
          print("S33_EXACT_HISTORIC_ERRATUM_STILL_UNJUSTIFIED","traceability/mts-v0.14-errata.json" in unjustified)
          assert o["j1"]["tracked"]==650 and o["j1"]["justified"]==556 and o["j1"]["head"] is False,"unexpected J1"
          assert len(unjustified)==94 and "traceability/mts-v0.14-errata.json" not in unjustified,"unexpected S33 J1"
          assert o["j2"]["rooted"]==54 and o["j2"]["head"] is True,"unexpected J2"
          print("P7_S33_EXACT_HISTORIC_ERRATUM=PASS")
          for path in unjustified: print("J1_UNJUSTIFIED_PATH",path)
          PY
          test "$rc" -eq 1
