name: repo-guard policy check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    name: repo-guard blocking check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # repo-guard exact consumer pin: state-replacement + linked-issue + large-diff fixes (#640/#650/#653)
      - name: Run repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@10f04af309fcb512dff3d690f595926472c52f40
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish repo-guard summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      # Temporary diagnostics for exact-head RG fail; remove before merge.
      - name: Dump repo-guard violation diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTION_ROOT="${RUNNER_WORKSPACE%/*}/_actions/netkeep80/repo-guard"
          CLI="$(find "$ACTION_ROOT" -type f -path '*/dist/repo-guard.mjs' -print -quit)"
          if [ -z "$CLI" ]; then echo 'Diagnostic CLI not found'; exit 0; fi
          node "$CLI" --repo-root "$GITHUB_WORKSPACE" --enforcement blocking check-pr --format json || true
