name: repo-guard policy check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    name: repo-guard blocking check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # repo-guard exact consumer pin: state-replacement + linked-issue + large-diff fixes (#640/#650/#653)
      - name: Run repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@8ee0ed9d6da56c93132e9ad6fda8d1c62c33fd34
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish repo-guard summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
