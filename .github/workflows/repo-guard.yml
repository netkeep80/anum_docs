name: repo-guard policy check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    name: repo-guard blocking check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RepoGuard exact consumer pin: include trusted SHA-bound size-rule growth grants (#685).
      - name: Run repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@c19f29da366c985e2cf162ef7e75f5594f60c3a2
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ github.token }}

      # Temporary #2282 diagnostics: remove after the exact failed rule is identified.
      - name: Diagnose blocking RepoGuard refusal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/netkeep80/repo-guard.git /tmp/rg-exact
          git -C /tmp/rg-exact checkout --quiet --detach c19f29da366c985e2cf162ef7e75f5594f60c3a2
          npm ci --prefix /tmp/rg-exact --omit=dev --ignore-scripts --no-audit --no-fund --silent
          node /tmp/rg-exact/dist/repo-guard.mjs --repo-root "$GITHUB_WORKSPACE" --enforcement blocking check-pr --format json > /tmp/rg-exact-report.json || true
          jq '{result,reasonCode,message,violations,checks:([.checks[]? | select(.ok == false or .check.ok == false)]),keys:(keys)}' /tmp/rg-exact-report.json
      - name: Publish repo-guard summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
