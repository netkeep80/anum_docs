name: Branch hygiene

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ensure-pr:
    name: Ensure draft PR for side branch
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          existing="$(
            gh api --method GET "repos/$REPO/pulls"               -f state=open               -f head="$OWNER:$BRANCH"               -f base="$BASE"               --jq 'length'
          )"

          if [ "$existing" -gt 0 ]; then
            echo "Open PR already exists for $BRANCH."
            exit 0
          fi

          title="draft: ${BRANCH//\// }"
          body="$(
            cat <<EOF
Automatically opened by repository branch-hygiene policy.

- head: `$BRANCH`
- base: `$BASE`
- policy issue: #1637

Please replace this placeholder title/body with the task-specific PR description before marking the PR ready.
EOF
          )"

          gh api --method POST "repos/$REPO/pulls"             -f title="$title"             -f head="$BRANCH"             -f base="$BASE"             -f body="$body"             -F draft=true             --silent

          echo "Created draft PR for $BRANCH -> $BASE."

  delete-merged-head:
    name: Delete merged PR head branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete same-repository merged head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent 2>/dev/null; then
            echo "Deleted merged branch $BRANCH."
          else
            echo "Branch $BRANCH is already absent or cannot be deleted; nothing unsafe was attempted."
          fi

  sweep-fully-merged:
    name: Sweep fully merged stale branches
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches with no unique commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          open_heads="$(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100"               --jq '.[].head.ref' | sort -u
          )"

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100"               --jq '.[] | select(.protected == false) | .name'
          )

          deleted=0
          skipped=0

          for branch in "${branches[@]}"; do
            if [ "$branch" = "$BASE" ]; then
              continue
            fi

            if grep -Fxq "$branch" <<< "$open_heads"; then
              echo "KEEP open-PR branch: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            base_uri="$(jq -nr --arg v "$BASE" '$v|@uri')"
            branch_uri="$(jq -nr --arg v "$branch" '$v|@uri')"

            if ! compare="$(
              gh api "repos/$REPO/compare/$base_uri...$branch_uri" 2>/dev/null
            )"; then
              echo "KEEP unverified branch: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            ahead_by="$(jq -r '.ahead_by' <<< "$compare")"
            if [ "$ahead_by" != "0" ]; then
              echo "KEEP unique commits ($ahead_by): $branch"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" --silent 2>/dev/null; then
              echo "DELETE fully merged branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "KEEP delete failed: $branch"
              skipped=$((skipped + 1))
            fi
          done

          echo "Deleted: $deleted"
          echo "Kept/skipped: $skipped"
