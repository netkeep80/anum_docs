name: P6-D2 exact source-reference inventory (temporary)
on:
  push:
    branches: [chore/p6-j1-census-20261108]
permissions:
  contents: read
jobs:
  exact-reference-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Reproduce source paths and scan present-tense exact consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p6-ref"
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path.cwd()
          allpaths=subprocess.check_output(["git","ls-files","-z"]).decode().strip("\0").split("\0")
          tests=sorted(p for p in allpaths if p.startswith("ts/test/") and p.endswith(".test.ts"))
          textfiles={}
          for path in allpaths:
              if path in tests or path.startswith("vendor/"): continue
              try:
                  data=(root/path).read_bytes()
                  if b"\0" not in data:
                      textfiles[path]=data.decode("utf-8","replace")
              except (FileNotFoundError,IsADirectoryError): pass
          results=[]
          for path in tests:
              basename=path.rsplit("/",1)[-1]
              basename_without_ts=basename[:-3]
              # Include matches in another executable test, not only non-test text files
              refs=[]
              for candidate in allpaths:
                  if candidate==path or candidate.startswith("vendor/"): continue
                  data=textfiles.get(candidate)
                  if data is None and candidate in tests:
                      try: data=(root/candidate).read_text(encoding="utf-8")
                      except (UnicodeError,OSError): continue
                  if data and (path in data or basename in data or basename_without_ts in data):
                      refs.append(candidate)
              results.append({"path":path,"referencedBy":refs,"isResearch":basename.startswith("research-")})
          out={"sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
               "tracked":len(allpaths),"physicalTests":len(tests),
               "exactOrBasenameRefCount":sum(bool(x["referencedBy"]) for x in results),
               "unreferencedResearch":[x["path"] for x in results if x["isResearch"] and not x["referencedBy"]],
               "all":results}
          open(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"p6-ref"/"reference-candidates.json","w").write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print("physicalTests",len(tests),"unreferencedResearch",len(out["unreferencedResearch"]))
          for p in out["unreferencedResearch"]: print("UNREFERENCED_RESEARCH",p)
          print("===END-P6-REFERENCE-INVENTORY===")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-d2-exact-reference-inventory
          path: ${{ runner.temp }}/p6-ref/
          retention-days: 3
