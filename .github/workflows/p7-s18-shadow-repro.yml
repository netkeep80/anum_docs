name: P7-S18 shadowed Object.freeze adversarial replay (TEMPORARY)
on:
  push:
    branches: [diagnostics/p7-s18-shadow-global-object-20261109]
    paths: [".github/workflows/p7-s18-shadow-repro.yml"]
permissions: {contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check exact isolated mutant parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "99276773606fe460ad00f75a7bcc45cfa7f06b0c"
          echo "MUTANT_SOURCE_COMMIT=99276773606fe460ad00f75a7bcc45cfa7f06b0c"
      - name: Build the mutated FULL test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix vendor/repo-guard --ignore-scripts --no-audit --no-fund --omit=dev
          npm ci --prefix ts --ignore-scripts --no-audit --no-fund
          npm --prefix ts run build
      - name: Show original project-ownership checker false-green
        shell: bash
        run: |
          set -euo pipefail
          ( cd ts && node dist/test/test-tier.test.js )
          echo "MUTATED_OWNER_VERIFIER=EXIT_0"
      - name: Intercept actual fixture readers in the green mutated FULL test
        shell: bash
        run: |
          set -euo pipefail
          cat > monitor.mjs <<'EOF'
          import fs from "node:fs";
          import {syncBuiltinESMExports} from "node:module";
          const original = fs.readFileSync;
          const paths = new Set();
          fs.readFileSync = function (path, ...args) {
            if (typeof path === "string" && path.includes("examples/anum/conformance/q-hierarchical-")) {
              paths.add(path);
            }
            return Reflect.apply(original, fs, [path, ...args]);
          };
          syncBuiltinESMExports();
          process.on("exit", () => {
            console.log("OBSERVED_CONFORMANCE_READS=" + paths.size);
            console.log("OBSERVED_PATHS=" + JSON.stringify([...paths].sort()));
          });
          EOF
          ( cd ts && node --import ../monitor.mjs dist/test/quaternary-anum-hierarchical-two-memory.test.js ) | tee "$RUNNER_TEMP/reads.log"
          grep -F 'OBSERVED_CONFORMANCE_READS=3' "$RUNNER_TEMP/reads.log"
          echo "SHADOW_OBJECT_FALSE_GREEN=REPRODUCED"
